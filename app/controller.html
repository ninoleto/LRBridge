<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>LRBridge Web Controller</title>
    <style>
        body {
            margin: 0;
            background: #101418;
            color: #d7e1ea;
            font-family: Segoe UI, Arial, sans-serif;
        }

        .controller-header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 12px 22px;
            background: #161d24;
            border-bottom: 1px solid #28323d;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .header-help-button {
            display: inline-block;
            background: #273442;
            color: #ffffff;
            border: 1px solid #3b4b5c;
            border-radius: 7px;
            padding: 8px 12px;
            font-size: 14px;
            text-decoration: none;
        }

        .header-help-button:hover {
            background: #314151;
        }

        .tabs {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            padding: 0 22px;
            background: #0b1117;
            border-bottom: 1px solid #25313d;
        }

        .tab-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            background: transparent;
            color: #8fa2b3;
            border: 0;
            border-radius: 0;
            padding: 15px 18px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .tab-button:hover {
            background: #121b25;
            color: #d7e1ea;
        }

        .tab-button.active {
            background: #151f2a;
            color: #ffffff;
            box-shadow: inset 0 -3px 0 #ffb454;
        }

        .tab-button.active:hover {
            background: #182432;
            color: #ffffff;
        }

        .content {
            padding: 16px 22px;
        }

        .group {
            margin-bottom: 22px;
        }

        .group-title {
            color: #8fa2b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .group[data-develop-section] {
            margin-top: 30px;
        }

        .group[data-develop-section]:first-of-type {
            margin-top: 4px;
        }

        .group[data-develop-section] > .group-title {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 28px;
            padding: 11px 14px;
            border-top: 1px solid #d18a36;
            border-bottom: 1px solid #d18a36;
            background: #101010;
            color: #f4f4f4;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.09em;
        }

        .color-mixer-view-tabs {
            display: inline-flex;
            gap: 2px;
            margin: 0 0 12px;
            border: 1px solid #344352;
            border-radius: 7px;
            overflow: hidden;
        }

        .color-mixer-view-button {
            min-height: 36px;
            min-width: 72px;
            padding: 7px 14px;
            border: 0;
            border-radius: 0;
            background: #18212a;
            color: #9fb0bf;
            font-weight: 600;
        }

        .color-mixer-view-button.active {
            background: #2a6f97;
            color: #fff;
        }

        .color-mixer-slider-group {
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }

        .color-mixer-slider-group + .color-mixer-slider-group {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #405263;
        }

        .color-mixer-group-heading {
            margin-bottom: 5px;
            color: #aebdca;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .point-color-detail-range { margin: 14px 0 18px; }
        .point-color-range-layout { display: grid; grid-template-columns: 72px minmax(220px, 1fr) 72px; gap: 12px; align-items: center; }
        .point-color-range-pair { color: #c8d3dc; font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
        .point-color-range-track { position: relative; height: 44px; touch-action: none; }
        .point-color-range-rail { position: absolute; left: 0; right: 0; top: 19px; height: 6px; border-radius: 999px; background: #405263; }
        .point-color-range-transition { position: absolute; top: 19px; height: 6px; }
        .point-color-range-transition { background: #54758a; }
        .point-color-range-full-box { position: absolute; top: 8px; height: 28px; padding: 0; border: 2px solid #8ec9e8; border-radius: 4px; background: rgba(47, 158, 216, 0.38); touch-action: none; cursor: grab; z-index: 2; }
        .point-color-range-full-box:active { cursor: grabbing; }
        .point-color-range-inner-edge { position: absolute; top: -8px; bottom: -8px; width: 20px; padding: 0; border: 0; background: transparent; touch-action: none; z-index: 4; }
        .point-color-range-inner-edge.lower { left: -10px; cursor: ew-resize; }
        .point-color-range-inner-edge.upper { right: -10px; cursor: ew-resize; }
        .point-color-range-outer { position: absolute; top: 9px; width: 30px; height: 30px; min-height: 30px; padding: 0; transform: translateX(-50%); border: 0; background: transparent; touch-action: none; z-index: 3; }
        .point-color-range-outer::before { content: ""; display: block; margin: 7px auto 0; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 13px solid #c8d9e4; }
        .point-color-range-marker { position: absolute; top: 14px; width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%; border: 2px solid #eef7fc; background: #4db3e7; box-shadow: 0 0 0 2px #17242d; pointer-events: none; z-index: 5; }
        .point-color-range-full-box:focus-visible, .point-color-range-inner-edge:focus-visible, .point-color-range-outer:focus-visible { outline: 2px solid #55b8ed; outline-offset: 2px; }

        .develop-section-leading-controls {
            margin-bottom: 28px;
        }

        .develop-section-trailing-controls {
            margin-top: 16px;
            margin-bottom: 0;
        }

        .lens-corrections-tabs {
            display: inline-flex;
            gap: 2px;
            margin: 0 0 18px;
            border: 1px solid #344352;
            border-radius: 7px;
            overflow: hidden;
        }

        .lens-corrections-tab {
            min-width: 92px;
            min-height: 36px;
            padding: 7px 16px;
            border: 0;
            border-radius: 0;
            background: #18212a;
            color: #9fb0bf;
            font-weight: 600;
        }

        .lens-corrections-tab.active {
            background: #2a6f97;
            color: #ffffff;
        }

        .lens-corrections-panel {
            max-width: 1120px;
        }

        .lens-subheading {
            margin: 18px 0 9px;
            padding-bottom: 5px;
            border-bottom: 1px solid #344352;
            color: #aebdca;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .lens-subheading:first-child {
            margin-top: 0;
        }

        .lens-color-heading {
            margin: 15px 0 7px;
            color: #d7e1ea;
            font-size: 13px;
            font-weight: 600;
        }

        .compound-develop-range-row {
            display: grid;
            grid-template-columns: minmax(140px, 210px) minmax(180px, 1fr) 92px auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            min-width: 0;
        }

        .compound-develop-range-track {
            --compound-fill-start: 0%;
            --compound-fill-end: 100%;
            position: relative;
            height: 44px;
            min-width: 0;
            touch-action: none;
            user-select: none;
        }

        .compound-develop-range-rail,
        .compound-develop-range-fill {
            position: absolute;
            top: 19px;
            height: 6px;
            border-radius: 999px;
            pointer-events: none;
        }

        .compound-develop-range-rail {
            left: 0;
            right: 0;
            background: #405263;
        }

        .compound-develop-range-fill {
            left: var(--compound-fill-start);
            right: calc(100% - var(--compound-fill-end));
            background: #2f9ed8;
        }

        .compound-develop-range-handle {
            position: absolute;
            top: 8px;
            width: 28px;
            min-width: 28px;
            height: 28px;
            min-height: 28px;
            padding: 0;
            transform: translateX(-50%);
            border: 2px solid #b9e4ff;
            border-radius: 50%;
            background: #2f9ed8;
            cursor: ew-resize;
            touch-action: none;
            z-index: 2;
        }

        .compound-develop-range-handle:hover {
            background: #327eab;
        }

        .compound-develop-range-handle:disabled:hover {
            background: #2f9ed8;
        }

        .compound-develop-range-value {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 44px;
            padding: 8px;
            border: 1px solid #405263;
            border-radius: 6px;
            background: #080c10;
            color: #f4f7fa;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .compound-develop-range-row > button {
            min-height: 44px;
        }

        .compound-develop-range-row .develop-slider-state {
            grid-column: 2 / -1;
        }

        .compound-develop-range-row.unavailable .develop-slider-state {
            color: #d6a52b;
        }

        .compound-develop-range-row.error .develop-slider-state {
            color: #ff7b72;
        }

        .basic-controls-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: #111a23;
            border: 1px solid #263543;
            border-radius: 8px;
        }

        .basic-controls-row button.active {
            background: #3f6f5a;
            color: #ffffff;
        }

        .basic-controls-row button.pending {
            opacity: 0.65;
        }

        .basic-controls-status {
            color: #d6a75b;
            font-size: 12px;
        }

        [hidden] { display: none !important; }

        .cg-shell {
            max-width: 1440px;
            margin: 0 auto;
        }

        .cg-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 10px 13px;
            border: 1px solid #34506a;
            border-radius: 8px;
            background: #14212c;
            color: #b9dcf2;
        }

        .cg-status-bar::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #55c98b;
        }

        .cg-status-bar[data-state="pending"]::before { background: #ffb454; }
        .cg-status-bar[data-state="warning"]::before { background: #ee6b6e; }
        .cg-view-selector, .cg-scalar-section {
            margin-bottom: 16px;
            padding: 14px;
            border: 1px solid #2b3744;
            border-radius: 10px;
            background: #151d25;
        }

        .cg-view-selector h2, .cg-scalar-section h2 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        .cg-view-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .cg-view-button { min-width: 104px; min-height: 44px; }
        .cg-view-button.active { background: #2a6f97; border-color: #71c6f5; box-shadow: 0 0 0 2px rgba(113,198,245,.2); }
        .cg-region-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; min-width: 0; }
        .cg-region-card { min-width: 0; padding: 14px; border: 1px solid #2b3744; border-radius: 11px; background: #151d25; }
        .cg-region-card h3 { display: inline-block; margin: 0 8px 12px 0; font-size: 18px; }
        .cg-region-card.unavailable { opacity: .72; }
        .cg-availability { color: #86c7ed; font-size: 12px; }
        .cg-wheel {
            position: relative;
            width: min(100%, 260px);
            aspect-ratio: 1;
            margin: 0 auto 12px;
            border: 2px solid #62788d;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(238,238,238,.98) 0%, rgba(238,238,238,.72) 22%, transparent 72%), conic-gradient(from 90deg, #f00, #f0f, #00f, #0ff, #0f0, #ff0, #f00);
            box-shadow: inset 0 0 20px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.3);
            cursor: crosshair;
            touch-action: none;
            user-select: none;
        }
        .cg-wheel:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #7cc7ff; outline-offset: 2px; }
        input[type="range"] {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            min-height: 44px;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: #405263;
        }
        input[type="range"]::-webkit-slider-thumb {
            width: 28px;
            height: 28px;
            margin-top: -11px;
            border: 2px solid #b9e4ff;
            border-radius: 50%;
            background: #2f9ed8;
            appearance: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #405263;
        }
        input[type="range"]::-moz-range-thumb {
            box-sizing: border-box;
            width: 28px;
            height: 28px;
            border: 2px solid #b9e4ff;
            border-radius: 50%;
            background: #2f9ed8;
        }
        .cg-wheel-pointer { position: absolute; left: 50%; top: 50%; width: 17px; height: 17px; transform: translate(-50%,-50%); border: 3px solid #fff; border-radius: 50%; background: #111; box-shadow: 0 0 0 2px #111, 0 2px 5px #000; pointer-events: none; }
        .cg-scalar-row input[type="text"] { box-sizing: border-box; width: 100%; min-height: 40px; padding: 8px; border: 1px solid #405263; border-radius: 6px; background: #080c10; color: #f4f7fa; font-size: 16px; }
        .cg-range-text { color: #8fa2b3; font-size: 11px; font-variant-numeric: tabular-nums; }
        .cg-scalar-row { display: grid; grid-template-columns: minmax(90px,140px) minmax(130px,1fr) 82px 70px auto; gap: 8px; align-items: center; margin-top: 12px; min-width: 0; }
        .cg-scalar-row > * { min-width: 0; }
        .cg-scalar-row input[type="range"] { width: 100%; min-height: 44px; accent-color: #2f9ed8; }
        .cg-reset, .cg-reset-region { min-height: 44px; }
        .cg-reset-region { width: 100%; margin-top: 10px; }
        .cg-region-card .cg-scalar-row { grid-template-columns: minmax(0, 1fr) 82px; }
        .cg-region-card .cg-scalar-row > label { grid-column: 1 / -1; }
        .cg-region-card .cg-scalar-row > input[type="range"] { grid-column: 1; }
        .cg-region-card .cg-scalar-row > .cg-range-text,
        .cg-region-card .cg-scalar-row > .cg-reset { grid-column: 1 / -1; }
        .cg-region-card .cg-scalar-row > .cg-reset { width: 100%; }
        .cg-inline-confirm { display: grid; gap: 8px; grid-template-columns: 1fr auto auto; align-items: center; margin-top: 10px; padding: 9px; border: 1px solid #8a5b39; border-radius: 7px; background: #302218; font-size: 12px; }
        @media (min-width: 1480px) {
            .cg-region-grid { grid-template-columns: repeat(4, minmax(320px, 1fr)); }
        }
        @media (max-width: 760px) {
            .cg-scalar-section .cg-scalar-row { grid-template-columns: minmax(0, 1fr) 88px; }
            .cg-scalar-section .cg-scalar-row > label,
            .cg-scalar-section .cg-scalar-row > input[type="range"],
            .cg-scalar-section .cg-scalar-row .cg-reset { grid-column: 1 / -1; }
        }
        @media (max-width: 700px) {
            .content { padding: 12px; }
            .cg-region-grid { grid-template-columns: minmax(0, 1fr); }
            .cg-wheel { width: min(100%, 300px); }
            .cg-scalar-row { grid-template-columns: minmax(0, 1fr) 88px; }
            .cg-scalar-row > label, .cg-scalar-row > input[type="range"] { grid-column: 1 / -1; }
            .cg-scalar-row .cg-reset { grid-column: 1 / -1; }
            .cg-inline-confirm { grid-template-columns: 1fr 1fr; }
            .cg-inline-confirm span { grid-column: 1 / -1; }
        }

        .command-group-note {
            max-width: 920px;
            margin: -2px 0 10px;
            color: #9fb0bf;
            font-size: 13px;
            line-height: 1.45;
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            max-width: 920px;
        }

        .command-grid button {
            min-height: 44px;
        }

        .row {
            display: grid;
            grid-template-columns: 240px repeat(5, 70px) minmax(180px, 1fr);
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .switch-row {
            display: grid;
            grid-template-columns: 240px 90px 90px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 240px 140px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .slider-name {
            background: #18212a;
            border: 1px solid #2b3744;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .switch-status {
            color: #ffb454;
            font-size: 13px;
        }

        .develop-categorical-row {
            display: grid;
            grid-template-columns: 240px minmax(220px, 420px) 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        .develop-categorical-select {
            width: 100%;
            min-height: 42px;
            border: 1px solid #405263;
            border-radius: 7px;
            padding: 8px 38px 8px 11px;
            background: #10171d;
            color: #f4f7fa;
            font: inherit;
            touch-action: manipulation;
        }

        .develop-categorical-select.pending {
            border-color: #d6a52b;
            box-shadow: 0 0 0 2px rgba(214, 165, 43, 0.18);
        }

        .develop-categorical-options {
            display: grid;
            grid-template-columns: repeat(3, minmax(76px, 1fr));
            gap: 8px;
        }

        .develop-categorical-upright {
            margin-bottom: 12px;
        }

        .develop-categorical-options button {
            min-height: 44px;
        }

        .develop-categorical-options button.active,
        .develop-categorical-options button.active:hover,
        .develop-categorical-action.active {
            background: #2a6f97;
            color: #ffffff;
        }

        .develop-categorical-options button.pending,
        .develop-categorical-action.pending {
            border-color: #d6a52b;
            box-shadow: 0 0 0 2px rgba(214, 165, 43, 0.18);
        }

        .develop-categorical-status {
            min-height: 18px;
            color: #9fb0bf;
            font-size: 13px;
        }

        .develop-categorical-status.pending { color: #ffb454; }
        .develop-categorical-status.error { color: #ff9b9b; }

        .develop-categorical-status.visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        .develop-categorical-binary button.active {
            box-shadow: 0 0 0 2px rgba(113, 198, 245, 0.45);
        }

        .develop-categorical-binary button.pending {
            border-color: #d6a52b;
            box-shadow: 0 0 0 2px rgba(214, 165, 43, 0.3);
        }

        button {
            background: #273442;
            color: #ffffff;
            border: 1px solid #3b4b5c;
            border-radius: 7px;
            padding: 10px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #314151;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        button:disabled:hover {
            background: #273442;
        }

        button.positive {
            background: #2a6f97;
            border-color: #3a8cc0;
        }

        button.positive:hover {
            background: #327eab;
        }

        .develop-slider-row,
        .angle-control {
            display: grid;
            grid-template-columns: minmax(140px, 210px) minmax(180px, 1fr) 92px 44px 44px auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            min-width: 0;
        }

        .develop-slider-row input[type="range"],
        .angle-control input[type="range"] {
            width: 100%;
            min-width: 0;
            height: 40px;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }

        .develop-slider-row input[type="range"]::-webkit-slider-runnable-track,
        .angle-control input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(
                to right,
                #2f9ed8 0,
                #2f9ed8 var(--slider-progress, 0%),
                #405263 var(--slider-progress, 0%),
                #405263 100%
            );
        }

        .develop-slider-row input[type="range"]::-moz-range-track,
        .angle-control input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #405263;
        }

        .develop-slider-row input[type="range"]::-moz-range-progress,
        .angle-control input[type="range"]::-moz-range-progress {
            height: 6px;
            border-radius: 999px;
            background: #2f9ed8;
        }

        .develop-slider-row input[type="text"],
        .angle-control input[type="text"] {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            border: 1px solid #405263;
            border-radius: 6px;
            padding: 8px;
            background: #080c10;
            color: #f4f7fa;
            min-height: 44px;
        }

        .develop-slider-row button,
        .angle-control button { min-height: 44px; }

        .denoise-slider-row {
            grid-template-columns: minmax(140px, 210px) 64px 64px minmax(180px, 1fr) 92px 44px 44px;
        }

        .denoise-slider-row > * { min-width: 0; }
        .denoise-slider-row button { padding-inline: 8px; }
        .denoise-slider-row button.active { background: #3f6f5a; border-color: #5b9679; }
        .denoise-slider-row .enhance-status {
            grid-column: 4 / -1;
            min-height: 16px;
            color: #9fb0bf;
            font-size: 12px;
            line-height: 16px;
        }

        const controllerTabStorageKey = "lrbridge.controller.activeTab";
        const controllerTabIds = ["sliders", "color-grading", "tone-curve", "selection", "crop", "application", "retouching"];

        function normalizeControllerTab(tab) {
            if (tab === "healing" || tab === "redEye" || tab === "masking") return "retouching";
            return tab;
        }

        function tabFromLocation() {
            const hash = window.location.hash.replace(/^#/, "");
            const hashTab = normalizeControllerTab(hash === "develop" ? "sliders" : hash);
            if (controllerTabIds.includes(hashTab)) return hashTab;
            try {
                const stored = normalizeControllerTab(window.localStorage.getItem(controllerTabStorageKey));
                if (controllerTabIds.includes(stored)) return stored;
            } catch (err) { /* Storage may be disabled. */ }
            return "sliders";
        }

        let activeTab = tabFromLocation();

        function isGenericDevelopFeedbackTab(tab) {
            return tab === "sliders" || tab === "tone-curve";
        }

        function setStatus(message) {
            statusBox.textContent = message;
        }

        function formatResponseText(text) {
            if (!text) {
                return "";
            }

            try {
                const data = JSON.parse(text);

                if (data.error) {
                    return data.error;
                }

                if (data.queued && data.queued.command) {
                    const slider = data.queued.slider ? " " + data.queued.slider : "";
                    const amount = data.queued.amount !== undefined ? " " + data.queued.amount : "";
                    const action = data.queued.action ? " " + data.queued.action : "";

                    return data.queued.command + slider + amount + action;
                }

                if (data.ok === true) {
                    return "Command accepted";
                }

                return JSON.stringify(data);
            } catch (err) {
                return text;
            }
        }

        async function sendCommand(path) {
            setStatus("Sending: " + path);

            try {
                const response = await fetch(path, {
                    cache: "no-store"
                });

                const text = await response.text();
                const detail = formatResponseText(text);

                if (!response.ok) {
                    setStatus("ERROR " + response.status + ": " + detail);
                    return false;
                }

                setStatus("OK: " + detail);
                return true;
            } catch (err) {
                setStatus("ERROR: " + err.message);
                return false;
            }
        }

        const customCropModal = document.getElementById("customCropModal");
        const customCropForm = document.getElementById("customCropForm");
        const customCropWidth = document.getElementById("customCropWidth");
        const customCropHeight = document.getElementById("customCropHeight");
        const customCropError = document.getElementById("customCropError");
        const customCropApply = document.getElementById("customCropApply");
        let customCropSubmitting = false;

        function parseCustomCropDimension(value) {
            if (typeof value !== "string" || !/^\d+$/.test(value)) return null;
            const number = Number(value);
            return Number.isSafeInteger(number) && number >= 1 && number <= 10000 ? number : null;
        }

        function customCropCommandPath(width, height) {
            return "/api/command?command=photo.crop_aspect&mode=custom&w=" +
                encodeURIComponent(String(width)) + "&h=" + encodeURIComponent(String(height));
        }

        function validateCustomCropModal() {
            const width = parseCustomCropDimension(customCropWidth.value);
            const height = parseCustomCropDimension(customCropHeight.value);
            const valid = width !== null && height !== null;
            customCropError.textContent = valid ? "" : "Width and Height must be whole numbers from 1 to 10000.";
            customCropApply.disabled = !valid || customCropSubmitting;
            return valid ? { width: width, height: height } : null;
        }

        function openCustomCropModal() {

        function beginDevelopSliderInteraction(control, kind) {
            control.interactionKind = kind;
            control.contextInvalidated = false;
            activeSliderInteractions.add(control.definition.id);
        }

        function isDevelopSliderInteracting(control) {
            return activeSliderInteractions.has(control.definition.id);
        }

        function cancelDevelopSliderThrottle(control) {
            if (control.throttleTimer !== null) clearTimeout(control.throttleTimer);
            control.throttleTimer = null;
            if (control.pendingKind === "range") {
                control.pendingValue = null;
                control.pendingKind = null;
                control.pendingCompletion = null;
            }
        }

        function performPendingDevelopContextRefresh() {
            if (!pendingDevelopContextRefresh || activeSliderInteractions.size !== 0 || !genericFeedbackActive) return;
            pendingDevelopContextRefresh = false;
            requestLiveFeedbackSnapshot(true);
        }

        function endDevelopSliderInteraction(control) {
            activeSliderInteractions.delete(control.definition.id);
            control.interactionKind = null;
            control.dragging = false;
            control.editing = false;
            performPendingDevelopContextRefresh();
        }

        function applyFeedbackSnapshot(snapshot) {
            Object.keys(snapshot.results || {}).forEach(function (slider) {
                const result = snapshot.results[slider];
                if (slider === "CropAngle") {
                    if (result.available === false) {
                        if (!angleDragging) markAngleUnavailable();
                    } else {
                        applyAuthoritativeAngleFeedback(result.value);
                    }
                } else if (developSliderControls[slider]) {
                    const control = developSliderControls[slider];
                    if (control.applySwitchFeedback) {
                        control.applySwitchFeedback(result.available === true ? Number(result.value) : null);
                    } else {
                        applyDevelopSliderFeedbackIfChanged(control, result);
                    }
                }
            });
        }

        async function pollFeedbackSnapshot(requestId, timeoutMs, signal) {
            const startedAt = Date.now();
            const endpoint = "/api/feedback/snapshot?id=" + encodeURIComponent(requestId);
            let latestSnapshot = null;
            while (Date.now() - startedAt < timeoutMs) {
                if (signal && signal.aborted) return { snapshot: latestSnapshot, timedOut: false, aborted: true };
                const response = await fetch(endpoint, {
                    cache: "no-store",
                    signal: signal
                });
                const bodyText = await response.text();
                let data = null;
                try {
                    data = JSON.parse(bodyText);
                } catch (err) {
                    /* The diagnostic below retains the non-JSON response body. */
                }
                if (!response.ok) {
                    const failure = new Error("Feedback snapshot HTTP " + response.status);
                    failure.feedbackDiagnostic = {
                        endpoint: endpoint,
                        requestId: requestId,
                        status: response.status,
                        body: bodyText.slice(0, 500)
                    };
                    throw failure;
                }
                if (data && data.snapshot) {
                    latestSnapshot = data.snapshot;
                    if (latestSnapshot.complete) return {
                        snapshot: latestSnapshot,
                        timedOut: false
                    };
                }
                await sleep(50);
            }
            return {
                snapshot: latestSnapshot,
                timedOut: true
            };
        }

        function logFeedbackSnapshotFailure(details) {
            const diagnostic = Object.assign({
                endpoint: "/api/feedback/snapshot",
                requestId: null,
                status: null,
                body: "",
                reason: "unknown"
            }, details || {});
            console.error("LRBridge feedback snapshot failed", diagnostic);
        }

        function getVisibleFeedbackSliders() {
            const visibleSliders = [];
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
            const buffer = 160;

            Object.keys(sliderFeedbackElements).forEach(function (slider) {
                const element = sliderFeedbackElements[slider];

                if (!element || !element.isConnected || !element.getBoundingClientRect) {
                    return;
                }

                const rect = element.getBoundingClientRect();

                if (
                    rect.bottom >= -buffer &&
                    rect.top <= viewportHeight + buffer &&
                    rect.right >= -buffer &&
                    rect.left <= viewportWidth + buffer
                ) {
                    visibleSliders.push(slider);
                }
            });

            return visibleSliders;
        }

        async function requestLiveFeedbackSnapshot(forceAll) {
            if (!genericFeedbackActive || !isGenericDevelopFeedbackTab(activeTab)) return;
            if (activeTab === "sliders") requestTreatmentState();
            if (activeTab === "sliders") requestHistoryState();
            if (activeTab === "sliders") requestLensBlurState();
            if (activeTab === "sliders") requestDevelopCategoricalState();
            if (activeTab === "sliders" && colorMixerView === "point-color") requestPointColorState();
            if (liveFeedbackSnapshotInFlight) {
                pendingFullFeedbackSnapshot = pendingFullFeedbackSnapshot || forceAll === true;
                return;
            }

            const visibleSliders = forceAll === true
                ? Object.keys(developSliderControls).filter(function (slider) {
                    return developSliderControls[slider].row.isConnected;
                })
                : getVisibleFeedbackSliders();

            if (visibleSliders.length === 0) {
                return;
            }

            liveFeedbackSnapshotInFlight = true;
            const generation = genericFeedbackGeneration;
            const abortController = new AbortController();
            genericFeedbackAbortController = abortController;

            try {
                const response = await fetch("/api/feedback/request-many?sliders=" + encodeURIComponent(visibleSliders.join(",")), {
                    cache: "no-store",
                    signal: abortController.signal
                });
                const data = await response.json();
                const request = data && data.request;
                if (!response.ok || !request || request.id === undefined) {
                    throw new Error("Feedback snapshot request failed");
                }
                const outcome = await pollFeedbackSnapshot(request.id, 4000, abortController.signal);
                if (generation !== genericFeedbackGeneration || !genericFeedbackActive || !isGenericDevelopFeedbackTab(activeTab) || outcome.aborted) return;
                if (outcome.snapshot) {
                    applyFeedbackSnapshot(outcome.snapshot);
                }
                if (forceAll === true && developLoadingStatus) developLoadingStatus.textContent = "";
                if (outcome.timedOut) {
                    const returned = outcome.snapshot ? Object.keys(outcome.snapshot.results || {}) : [];
                    const missing = visibleSliders.filter(function (slider) {
                        return !returned.includes(slider);
                    });
                    logFeedbackSnapshotFailure({
                        endpoint: "/api/feedback/snapshot?id=" + encodeURIComponent(request.id),
                        requestId: request.id,
                        reason: "timeout",
                        body: "Missing results: " + missing.join(",")
                    });
                    return;
                }
            } catch (err) {
                if (abortController.signal.aborted || generation !== genericFeedbackGeneration) return;
                logFeedbackSnapshotFailure(err.feedbackDiagnostic || {
                    endpoint: "/api/feedback/snapshot",
                    reason: "connection-or-response-failure",
                    body: err.message
                });
                visibleSliders.forEach(function (slider) {
                    if (developSliderControls[slider]) markDevelopSliderError(developSliderControls[slider]);
                });
            } finally {
                if (generation !== genericFeedbackGeneration) return;
                genericFeedbackAbortController = null;
                liveFeedbackSnapshotInFlight = false;
                if (pendingFullFeedbackSnapshot && genericFeedbackActive && isGenericDevelopFeedbackTab(activeTab)) {
                    pendingFullFeedbackSnapshot = false;
                    requestLiveFeedbackSnapshot(true);
                }
            }
        }

        async function pollControllerContext() {
            try {
                const response = await fetch("/api/context", { cache: "no-store" });
                const data = await response.json();
                const previous = {
                    contextCounter: lastControllerContextCounter,
                    developCounter: lastControllerDevelopCounter,
                    activeModule: lastControllerActiveModule,
                    selectedPhotoKey: lastControllerSelectedPhotoKey,
                    lastHeartbeatAt: lastControllerHeartbeatAt
                };
                const classification = classifyControllerContextChange(previous, data);
                if (classification === "navigation" || classification === "develop-revision") {
                    invalidateTreatmentState();
                }
                if (classification === "navigation") {
                    invalidatePointColorState();
                    lensBlurModel.applyAuthoritative(null);
                    lensBlurSubjectPresentation.reset();
                    updateLensBlurPresentation();
                    resetDevelopCategoricalState();
                    ["LensBlurAmount", "LensBlurCatEye", "LensBlurHighlightsBoost"].forEach(function (slider) {
                        const control = developSliderControls[slider];
                        if (control) markDevelopSliderUnavailable(control, true);
                    });
                    enhanceState = null;
                    enhanceAmountModel.reset();
                    if (enhanceAmountDebounceTimer !== null) clearTimeout(enhanceAmountDebounceTimer);
                    enhanceAmountDebounceTimer = null;
                    updateEnhanceControls();
                    if (activeTab === "sliders") requestEnhanceState();
                }
                currentDevelopRefreshClassification = classification;
                lastControllerContextCounter = data.contextCounter;
                lastControllerDevelopCounter = data.developCounter;
                lastControllerActiveModule = data.activeModule;
                lastControllerSelectedPhotoKey = data.selectedPhotoKey;

                const heartbeatChanged = lastControllerHeartbeatAt !== null &&
                    data.lastHeartbeatAt !== lastControllerHeartbeatAt;
                lastControllerHeartbeatAt = data.lastHeartbeatAt;

                let loadingRequested = false;
                let activeInvalidated = false;
                if (classification === "navigation") {
                    Object.keys(developSliderControls).forEach(function (slider) {
                        const control = developSliderControls[slider];
                        control.lastSubmittedValue = null;
                        if (!isDevelopSliderInteracting(control)) cancelDevelopSliderStep(control);
                    });
                    if (activeSliderInteractions.size !== 0) {
                        pendingDevelopContextRefresh = true;
                        activeSliderInteractions.forEach(function (slider) {
                            const control = developSliderControls[slider];
                            if (!control) return;
                            control.contextInvalidated = true;
                            activeInvalidated = true;
                            cancelDevelopSliderThrottle(control);
                        });
                    } else if (genericFeedbackActive) {
                        loadingRequested = true;
                        requestLiveFeedbackSnapshot(true);
                    }
                } else if (heartbeatWasStale && heartbeatChanged && genericFeedbackActive) {
                    if (activeSliderInteractions.size !== 0) pendingDevelopContextRefresh = true;
                    else {
                        loadingRequested = true;
                        requestLiveFeedbackSnapshot(true);
                    }
                    requestEnhanceState();
                }

                logDevelopRefreshDecision(previous, data, classification, loadingRequested, activeInvalidated);

                heartbeatWasStale = !data.lastHeartbeatAt || Date.now() - data.lastHeartbeatAt > 2000;
            } catch (err) {
                heartbeatWasStale = true;
            }
        }

        function startLiveFeedbackPolling() {
            if (liveFeedbackPollingStarted) {
                return;
            }

            liveFeedbackPollingStarted = true;

            pollControllerContext();

            setInterval(function () {
                requestLiveFeedbackSnapshot(false);
            }, 500);
            setInterval(pollControllerContext, 500);
            setInterval(function () {
                if (activeTab === "sliders") requestEnhanceState();
            }, 1000);
        }

        function activateDevelopFeedbackPolling() {
            if (genericFeedbackActive) return;
            genericFeedbackActive = true;
            requestLiveFeedbackSnapshot(true);
        }

        function deactivateDevelopFeedbackPolling() {
            genericFeedbackActive = false;
            Array.from(activeSliderInteractions).forEach(function (slider) {
                const control = developSliderControls[slider];
                if (control && control.cancelInteraction) control.cancelInteraction();
            });
            genericFeedbackGeneration += 1;
            if (genericFeedbackAbortController) genericFeedbackAbortController.abort();
            genericFeedbackAbortController = null;
            liveFeedbackSnapshotInFlight = false;
            pendingFullFeedbackSnapshot = false;
        }

        function clearContent() {
            content.innerHTML = "";
        }

        function renderTabs() {
            tabsElement.innerHTML = "";

            const allTabs = [
                {
                    id: "sliders",
                    label: "Develop Sliders"
                },
                {
                    id: "color-grading",
                    label: "Color Grading"
                },
                {
                    id: "tone-curve",
                    label: "Tone Curve"
                },
                {
                    id: "selection",
                    label: "Selection"
                },
                {
                    id: "crop",
                    label: "Crop"
                },
                {

                },

                }
            ];

            for (const tab of allTabs) {

        function selectControllerTab(tab, updateHistory) {
            tab = normalizeControllerTab(tab);
            if (!controllerTabIds.includes(tab)) tab = "sliders";
            if (tab === activeTab && content.isConnected) return;
            activeTab = tab;
            try { window.localStorage.setItem(controllerTabStorageKey, tab); } catch (err) { /* Storage may be disabled. */ }
            const hash = tab === "sliders" ? "develop" : tab;
            if (updateHistory && window.location.hash !== "#" + hash) window.history.pushState(null, "", "#" + hash);
            render();
        }

        function commandPath(item) {
            const parameters = [
                ["command", item.command],
                [item.field, item.value]
            ];

            for (const entry of Object.entries(item.params || {})) {
                parameters.push(entry);
            }

            return "/api/command?" + parameters.map(function (entry) {
                return encodeURIComponent(entry[0]) + "=" + encodeURIComponent(String(entry[1]));
            }).join("&");
        }

        let angleRange = null;
        let angleNumber = null;
        let angleValueLabel = null;
        let angleDecrementButton = null;
        let angleIncrementButton = null;
        let angleResetButton = null;
        let angleDragging = false;
        let angleRequestInFlight = false;
        let pendingAngleValue = null;
        let lastSubmittedAngleValue = null;
        let angleThrottleTimer = null;
        let numericAngleCommittedValue = null;
        let authoritativeAngleValue = 0;
        let angleEditing = false;
        let cancelNextAngleBlur = false;

        function parseAngleValue(value) {
            if (typeof value !== "string") return null;
            const normalized = value.replace(",", ".");
            if (!/^-?(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(normalized)) return null;
            const number = Number(normalized);
            return Number.isFinite(number) ? Math.max(-45, Math.min(45, number)) : null;
        }

        function angleCommandPath(value) {
            return "/api/command?command=photo.crop_angle.set&value=" + encodeURIComponent(String(value));
        }

        function showLocalAngle(value) {
            if (angleRange) angleRange.value = String(value);
            if (angleNumber) angleNumber.value = String(value);
            if (angleRange) {
                const progress = 100 * (Number(value) + 45) / 90;
                angleRange.style.setProperty("--slider-progress", progress + "%");
            }
            if (angleValueLabel) angleValueLabel.textContent = "";
            if (angleRange) angleRange.disabled = false;
            if (angleNumber) angleNumber.disabled = false;
            if (angleDecrementButton) angleDecrementButton.disabled = Number(value) <= -45;
            if (angleIncrementButton) angleIncrementButton.disabled = Number(value) >= 45;
            if (angleResetButton) angleResetButton.disabled = false;
        }

        function applyAuthoritativeAngleFeedback(value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue) || numericValue < -45 || numericValue > 45) return;
            authoritativeAngleValue = Math.round(numericValue * 100) / 100;
            if (angleDragging || angleEditing) return;
            showLocalAngle(authoritativeAngleValue);
            numericAngleCommittedValue = Number(angleNumber.value);
        }

        function markAngleUnavailable() {
            if (angleValueLabel) angleValueLabel.textContent = "Unavailable";
            if (angleRange) angleRange.disabled = true;
            if (angleNumber) angleNumber.disabled = true;
            if (angleDecrementButton) angleDecrementButton.disabled = true;
            if (angleIncrementButton) angleIncrementButton.disabled = true;
            if (angleResetButton) angleResetButton.disabled = true;
        }

        function stepAngleValue(direction) {
            const currentValue = parseAngleValue(angleNumber ? angleNumber.value : "");
            if (currentValue === null) return;
            const value = Math.max(-45, Math.min(45, Math.round((currentValue + direction * 0.1) * 10) / 10));
            showLocalAngle(value);
            numericAngleCommittedValue = value;
            scheduleAngleValue(value);
        }

        async function submitAngleValue(value) {
            if (value === lastSubmittedAngleValue && !angleRequestInFlight) return;

            if (angleRequestInFlight) {
                pendingAngleValue = value;
                return;
            }

            angleRequestInFlight = true;
            lastSubmittedAngleValue = value;
            await sendCommand(angleCommandPath(value));
            angleRequestInFlight = false;

            if (pendingAngleValue !== null) {
                const nextValue = pendingAngleValue;
                pendingAngleValue = null;
                if (nextValue !== lastSubmittedAngleValue) submitAngleValue(nextValue);
            }
        }

        function scheduleAngleValue(value) {
            pendingAngleValue = value;
            if (angleThrottleTimer !== null) return;

            angleThrottleTimer = setTimeout(function () {
                angleThrottleTimer = null;
                const nextValue = pendingAngleValue;
                pendingAngleValue = null;
                if (nextValue !== null) submitAngleValue(nextValue);
            }, 100);
        }

        function flushAngleValue(value) {
            if (angleThrottleTimer !== null) {
                clearTimeout(angleThrottleTimer);
                angleThrottleTimer = null;
            }
            pendingAngleValue = null;
            submitAngleValue(value);
        }

        function renderAngleControls(groupElement) {
            const row = document.createElement("div");
            row.className = "angle-control";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = "Angle";

            angleRange = document.createElement("input");
            angleRange.type = "range";
            angleRange.min = "-45";
            angleRange.max = "45";
            angleRange.step = "0.1";
            angleRange.value = "0";
            angleRange.setAttribute("aria-label", "Crop Angle");

            angleNumber = document.createElement("input");
            angleNumber.type = "text";
            angleNumber.inputMode = "decimal";
            angleNumber.autocomplete = "off";
            angleNumber.spellcheck = false;
            angleNumber.value = "0";
            angleNumber.setAttribute("aria-label", "Crop Angle numeric value");

            angleValueLabel = document.createElement("span");
            angleValueLabel.className = "angle-value";
            angleValueLabel.textContent = "";

            angleDecrementButton = makeButton("−", "develop-slider-step", function () {
                stepAngleValue(-1);
            });
            angleDecrementButton.setAttribute("aria-label", "Decrease Crop Angle");

            angleIncrementButton = makeButton("+", "develop-slider-step", function () {
                stepAngleValue(1);
            });
            angleIncrementButton.setAttribute("aria-label", "Increase Crop Angle");

            angleResetButton = makeButton("Reset", "reset", function () {
                if (angleThrottleTimer !== null) clearTimeout(angleThrottleTimer);
                angleThrottleTimer = null;
                pendingAngleValue = null;
                showLocalAngle(0);
                numericAngleCommittedValue = 0;
                sendCommand("/api/command?command=photo.crop_angle.reset");
            });

            angleRange.addEventListener("pointerdown", function () {
                angleDragging = true;
            });
            angleRange.addEventListener("input", function () {
                const value = Number(angleRange.value);
                showLocalAngle(value);
                scheduleAngleValue(value);
            });
            angleRange.addEventListener("pointerup", function () {
                angleDragging = false;
                flushAngleValue(Number(angleRange.value));
            });
            angleRange.addEventListener("change", function () {
                angleDragging = false;
                flushAngleValue(Number(angleRange.value));
            });

            function commitNumericAngle() {
                const value = parseAngleValue(angleNumber.value);
                if (value === null) {
                    setStatus("ERROR: Crop Angle must be between -45 and 45 with at most two decimal places.");
                    showLocalAngle(authoritativeAngleValue);
                    numericAngleCommittedValue = authoritativeAngleValue;
                    angleEditing = false;
                    return false;
                }
                if (value !== numericAngleCommittedValue) {
                    showLocalAngle(value);
                    numericAngleCommittedValue = value;
                    flushAngleValue(value);
                }
                angleEditing = false;
                return true;
            }

            angleNumber.addEventListener("focus", function () {
                angleEditing = true;
                cancelNextAngleBlur = false;
                setTimeout(function () {
                    if (document.activeElement === angleNumber) angleNumber.select();
                }, 0);
            });
            angleNumber.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    commitNumericAngle();
                    angleNumber.blur();
                } else if (event.key === "Escape") {
                    event.preventDefault();
                    cancelNextAngleBlur = true;
                    angleEditing = false;
                    showLocalAngle(authoritativeAngleValue);
                    numericAngleCommittedValue = authoritativeAngleValue;
                    angleNumber.blur();
                }
            });
            angleNumber.addEventListener("change", function () {
                if (angleEditing) commitNumericAngle();
            });
            angleNumber.addEventListener("blur", function () {
                if (cancelNextAngleBlur) {
                    cancelNextAngleBlur = false;
                    return;
                }
                if (angleEditing) commitNumericAngle();
            });

            row.appendChild(name);
            row.appendChild(angleRange);
            row.appendChild(angleNumber);
            row.appendChild(angleDecrementButton);
            row.appendChild(angleIncrementButton);
            row.appendChild(angleResetButton);
            row.appendChild(angleValueLabel);
            groupElement.appendChild(row);
            sliderFeedbackElements.CropAngle = angleValueLabel;
            numericAngleCommittedValue = 0;
            showLocalAngle(0);
        }

        function renderCommandGroups(groups) {
            for (const group of groups) {
                const groupElement = document.createElement("section");
                groupElement.className = "group";

                const title = document.createElement("div");

        }

        function addActionRow(groupElement, item) {
            const row = document.createElement("div");
            row.className = "action-row";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = item.label;

            row.appendChild(name);

            const actionButton = makeButton(item.button || "Send", item.className || "positive", function () {

        function addSwitchRow(groupElement, item) {
            const row = document.createElement("div");
            row.className = "switch-row";
            row.dataset.sliderId = item.slider;
            const usesAuthoritativeZeroOne = item.explicitZeroOne === true || item.authoritativeZeroOne === true;

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = item.label;

            const status = document.createElement("div");
            status.className = "switch-status";

            row.appendChild(name);

            const offButton = makeButton("Off", "negative", function () {
                markSliderCommandSent();
                sendCommand(usesAuthoritativeZeroOne
                    ? "/api/set?slider=" + encodeURIComponent(item.slider) + "&value=0"
                    : "/api/adjust?slider=" + encodeURIComponent(item.slider) + "&amount=-5").then(function (accepted) {
                        if (accepted && usesAuthoritativeZeroOne) setTimeout(function () { requestLiveFeedbackSnapshot(true); }, 300);
                    });

            row.appendChild(offButton);

            const onButton = makeButton("On", "positive", function () {
