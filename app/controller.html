<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>LRBridge Web Controller</title>
    <style>
        body {
            margin: 0;
            background: #101418;
            color: #d7e1ea;
            font-family: Segoe UI, Arial, sans-serif;
        }

        .controller-header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 12px 22px;
            background: #161d24;
            border-bottom: 1px solid #28323d;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .header-help-button {
            display: inline-block;
            background: #273442;
            color: #ffffff;
            border: 1px solid #3b4b5c;
            border-radius: 7px;
            padding: 8px 12px;
            font-size: 14px;
            text-decoration: none;
        }

        .header-help-button:hover {
            background: #314151;
        }

        .tabs {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            padding: 0 22px;
            background: #0b1117;
            border-bottom: 1px solid #25313d;
        }

        .tab-button {
            position: relative;
            background: transparent;
            color: #8fa2b3;
            border: 0;
            border-radius: 0;
            padding: 15px 18px 13px 18px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .tab-button:hover {
            background: #121b25;
            color: #d7e1ea;
        }

        .tab-button.active {
            background: #151f2a;
            color: #ffffff;
            box-shadow: inset 0 -3px 0 #ffb454;
        }

        .tab-button.active:hover {
            background: #182432;
            color: #ffffff;
        }

        .content {
            padding: 16px 22px;
        }

        .group {
            margin-bottom: 22px;
        }

        .group-title {
            color: #8fa2b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        [hidden] { display: none !important; }

        .cg-shell {
            max-width: 1440px;
            margin: 0 auto;
        }

        .cg-status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 10px 13px;
            border: 1px solid #34506a;
            border-radius: 8px;
            background: #14212c;
            color: #b9dcf2;
        }

        .cg-status-bar::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #55c98b;
        }

        .cg-status-bar[data-state="pending"]::before { background: #ffb454; }
        .cg-status-bar[data-state="warning"]::before { background: #ee6b6e; }
        .cg-view-selector, .cg-scalar-section {
            margin-bottom: 16px;
            padding: 14px;
            border: 1px solid #2b3744;
            border-radius: 10px;
            background: #151d25;
        }

        .cg-view-selector h2, .cg-scalar-section h2 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        .cg-view-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .cg-view-button { min-width: 104px; min-height: 44px; }
        .cg-view-button.active { background: #2a6f97; border-color: #71c6f5; box-shadow: 0 0 0 2px rgba(113,198,245,.2); }
        .cg-region-grid { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .cg-region-card { min-width: 0; padding: 14px; border: 1px solid #2b3744; border-radius: 11px; background: #151d25; }
        .cg-region-card h3 { display: inline-block; margin: 0 8px 12px 0; font-size: 18px; }
        .cg-region-card.unavailable { opacity: .72; }
        .cg-availability { color: #86c7ed; font-size: 12px; }
        .cg-wheel {
            position: relative;
            width: min(100%, 260px);
            aspect-ratio: 1;
            margin: 0 auto 12px;
            border: 2px solid #62788d;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(238,238,238,.98) 0%, rgba(238,238,238,.72) 22%, transparent 72%), conic-gradient(from 90deg, #f00, #f0f, #00f, #0ff, #0f0, #ff0, #f00);
            box-shadow: inset 0 0 20px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.3);
            cursor: crosshair;
            touch-action: none;
            user-select: none;
        }
        .cg-wheel:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #7cc7ff; outline-offset: 2px; }
        .cg-wheel-pointer { position: absolute; left: 50%; top: 50%; width: 17px; height: 17px; transform: translate(-50%,-50%); border: 3px solid #fff; border-radius: 50%; background: #111; box-shadow: 0 0 0 2px #111, 0 2px 5px #000; pointer-events: none; }
        .cg-wheel-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
        .cg-number-label { display: grid; gap: 4px; color: #a9bbc9; font-size: 12px; }
        .cg-wheel-fields input, .cg-scalar-row input[type="text"] { box-sizing: border-box; width: 100%; min-height: 40px; padding: 8px; border: 1px solid #405263; border-radius: 6px; background: #080c10; color: #f4f7fa; font-size: 16px; }
        .cg-range-text { color: #8fa2b3; font-size: 11px; font-variant-numeric: tabular-nums; }
        .cg-wheel-fields > .cg-range-text { grid-column: 1 / -1; }
        .cg-scalar-row { display: grid; grid-template-columns: minmax(90px,140px) minmax(130px,1fr) 82px 70px auto; gap: 8px; align-items: center; margin-top: 12px; min-width: 0; }
        .cg-scalar-row > * { min-width: 0; }
        .cg-scalar-row input[type="range"] { width: 100%; min-height: 44px; accent-color: #2f9ed8; }
        .cg-reset, .cg-reset-region { min-height: 44px; }
        .cg-reset-region { width: 100%; margin-top: 10px; }
        .cg-inline-confirm { display: grid; gap: 8px; grid-template-columns: 1fr auto auto; align-items: center; margin-top: 10px; padding: 9px; border: 1px solid #8a5b39; border-radius: 7px; background: #302218; font-size: 12px; }
        @media (max-width: 1100px) {
            .cg-region-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .cg-region-card .cg-scalar-row { grid-template-columns: minmax(0, 1fr) 82px; }
            .cg-region-card .cg-scalar-row > label,
            .cg-region-card .cg-scalar-row > input[type="range"],
            .cg-region-card .cg-scalar-row .cg-reset { grid-column: 1 / -1; }
        }
        @media (max-width: 760px) {
            .cg-scalar-section .cg-scalar-row { grid-template-columns: minmax(0, 1fr) 88px; }
            .cg-scalar-section .cg-scalar-row > label,
            .cg-scalar-section .cg-scalar-row > input[type="range"],
            .cg-scalar-section .cg-scalar-row .cg-reset { grid-column: 1 / -1; }
        }
        @media (max-width: 620px) {
            .content { padding: 12px; }
            .cg-region-grid { grid-template-columns: minmax(0, 1fr); }
            .cg-wheel { width: min(82vw, 300px); }
            .cg-scalar-row { grid-template-columns: minmax(0, 1fr) 88px; }
            .cg-scalar-row > label, .cg-scalar-row > input[type="range"] { grid-column: 1 / -1; }
            .cg-scalar-row .cg-reset { grid-column: 1 / -1; }
            .cg-inline-confirm { grid-template-columns: 1fr 1fr; }
            .cg-inline-confirm span { grid-column: 1 / -1; }
        }

        .command-group-note {
            max-width: 920px;
            margin: -2px 0 10px;
            color: #9fb0bf;
            font-size: 13px;
            line-height: 1.45;
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            max-width: 920px;
        }

        .command-grid button {
            min-height: 44px;
        }

        .row {
            display: grid;
            grid-template-columns: 240px repeat(5, 70px) minmax(180px, 1fr);
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .switch-row {
            display: grid;
            grid-template-columns: 240px 90px 90px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 240px 140px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .slider-name {
            background: #18212a;
            border: 1px solid #2b3744;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .switch-status {
            color: #ffb454;
            font-size: 13px;
        }

        button {
            background: #273442;
            color: #ffffff;
            border: 1px solid #3b4b5c;
            border-radius: 7px;
            padding: 10px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #314151;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        button:disabled:hover {
            background: #273442;
        }

        button.positive {
            background: #2a6f97;
            border-color: #3a8cc0;
        }

        button.positive:hover {
            background: #327eab;
        }

        .develop-slider-row,
        .angle-control {
            display: grid;
            grid-template-columns: minmax(140px, 210px) minmax(180px, 1fr) 92px 44px 44px auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            min-width: 0;
        }

        .develop-slider-row input[type="range"],
        .angle-control input[type="range"] {
            width: 100%;
            min-width: 0;
            height: 40px;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
        }

        .develop-slider-row input[type="range"]::-webkit-slider-runnable-track,
        .angle-control input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(
                to right,
                #2f9ed8 0,
                #2f9ed8 var(--slider-progress, 0%),
                #405263 var(--slider-progress, 0%),
                #405263 100%
            );
        }

        .develop-slider-row input[type="range"]::-webkit-slider-thumb,
        .angle-control input[type="range"]::-webkit-slider-thumb {
            width: 24px;
            height: 24px;
            margin-top: -9px;
            border: 2px solid #b9e4ff;
            border-radius: 50%;
            background: #2f9ed8;
            appearance: none;
            -webkit-appearance: none;
        }

        .develop-slider-row input[type="range"]::-moz-range-track,
        .angle-control input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #405263;
        }

        .develop-slider-row input[type="range"]::-moz-range-progress,
        .angle-control input[type="range"]::-moz-range-progress {
            height: 6px;
            border-radius: 999px;
            background: #2f9ed8;
        }

        .develop-slider-row input[type="range"]::-moz-range-thumb,
        .angle-control input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border: 2px solid #b9e4ff;
            border-radius: 50%;
            background: #2f9ed8;
        }

        .develop-slider-row input[type="text"],
        .angle-control input[type="text"] {
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            border: 1px solid #405263;
            border-radius: 6px;
            padding: 8px;
            background: #080c10;
            color: #f4f7fa;
            min-height: 44px;
        }

        .develop-slider-row button,
        .angle-control button { min-height: 44px; }

        .develop-slider-step {
            width: 44px;
            min-width: 44px;
            min-height: 44px;
            padding: 0;
            font-size: 20px;
        }

        .develop-slider-state {
            grid-column: 2 / -1;
            color: #9fb0bf;
            font-size: 12px;
            min-height: 16px;
            height: 16px;
            line-height: 16px;
            overflow: hidden;
            visibility: hidden;
        }

        .develop-slider-state:not(:empty) {
            visibility: visible;
        }

        .develop-loading-status {
            min-height: 20px;
            height: 20px;
            line-height: 20px;
            margin-bottom: 8px;
            overflow: hidden;
            color: #9fb0bf;
        }

        .develop-loading-status:empty { visibility: hidden; }

        .develop-slider-row.loading .develop-slider-state {
            color: #9fb0bf;
        }

        .develop-slider-row.unavailable .develop-slider-state {
            color: #d6a52b;
        }

        .develop-slider-row.error .develop-slider-state {
            color: #ff7b72;
        }

        button.command-primary {
            background: #2a6f97;
            border-color: #3a8cc0;
        }

        button.command-primary:hover {
            background: #327eab;
        }

        button.command-neutral,
        button.label-none {
            background: #46515c;
            border-color: #626f7c;
            color: #ffffff;
        }

        button.command-neutral:hover,
        button.label-none:hover {
            background: #56626e;
        }

        button.command-success,
        button.label-green {
            background: #27613d;
            border-color: #398257;
            color: #ffffff;
        }

        button.command-success:hover,
        button.label-green:hover {
            background: #32754b;
        }

        button.command-danger,
        button.label-red {
            background: #742f3a;
            border-color: #9a4452;
            color: #ffffff;
        }

        button.command-danger:hover,
        button.label-red:hover {
            background: #893946;
        }

        button.command-warning,
        button.label-yellow {
            background: #d6a52b;
            border-color: #efc24d;
            color: #17130a;
        }

        button.command-warning:hover,
        button.label-yellow:hover {
            background: #e4b63b;
        }

        button.command-purple,
        button.label-purple {
            background: #573d78;
            border-color: #76559e;
            color: #ffffff;
        }

        button.command-purple:hover,
        button.label-purple:hover {
            background: #68498e;
        }

        button.label-blue {
            background: #174a70;
            border-color: #286b99;
            color: #ffffff;
        }

        button.label-blue:hover {
            background: #205a84;
        }

        button.negative {
            background: #5c3442;
            border-color: #7a4756;
        }

        button.negative:hover {
            background: #6b3c4d;
        }

        button.reset {
            background: #7a4f24;
            border-color: #9b6530;
        }

        button.reset:hover {
            background: #8a5a2a;
        }

        .slider-jump-control {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0 12px;
            margin: 0 0 14px;
            background: #101820;
            border-bottom: 1px solid #26313d;
        }

        .slider-jump-label {
            color: #9fb4c8;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .slider-jump-main-button {
            min-width: 190px;
            min-height: 44px;
            border: 1px solid #d18a36;
            border-radius: 12px;
            background: #111111;
            color: #f4f4f4;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .slider-jump-main-button:hover {
            background: #1a1a1a;
            border-color: #f0a64a;
        }

        .slider-jump-main-button.active {
            background: #111111;
            border-color: #f0a64a;
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(240, 166, 74, 0.22);
        }

        .slider-jump-popover {
            position: absolute;
            left: 0;
            top: calc(100% - 2px);
            width: min(620px, calc(100vw - 42px));
            max-height: min(70vh, 620px);
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 14px;
            border: 2px solid #d18a36;
            border-radius: 16px;
            background: linear-gradient(180deg, #7a4c18 0%, #5f3912 100%);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.68), 0 0 0 2px rgba(209, 138, 54, 0.22);
        }

        .slider-jump-popover[hidden] {
            display: none;
        }

        .slider-jump-option {
            min-height: 54px;
            border: 1px solid #2a2a2a;
            border-radius: 13px;
            background: #101010;
            color: #f4f4f4;
            padding: 10px 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .slider-jump-option:hover,
        .slider-jump-option:focus {
            background: #1a1a1a;
            border-color: #f0a64a;
        }

        .slider-jump-target {
            scroll-margin-top: 78px;
        }

        @media (max-width: 720px) {
            .slider-jump-control {
                align-items: stretch;
                flex-direction: column;
            }

            .slider-jump-main-button {
                width: 100%;
            }

            .slider-jump-popover {
                width: calc(100vw - 42px);
                grid-template-columns: 1fr;
            }
        }

        .status {
            margin: 0 22px 16px 22px;
            background: #050708;
            border: 1px solid #2b3744;
            border-radius: 8px;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 13px;
            min-height: 20px;
            white-space: pre-wrap;
        }

        a {
            color: #6dc8ff;
        }

        @media (max-width: 760px) {
            .row,
            .switch-row,
            .action-row {
                grid-template-columns: 1fr;
                background: #18212a;
                border: 1px solid #2b3744;
                border-radius: 8px;
                padding: 10px;
            }

            .slider-name {
                border: 0;
                padding: 0 0 6px 0;
            }

            .develop-slider-row,
            .angle-control {
                grid-template-columns: minmax(92px, 1fr) 44px 44px minmax(70px, auto);
                padding: 10px;
                border: 1px solid #2b3744;
                border-radius: 8px;
                background: #18212a;
            }

            .develop-slider-row .slider-name,
            .develop-slider-row input[type="range"],
            .angle-control .slider-name,
            .angle-control input[type="range"] {
                grid-column: 1 / -1;
            }

            .develop-slider-row .develop-slider-state,
            .angle-control .angle-value {
                grid-column: 1 / -1;
            }
        }        .slider-feedback {
            display: block;
            margin-top: 4px;
            color: #9fb0bf;
            font-size: 12px;
            font-weight: 400;
        }

        .slider-feedback.active {
            color: #7cc7ff;
        }

        .slider-feedback.error {
            color: #ff9b9b;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-backdrop[hidden] {
            display: none;
        }

        .crop-modal {
            width: min(360px, 100%);
            border: 1px solid #344453;
            border-radius: 10px;
            padding: 18px;
            background: #131b22;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.5);
        }

        .crop-modal h2 {
            margin: 0 0 14px;
            font-size: 20px;
        }

        .crop-modal-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .crop-modal label {
            display: grid;
            gap: 6px;
            color: #c7d2dc;
            font-size: 13px;
        }

        .crop-modal input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #405263;
            border-radius: 6px;
            padding: 9px;
            background: #080c10;
            color: #f4f7fa;
        }

        .crop-modal-error {
            min-height: 18px;
            margin: 10px 0 4px;
            color: #ff9b9b;
            font-size: 13px;
        }

        .crop-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .angle-value {
            grid-column: 2 / -1;
            min-height: 16px;
            height: 16px;
            line-height: 16px;
            overflow: hidden;
            visibility: hidden;
            color: #d6a52b;
            font-size: 12px;
        }

        .angle-value:not(:empty) { visibility: visible; }

    </style>
</head>
<body>
    <header class="controller-header">
        <h1>LRBridge Web Controller</h1>
        <a class="header-help-button" href="/help" target="_blank" rel="noopener">Open Help</a>
    </header>

    <nav class="tabs" id="tabs" aria-label="Controller tools"></nav>
    <main class="content" id="content"></main>

    <main class="content cg-shell" id="colorGradingWorkspace" hidden>
        <div class="cg-status-bar" id="colorGradingStatus" role="status" aria-live="polite" data-state="pending">Feedback pending</div>
        <div id="colorGradingContent"></div>
    </main>

    <div class="status" id="status">Ready.</div>

    <div class="modal-backdrop" id="customCropModal" hidden>
        <form class="crop-modal" id="customCropForm" role="dialog" aria-modal="true" aria-labelledby="customCropTitle">
            <h2 id="customCropTitle">Custom Crop Ratio</h2>
            <div class="crop-modal-fields">
                <label>Width
                    <input id="customCropWidth" type="number" min="1" max="10000" step="1" value="16" required>
                </label>
                <label>Height
                    <input id="customCropHeight" type="number" min="1" max="10000" step="1" value="10" required>
                </label>
            </div>
            <div class="crop-modal-error" id="customCropError" aria-live="polite"></div>
            <div class="crop-modal-actions">
                <button type="button" id="customCropCancel">Cancel</button>
                <button type="submit" id="customCropApply" class="command-primary">Apply</button>
            </div>
        </form>
    </div>

    <script src="/controller-color-grading.js"></script>
    <script>
        const sliderGroups = [
        {
                "name": "Basic",
                "sliders": [
                        "Exposure",
                        "Contrast",
                        "Highlights",
                        "Shadows",
                        "Whites",
                        "Blacks"
                ]
        },
        {
                "name": "Color",
                "sliders": [
                        "Temperature",
                        "Tint",
                        "Vibrance",
                        "Saturation"
                ]
        },
        {
                "name": "Presence",
                "sliders": [
                        "Texture",
                        "Clarity",
                        "Dehaze"
                ]
        },
        {
                "name": "Detail",

        const controllerTabStorageKey = "lrbridge.controller.activeTab";
        const controllerTabIds = ["sliders", "color-grading", "selection", "crop", "application", "healing", "redEye", "masking"];

        function tabFromLocation() {
            const hash = window.location.hash.replace(/^#/, "");
            const hashTab = hash === "develop" ? "sliders" : hash;
            if (controllerTabIds.includes(hashTab)) return hashTab;
            try {
                const stored = window.localStorage.getItem(controllerTabStorageKey);
                if (controllerTabIds.includes(stored)) return stored;
            } catch (err) { /* Storage may be disabled. */ }
            return "sliders";
        }

        let activeTab = tabFromLocation();

        function setStatus(message) {
            statusBox.textContent = message;
        }

        function formatResponseText(text) {
            if (!text) {
                return "";
            }

            try {
                const data = JSON.parse(text);

                if (data.error) {
                    return data.error;
                }

                if (data.queued && data.queued.command) {
                    const slider = data.queued.slider ? " " + data.queued.slider : "";
                    const amount = data.queued.amount !== undefined ? " " + data.queued.amount : "";
                    const action = data.queued.action ? " " + data.queued.action : "";

                    return data.queued.command + slider + amount + action;
                }

                if (data.ok === true) {
                    return "Command accepted";
                }

                return JSON.stringify(data);
            } catch (err) {
                return text;
            }
        }

        async function sendCommand(path) {
            setStatus("Sending: " + path);

            try {
                const response = await fetch(path, {
                    cache: "no-store"
                });

                const text = await response.text();
                const detail = formatResponseText(text);

                if (!response.ok) {
                    setStatus("ERROR " + response.status + ": " + detail);
                    return false;
                }

                setStatus("OK: " + detail);
                return true;

        async function pollFeedbackSnapshot(requestId, timeoutMs, signal) {
            const startedAt = Date.now();
            const endpoint = "/api/feedback/snapshot?id=" + encodeURIComponent(requestId);
            let latestSnapshot = null;
            while (Date.now() - startedAt < timeoutMs) {
                if (signal && signal.aborted) return { snapshot: latestSnapshot, timedOut: false, aborted: true };
                const response = await fetch(endpoint, {
                    cache: "no-store",
                    signal: signal
                });
                const bodyText = await response.text();
                let data = null;
                try {
                    data = JSON.parse(bodyText);
                } catch (err) {
                    /* The diagnostic below retains the non-JSON response body. */
                }
                if (!response.ok) {
                    const failure = new Error("Feedback snapshot HTTP " + response.status);
                    failure.feedbackDiagnostic = {
                        endpoint: endpoint,
                        requestId: requestId,
                        status: response.status,
                        body: bodyText.slice(0, 500)
                    };
                    throw failure;
                }
                if (data && data.snapshot) {
                    latestSnapshot = data.snapshot;
                    if (latestSnapshot.complete) return {
                        snapshot: latestSnapshot,
                        timedOut: false
                    };
                }
                await sleep(50);

            return {
                snapshot: latestSnapshot,
                timedOut: true
            };

                heartbeatWasStale = !data.lastHeartbeatAt || Date.now() - data.lastHeartbeatAt > 2000;
            } catch (err) {
                heartbeatWasStale = true;
            }
        }

        function commandPath(item) {
            const parameters = [
                ["command", item.command],
                [item.field, item.value]
            ];

            for (const entry of Object.entries(item.params || {})) {
                parameters.push(entry);
            }

        let angleRange = null;
        let angleNumber = null;
        let angleValueLabel = null;
        let angleDecrementButton = null;
        let angleIncrementButton = null;
        let angleResetButton = null;
        let angleDragging = false;
        let angleRequestInFlight = false;
        let pendingAngleValue = null;
        let lastSubmittedAngleValue = null;
        let angleThrottleTimer = null;
        let numericAngleCommittedValue = null;
        let authoritativeAngleValue = 0;
        let angleEditing = false;
        let cancelNextAngleBlur = false;

        function parseAngleValue(value) {
            if (typeof value !== "string") return null;
            const normalized = value.replace(",", ".");
            if (!/^-?(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/.test(normalized)) return null;
            const number = Number(normalized);
            return Number.isFinite(number) ? Math.max(-45, Math.min(45, number)) : null;
        }

        function angleCommandPath(value) {
            return "/api/command?command=photo.crop_angle.set&value=" + encodeURIComponent(String(value));
        }

        function showLocalAngle(value) {
            if (angleRange) angleRange.value = String(value);
            if (angleNumber) angleNumber.value = String(value);
            if (angleRange) {
                const progress = 100 * (Number(value) + 45) / 90;
                angleRange.style.setProperty("--slider-progress", progress + "%");
            }
            if (angleValueLabel) angleValueLabel.textContent = "";
            if (angleRange) angleRange.disabled = false;
            if (angleNumber) angleNumber.disabled = false;
            if (angleDecrementButton) angleDecrementButton.disabled = Number(value) <= -45;
            if (angleIncrementButton) angleIncrementButton.disabled = Number(value) >= 45;
            if (angleResetButton) angleResetButton.disabled = false;
        }

        function applyAuthoritativeAngleFeedback(value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue) || numericValue < -45 || numericValue > 45) return;
            authoritativeAngleValue = Math.round(numericValue * 100) / 100;
            if (angleDragging || angleEditing) return;
            showLocalAngle(authoritativeAngleValue);
            numericAngleCommittedValue = Number(angleNumber.value);
        }

        function markAngleUnavailable() {
            if (angleValueLabel) angleValueLabel.textContent = "Unavailable";
            if (angleRange) angleRange.disabled = true;
            if (angleNumber) angleNumber.disabled = true;
            if (angleDecrementButton) angleDecrementButton.disabled = true;
            if (angleIncrementButton) angleIncrementButton.disabled = true;
            if (angleResetButton) angleResetButton.disabled = true;
        }

        function stepAngleValue(direction) {
            const currentValue = parseAngleValue(angleNumber ? angleNumber.value : "");
            if (currentValue === null) return;
            const value = Math.max(-45, Math.min(45, Math.round((currentValue + direction * 0.1) * 10) / 10));
            showLocalAngle(value);
            numericAngleCommittedValue = value;
            scheduleAngleValue(value);
        }

        async function submitAngleValue(value) {
            if (value === lastSubmittedAngleValue && !angleRequestInFlight) return;

            if (angleRequestInFlight) {
                pendingAngleValue = value;
                return;
            }

            angleRequestInFlight = true;
            lastSubmittedAngleValue = value;
            await sendCommand(angleCommandPath(value));
            angleRequestInFlight = false;

            if (pendingAngleValue !== null) {
                const nextValue = pendingAngleValue;
                pendingAngleValue = null;
                if (nextValue !== lastSubmittedAngleValue) submitAngleValue(nextValue);
            }
        }

        function scheduleAngleValue(value) {
            pendingAngleValue = value;
            if (angleThrottleTimer !== null) return;

            angleThrottleTimer = setTimeout(function () {
                angleThrottleTimer = null;
                const nextValue = pendingAngleValue;
                pendingAngleValue = null;
                if (nextValue !== null) submitAngleValue(nextValue);
            }, 100);
        }

        function flushAngleValue(value) {
            if (angleThrottleTimer !== null) {
                clearTimeout(angleThrottleTimer);
                angleThrottleTimer = null;
            }
            pendingAngleValue = null;
            submitAngleValue(value);
        }

            angleResetButton = makeButton("Reset", "reset", function () {

            angleRange.addEventListener("pointerdown", function () {

            });
            angleRange.addEventListener("input", function () {

            angleRange.addEventListener("pointerup", function () {

            angleRange.addEventListener("change", function () {

            function commitNumericAngle() {
                const value = parseAngleValue(angleNumber.value);
                if (value === null) {
                    setStatus("ERROR: Crop Angle must be between -45 and 45 with at most two decimal places.");
                    showLocalAngle(authoritativeAngleValue);
                    numericAngleCommittedValue = authoritativeAngleValue;
                    angleEditing = false;
                    return false;
                }
                if (value !== numericAngleCommittedValue) {
                    showLocalAngle(value);
                    numericAngleCommittedValue = value;
                    flushAngleValue(value);
                }
                angleEditing = false;
                return true;
            }

            angleNumber.addEventListener("focus", function () {
                angleEditing = true;

            angleNumber.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    commitNumericAngle();
                    angleNumber.blur();
                } else if (event.key === "Escape") {
                    event.preventDefault();
                    cancelNextAngleBlur = true;
                    angleEditing = false;
                    showLocalAngle(authoritativeAngleValue);
                    numericAngleCommittedValue = authoritativeAngleValue;
                    angleNumber.blur();
                }
            });
            angleNumber.addEventListener("change", function () {
                if (angleEditing) commitNumericAngle();
            });
            angleNumber.addEventListener("blur", function () {
                if (cancelNextAngleBlur) {
                    cancelNextAngleBlur = false;
                    return;
                }
                if (angleEditing) commitNumericAngle();

            row.appendChild(name);
            row.appendChild(angleRange);
            row.appendChild(angleNumber);
            row.appendChild(angleDecrementButton);
            row.appendChild(angleIncrementButton);

            row.appendChild(angleValueLabel);

        function formatDevelopSliderValue(definition, value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) return "Unavailable";
            return String(Number(numericValue.toFixed(definition.displayPrecision)));
        }

        function parseDevelopSliderValue(definition, rawValue) {
            if (typeof rawValue !== "string") return null;
            const normalizedValue = rawValue.replace(",", ".");
            if (
                normalizedValue.trim() !== normalizedValue ||
                normalizedValue === "" ||
                !/^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(normalizedValue)
            ) return null;
            const numericValue = Number(normalizedValue);
            if (!Number.isFinite(numericValue) || numericValue < definition.min || numericValue > definition.max) {
                return null;
            }
            const scaled = (numericValue - definition.min) / definition.numericStep;
            return Math.abs(scaled - Math.round(scaled)) < 1e-9 ? numericValue : null;
        }

        function clampDevelopSliderValue(definition, value) {
            return Math.min(definition.max, Math.max(definition.min, value));
        }

        function roundDevelopSliderValue(definition, value, step) {
            const clamped = clampDevelopSliderValue(definition, value);
            const snapped = definition.min + Math.round((clamped - definition.min) / step) * step;
            const rounded = Number(snapped.toFixed(definition.displayPrecision));
            if (Math.abs(clamped - definition.min) < 1e-9) return definition.min;
            if (Math.abs(clamped - definition.max) < 1e-9) return definition.max;
            return clampDevelopSliderValue(definition, rounded);
        }

        function usesTemperatureVisualScale(definition) {
            return definition.visualScale === "temperature" && definition.min > 0 && definition.max > 0;
        }

        function actualToDevelopSliderPosition(definition, value) {
            const actual = clampDevelopSliderValue(definition, Number(value));
            if (!usesTemperatureVisualScale(definition)) return actual;
            if (actual === definition.min) return 0;
            if (actual === definition.max) return 1000;
            return 1000 * (
                (Math.log(actual) - Math.log(definition.min)) /
                (Math.log(definition.max) - Math.log(definition.min))
            );
        }

        function developSliderPositionToActual(definition, position) {
            if (!usesTemperatureVisualScale(definition)) {
                return roundDevelopSliderValue(definition, Number(position), definition.rangeStep);
            }
            const normalized = Math.min(1, Math.max(0, Number(position) / 1000));
            if (normalized === 0) return definition.min;
            if (normalized === 1) return definition.max;
            const actual = Math.exp(
                Math.log(definition.min) +
                normalized * (Math.log(definition.max) - Math.log(definition.min))
            );
            return roundDevelopSliderValue(definition, actual, definition.rangeStep);
        }

        function nextDevelopSliderStepValue(control, direction) {
            const baseValue = control.desiredValue !== null
                ? control.desiredValue
                : (control.localValue !== null ? control.localValue : control.authoritativeValue);
            if (baseValue === null) return null;
            return roundDevelopSliderValue(
                control.definition,
                baseValue + direction * control.definition.rangeStep,
                control.definition.rangeStep
            );
        }

        function configureDevelopSliderRange(control) {
            if (usesTemperatureVisualScale(control.definition)) {
                control.range.min = "0";
                control.range.max = "1000";
                control.range.step = "1";
            } else {
                control.range.min = String(control.definition.min);
                control.range.max = String(control.definition.max);
                control.range.step = String(control.definition.rangeStep);
            }
        }

        function setDevelopSliderState(control, state, message) {
            const normalizedState = state || "available";
            const normalizedMessage = message || "";
            if (
                control.feedbackState === normalizedState &&
                control.stateMessage === normalizedMessage
            ) return false;
            control.row.classList.remove("loading", "unavailable", "error");
            if (state) control.row.classList.add(state);
            control.state.textContent = normalizedMessage;
            control.feedbackState = normalizedState;
            control.stateMessage = normalizedMessage;
            return true;
        }

        function showDevelopSliderLocal(control, value) {
            const numericValue = Number(value);
            const visualPosition = actualToDevelopSliderPosition(control.definition, value);
            const visualText = String(visualPosition);
            const visualMin = Number(control.range.min);
            const visualMax = Number(control.range.max);
            const progress = 100 * (visualPosition - visualMin) / (visualMax - visualMin);
            const progressText = progress + "%";
            const numberText = formatDevelopSliderValue(control.definition, value);
            const unchanged = control.localValue !== null &&
                valuesMatchDevelopSlider(control.definition, control.localValue, numericValue) &&
                control.range.value === visualText &&
                control.number.value === numberText &&
                control.visualProgress === progressText &&
                control.feedbackState === "available";
            control.localValue = numericValue;
            if (unchanged) return false;
            if (control.range.value !== visualText) control.range.value = visualText;
            if (control.visualProgress !== progressText) {
                control.range.style.setProperty("--slider-progress", progressText);
                control.visualProgress = progressText;
            }
            if (control.number.value !== numberText) control.number.value = numberText;
            setDevelopSliderState(control, "", "");
            return true;
        }

        function applyDevelopSliderFeedback(control, value, rangeChanged) {
            const numericValue = Number(value);
            if (
                !Number.isFinite(numericValue) ||
                numericValue < control.definition.min ||
                numericValue > control.definition.max
            ) {
                return;
            }

            control.authoritativeValue = numericValue;
            control.hasAuthoritativeValueEver = true;
            hasReceivedAnyAuthoritativeDevelopValue = true;

            if (control.desiredValue !== null) {
                if (valuesMatchDevelopSlider(control.definition, numericValue, control.desiredValue)) {
                    const confirmedValue = control.desiredValue;
                    cancelDevelopSliderStep(control);
                    if (rangeChanged || !valuesMatchDevelopSlider(
                        control.definition,
                        control.localValue,
                        confirmedValue
                    )) {
                        showDevelopSliderLocal(control, confirmedValue);
                    }
                    control.numberCommittedValue = numericValue;
                } else if (control.stepConfirmationExpired) {
                    cancelDevelopSliderStep(control);
                    showDevelopSliderLocal(control, numericValue);
                    control.numberCommittedValue = numericValue;
                }
                return;
            }

            if (control.dragging || control.editing) return;

            if (
                rangeChanged ||
                control.localValue === null ||
                !valuesMatchDevelopSlider(control.definition, control.localValue, numericValue) ||
                control.feedbackState !== "available"
            ) {
                showDevelopSliderLocal(control, numericValue);
            }
            control.numberCommittedValue = numericValue;
            if (control.range.disabled) control.range.disabled = false;
            if (control.number.disabled) control.number.disabled = false;
            if (control.decrement.disabled) control.decrement.disabled = false;
            if (control.increment.disabled) control.increment.disabled = false;
            if (control.reset.disabled) control.reset.disabled = false;
        }

        function applyDevelopSliderFeedbackIfChanged(control, result) {
            if (isDevelopSliderInteracting(control)) {
                control.deferredFeedbackResult = result;
                if (result.available !== false && Number.isFinite(Number(result.value))) {
                    control.authoritativeValue = Number(result.value);
                    control.hasAuthoritativeValueEver = true;
                    hasReceivedAnyAuthoritativeDevelopValue = true;
                }
                return;
            }
            if (control.confirmationPending && !control.stepConfirmationExpired) {
                control.deferredFeedbackResult = result;
                if (result.available !== false && Number.isFinite(Number(result.value))) {
                    control.authoritativeValue = Number(result.value);
                    control.hasAuthoritativeValueEver = true;
                    hasReceivedAnyAuthoritativeDevelopValue = true;
                    if (valuesMatchDevelopSlider(control.definition, result.value, control.desiredValue)) {
                        control.numberCommittedValue = Number(result.value);
                        cancelDevelopSliderStep(control);
                    }
                }
                return;
            }
            if (result.available === false) {
                if (control.feedbackState !== "unavailable") markDevelopSliderUnavailable(control);
                return;
            }

            let rangeChanged = false;
            if (result.range && Number.isFinite(result.range.min) && Number.isFinite(result.range.max)) {
                rangeChanged =
                    control.definition.min !== result.range.min ||
                    control.definition.max !== result.range.max;
                if (rangeChanged) {
                    control.definition.min = result.range.min;
                    control.definition.max = result.range.max;
                    configureDevelopSliderRange(control);
                }
            }

            applyDevelopSliderFeedback(control, result.value, rangeChanged);
        }

        function markDevelopSliderUnavailable(control) {
            if (isDevelopSliderInteracting(control) || control.confirmationPending) return;
            if (control.feedbackState === "unavailable" && control.desiredValue === null) return;
            cancelDevelopSliderStep(control);
            control.authoritativeValue = null;
            control.numberCommittedValue = null;
            control.localValue = null;
            control.number.value = "";
            setDevelopSliderState(control, "unavailable", "Unavailable");
            control.range.disabled = true;
            control.number.disabled = true;
            control.decrement.disabled = true;
            control.increment.disabled = true;
            control.reset.disabled = true;
        }

        function markDevelopSliderLoading(control, reason) {
            if (isDevelopSliderInteracting(control) || control.confirmationPending) return;
            if (control.hasAuthoritativeValueEver) return;
            if (control.feedbackState === "loading" && control.desiredValue === null) return;
            console.debug("LRBridge slider visible Loading", {
                sliderId: control.definition.id,
                reason: reason || "unspecified",
                hadAuthoritativeValue: control.hasAuthoritativeValueEver,
                activeTab: activeTab,
                classification: currentDevelopRefreshClassification
            });
            cancelDevelopSliderStep(control);
            control.authoritativeValue = null;
            control.numberCommittedValue = null;
            control.localValue = null;
            control.range.disabled = true;
            control.number.disabled = true;
            control.decrement.disabled = true;
            control.increment.disabled = true;
            control.reset.disabled = true;
            control.number.value = "";
            setDevelopSliderState(control, "loading", "Loading…");
        }

        function markDevelopSliderError(control) {
            if (isDevelopSliderInteracting(control) || control.confirmationPending || control.authoritativeValue !== null) return;
            cancelDevelopSliderStep(control);
            if (control.feedbackState === "error") return;
            control.number.value = "";
            setDevelopSliderState(control, "error", "Feedback error");
        }

        function markUninitializedDevelopSlidersLoading(reason) {
            Object.keys(developSliderControls).forEach(function (slider) {
                markDevelopSliderLoading(developSliderControls[slider], reason);
            });
        }

        async function submitDevelopSliderValue(control, value, kind, completion) {
            if (
                value === control.lastSubmittedValue &&
                !control.requestInFlight &&
                control.authoritativeValue !== null &&
                valuesMatchDevelopSlider(control.definition, control.authoritativeValue, value)
            ) {
                if (completion) completion(true);
                return;
            }
            if (control.requestInFlight) {
                control.pendingValue = value;
                control.pendingKind = kind || null;
                control.pendingCompletion = completion || null;
                return;
            }

            control.requestInFlight = true;
            control.lastSubmittedValue = value;
            markSliderCommandSent();
            const accepted = await sendCommand(
                "/api/set?slider=" + encodeURIComponent(control.definition.id) +
                "&value=" + encodeURIComponent(String(value))
            );
            control.requestInFlight = false;
            if (completion) completion(accepted);

            if (control.pendingValue !== null) {
                const nextValue = control.pendingValue;
                const nextKind = control.pendingKind;
                const nextCompletion = control.pendingCompletion;
                control.pendingValue = null;
                control.pendingKind = null;
                control.pendingCompletion = null;
                if (nextValue !== control.lastSubmittedValue) {
                    submitDevelopSliderValue(control, nextValue, nextKind, nextCompletion);
                } else if (nextCompletion) {
                    nextCompletion(true);
                }
            }
        }

        function scheduleDevelopSliderValue(control, value) {
            control.pendingValue = value;
            control.pendingKind = "range";
            if (control.throttleTimer !== null) return;

            control.throttleTimer = setTimeout(function () {
                control.throttleTimer = null;
                const nextValue = control.pendingValue;
                control.pendingValue = null;
                if (nextValue !== null) submitDevelopSliderValue(control, nextValue, "range");
            }, 100);
        }

        function flushDevelopSliderValue(control, value, kind) {
            if (control.throttleTimer !== null) {
                clearTimeout(control.throttleTimer);
                control.throttleTimer = null;
            }
            control.pendingValue = null;
            control.pendingKind = null;
            control.pendingCompletion = null;
            control.desiredValue = value;
            control.confirmationPending = true;
            control.stepConfirmationExpired = false;
            submitDevelopSliderValue(control, value, kind || null, function (accepted) {
                handleDevelopSliderStepSubmission(control, value, accepted);
            });
        }

        function clearDevelopSliderStepTimers(control) {
            if (control.stepDebounceTimer !== null) {
                clearTimeout(control.stepDebounceTimer);
                control.stepDebounceTimer = null;
            }
            if (control.stepConfirmationTimer !== null) {
                clearTimeout(control.stepConfirmationTimer);
                control.stepConfirmationTimer = null;
            }
        }

        function cancelDevelopSliderStep(control) {
            clearDevelopSliderStepTimers(control);
            control.desiredValue = null;
            control.confirmationPending = false;
            control.stepConfirmationExpired = false;
            if (control.pendingKind === "step") {
                control.pendingValue = null;
                control.pendingKind = null;
                control.pendingCompletion = null;
            }
        }

        function developSliderConfirmationTolerance(definition) {
            return Math.max(
                definition.numericStep / 2,
                Math.pow(10, -definition.displayPrecision) / 2,
                1e-9
            );
        }

        function valuesMatchDevelopSlider(definition, left, right) {
            return Math.abs(Number(left) - Number(right)) <=
                developSliderConfirmationTolerance(definition);
        }

        async function requestDevelopSliderStepFeedback(control, adoptResult) {
            const slider = control.definition.id;
            try {
                const response = await fetch(
                    "/api/feedback/request?slider=" + encodeURIComponent(slider),
                    { cache: "no-store" }
                );
                const data = await response.json();
                const request = data && data.request;
                if (!response.ok || !request || request.id === undefined) {
                    throw new Error("Targeted feedback request failed");
                }
                const outcome = await pollFeedbackSnapshot(request.id, 1900);
                const result = outcome.snapshot &&
                    outcome.snapshot.results &&
                    outcome.snapshot.results[slider];
                if (!result) {
                    if (adoptResult) {
                        cancelDevelopSliderStep(control);
                        if (control.authoritativeValue !== null) {
                            showDevelopSliderLocal(control, control.authoritativeValue);
                        }
                        setStatus("ERROR: " + slider + " confirmation timed out.");
                    }
                    return;
                }
                if (adoptResult) control.stepConfirmationExpired = true;
                applyDevelopSliderFeedbackIfChanged(control, result);
            } catch (err) {
                if (adoptResult) {
                    cancelDevelopSliderStep(control);
                    if (control.authoritativeValue !== null) {
                        showDevelopSliderLocal(control, control.authoritativeValue);
                    }
                    setStatus("ERROR: " + slider + " confirmation failed.");
                }
                console.error("LRBridge targeted slider feedback failed", {
                    slider: slider,
                    reason: err.message
                });
            }
        }

        function handleDevelopSliderStepSubmission(control, desiredAtSubmission, accepted) {
            if (control.desiredValue === null || !valuesMatchDevelopSlider(
                control.definition,
                control.desiredValue,
                desiredAtSubmission
            )) return;

            if (!accepted) {
                cancelDevelopSliderStep(control);
                if (control.authoritativeValue !== null) {
                    showDevelopSliderLocal(control, control.authoritativeValue);
                }
                setStatus("ERROR: " + control.definition.label + " Set request was rejected.");
                return;
            }

            requestDevelopSliderStepFeedback(control, false);
            control.stepConfirmationTimer = setTimeout(function () {
                control.stepConfirmationTimer = null;
                if (control.desiredValue === null) return;
                requestDevelopSliderStepFeedback(control, true);
            }, 2000);
        }

        function scheduleDevelopSliderStepSubmission(control) {
            if (control.stepDebounceTimer !== null) clearTimeout(control.stepDebounceTimer);
            control.stepDebounceTimer = setTimeout(function () {
                control.stepDebounceTimer = null;
                if (control.desiredValue === null) return;
                const desiredAtSubmission = control.desiredValue;
                submitDevelopSliderValue(control, desiredAtSubmission, "step", function (accepted) {
                    handleDevelopSliderStepSubmission(control, desiredAtSubmission, accepted);
                });
            }, 350);
        }

        function stepDevelopSliderValue(control, direction) {
            if (!control) return;
            const nextValue = nextDevelopSliderStepValue(control, direction);
            if (nextValue === null) return;
            const baseValue = control.desiredValue !== null
                ? control.desiredValue
                : (control.localValue !== null ? control.localValue : control.authoritativeValue);
            if (nextValue === baseValue) return;
            clearDevelopSliderStepTimers(control);
            control.desiredValue = nextValue;
            control.stepConfirmationExpired = false;
            showDevelopSliderLocal(control, nextValue);
            control.numberCommittedValue = nextValue;
            scheduleDevelopSliderStepSubmission(control);
        }

        function createDevelopSliderControl(definition) {
            const previousControl = developSliderControls[definition.id];
            const row = document.createElement("div");
            row.className = "develop-slider-row";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = definition.label;

            const range = document.createElement("input");
            range.type = "range";
            range.disabled = true;
            range.setAttribute("aria-label", definition.label);

            const number = document.createElement("input");
            number.type = "text";
            number.inputMode = "decimal";
            number.autocomplete = "off";
            number.spellcheck = false;
            number.disabled = true;
            number.setAttribute("aria-label", definition.label + " numeric value");

            const state = document.createElement("span");
            state.className = "develop-slider-state";
            state.textContent = "";

            let control = null;

            const decrement = makeButton("−", "develop-slider-step", function () {
                stepDevelopSliderValue(control, -1);
            });
            decrement.setAttribute("aria-label", "Decrease " + definition.label);

            const increment = makeButton("+", "develop-slider-step", function () {
                stepDevelopSliderValue(control, 1);
            });
            increment.setAttribute("aria-label", "Increase " + definition.label);

            const reset = makeButton("Reset", "reset", function () {
                cancelDevelopSliderStep(control);
                markSliderCommandSent();
                sendCommand("/api/reset?slider=" + encodeURIComponent(definition.id)).then(function (accepted) {
                    if (accepted) {
                        setTimeout(function () {
                            requestLiveFeedbackSnapshot(true);
                        }, 300);
                    }
                });
            });

            control = {
                definition: definition,
                row: row,
                range: range,
                number: number,
                state: state,
                decrement: decrement,
                increment: increment,
                reset: reset,
                dragging: false,
                editing: false,
                pointerActive: false,
                interactionKind: null,
                contextInvalidated: false,
                confirmationPending: false,
                deferredFeedbackResult: null,
                ignoreNextRangeChange: false,
                requestInFlight: false,
                pendingValue: null,
                pendingKind: null,
                pendingCompletion: null,
                lastSubmittedValue: null,
                authoritativeValue: null,
                hasAuthoritativeValueEver: previousControl ? previousControl.hasAuthoritativeValueEver === true : false,
                localValue: null,
                desiredValue: null,
                numberCommittedValue: null,
                throttleTimer: null,
                cancelNextBlur: false,
                stepDebounceTimer: null,
                stepConfirmationTimer: null,
                stepConfirmationExpired: false,
                feedbackState: null,
                stateMessage: null,
                visualProgress: null
            };
            configureDevelopSliderRange(control);
            decrement.disabled = true;
            increment.disabled = true;
            reset.disabled = true;

            if (previousControl && previousControl.hasAuthoritativeValueEver && previousControl.localValue !== null) {
                control.authoritativeValue = previousControl.authoritativeValue;
                control.numberCommittedValue = previousControl.numberCommittedValue;
                showDevelopSliderLocal(control, previousControl.localValue);
                range.disabled = false;
                number.disabled = false;
                decrement.disabled = false;
                increment.disabled = false;
                reset.disabled = false;
            }

            row.dataset.sliderId = definition.id;

            range.addEventListener("pointerdown", function (event) {
                cancelDevelopSliderStep(control);
                beginDevelopSliderInteraction(control, "range");
                control.pointerActive = true;
                control.dragging = true;
                if (range.setPointerCapture) range.setPointerCapture(event.pointerId);
            });
            range.addEventListener("input", function () {
                cancelDevelopSliderStep(control);
                if (!isDevelopSliderInteracting(control)) beginDevelopSliderInteraction(control, "range");
                const nextValue = developSliderPositionToActual(definition, Number(range.value));
                showDevelopSliderLocal(control, nextValue);
                scheduleDevelopSliderValue(control, nextValue);
            });
            function finishRangeInteraction(event, submitFinal) {
                if (!isDevelopSliderInteracting(control)) return;
                const invalidated = control.contextInvalidated;
                control.pointerActive = false;
                control.dragging = false;
                if (event && range.hasPointerCapture && range.hasPointerCapture(event.pointerId)) range.releasePointerCapture(event.pointerId);
                if (submitFinal && !invalidated) {
                    flushDevelopSliderValue(control, developSliderPositionToActual(definition, Number(range.value)), "range");
                } else {
                    cancelDevelopSliderThrottle(control);
                }
                endDevelopSliderInteraction(control);
            }
            range.addEventListener("pointerup", function (event) {
                control.ignoreNextRangeChange = true;
                finishRangeInteraction(event, true);
            });
            range.addEventListener("pointercancel", function (event) {
                control.ignoreNextRangeChange = true;
                finishRangeInteraction(event, false);
            });
            range.addEventListener("lostpointercapture", function (event) {
                finishRangeInteraction(event, false);
            });
            range.addEventListener("change", function () {
                if (control.ignoreNextRangeChange) {
                    control.ignoreNextRangeChange = false;
                    return;
                }
                if (!control.pointerActive) finishRangeInteraction(null, true);
            });

            function commitNumericValue() {
                cancelDevelopSliderStep(control);
                if (control.contextInvalidated) {
                    cancelDevelopSliderThrottle(control);
                    endDevelopSliderInteraction(control);
                    return;
                }
                const nextValue = parseDevelopSliderValue(definition, number.value);
                if (nextValue === null) {
                    setStatus("ERROR: Invalid " + definition.label + " value.");
                    if (control.authoritativeValue !== null) {
                        showDevelopSliderLocal(control, control.authoritativeValue);
                    } else {
                        number.value = "";
                        markDevelopSliderLoading(control, "invalid-uninitialized-numeric-input");
                    }
                    endDevelopSliderInteraction(control);
                    return;
                }
                if (nextValue !== control.numberCommittedValue) {
                    showDevelopSliderLocal(control, nextValue);
                    control.numberCommittedValue = nextValue;
                    flushDevelopSliderValue(control, nextValue, "numeric");
                }
                endDevelopSliderInteraction(control);
            }

            number.addEventListener("focus", function () {
                beginDevelopSliderInteraction(control, "numeric");
                control.editing = true;
                control.cancelNextBlur = false;
                setTimeout(function () {
                    if (document.activeElement === number) number.select();
                }, 0);
            });
            number.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    commitNumericValue();
                    number.blur();
                } else if (event.key === "Escape") {
                    event.preventDefault();
                    control.cancelNextBlur = true;
                    if (control.authoritativeValue !== null) {
                        showDevelopSliderLocal(control, control.authoritativeValue);
                    }
                    endDevelopSliderInteraction(control);
                    number.blur();
                }
            });
            number.addEventListener("change", function () {
                if (control.editing) commitNumericValue();
            });
            number.addEventListener("blur", function () {
                if (control.cancelNextBlur) {
                    control.cancelNextBlur = false;
                    return;
                }
                if (control.editing) commitNumericValue();
            });

            control.cancelInteraction = function () {
                if (!isDevelopSliderInteracting(control)) return;
                control.contextInvalidated = true;
                cancelDevelopSliderThrottle(control);
                endDevelopSliderInteraction(control);
            };

            row.appendChild(name);
            row.appendChild(range);
            row.appendChild(number);
            row.appendChild(decrement);
            row.appendChild(increment);
            row.appendChild(reset);
            row.appendChild(state);

            developSliderControls[definition.id] = control;
            sliderFeedbackElements[definition.id] = row;
            return row;
        }

        window.addEventListener("blur", function () {
            Array.from(activeSliderInteractions).forEach(function (slider) {
                const control = developSliderControls[slider];
                if (control && control.cancelInteraction) control.cancelInteraction();
            });
        });

        function renderActionGroup(group) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = group.name;

            groupElement.appendChild(title);

            for (const item of group.actions) {
                addActionRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function renderSwitchGroup(group) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = "Switches - " + group.name;

            groupElement.appendChild(title);

            for (const item of group.switches) {
                addSwitchRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function renderActionsForPlacement(placement) {
            for (const group of sliderActionGroups) {
                if ((group.placement || "top") === placement) {
                    renderActionGroup(group);
                }
            }
        }

        function renderSwitchesForPlacement(placement) {
            for (const group of switchGroups) {
                if ((group.placement || "top") === placement) {
                    renderSwitchGroup(group);
                }
            }
        }

        function renderSlidersTab() {
            developLoadingStatus = document.createElement("div");
            developLoadingStatus.className = "develop-loading-status";
            developLoadingStatus.role = "status";
            developLoadingStatus.textContent = (
                typeof hasReceivedAnyAuthoritativeDevelopValue !== "undefined" &&
                hasReceivedAnyAuthoritativeDevelopValue
            ) ? "" : "Loading Lightroom values…";
            content.appendChild(developLoadingStatus);
            renderActionsForPlacement("top");

            const groups = [];
            developSliderDefinitions.forEach(function (definition) {
                let group = groups.find(function (item) {
                    return item.name === definition.group;
                });
                if (!group) {
                    group = { name: definition.group, sliders: [] };
                    groups.push(group);
                }
                group.sliders.push(definition);
            });

            for (const group of groups) {
                renderActionsForPlacement("before:" + group.name);
                renderSwitchesForPlacement("before:" + group.name);

                const groupElement = document.createElement("section");
                groupElement.className = "group";

                const title = document.createElement("div");
                title.className = "group-title";
                title.textContent = group.name;

                groupElement.appendChild(title);

                for (const definition of group.sliders) {
                    groupElement.appendChild(createDevelopSliderControl(definition));
                }

                content.appendChild(groupElement);
            }

            setTimeout(function () {
                requestLiveFeedbackSnapshot(true);
            }, 0);
        }

        function renderToolTab(tab) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = tab.title;

            groupElement.appendChild(title);

            for (const item of tab.actions) {
                addActionRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function render() {
            renderTabs();

            const colorGradingActive = activeTab === "color-grading";
            content.hidden = colorGradingActive;
            document.getElementById("colorGradingWorkspace").hidden = !colorGradingActive;
            if (colorGradingActive) {
                deactivateDevelopFeedbackPolling();
                colorGradingController.activate();
                return;
            }

            colorGradingController.deactivate();
            if (activeTab !== "sliders") deactivateDevelopFeedbackPolling();
            clearContent();

            if (activeTab === "sliders") {
                renderSlidersTab();
                activateDevelopFeedbackPolling();
                return;
            }

            if (activeTab === "selection") {
                renderCommandGroups(selectionGroups);
                return;
            }

            if (activeTab === "crop") {
                renderCommandGroups(cropGroups);
                return;
            }

            if (activeTab === "application") {
                renderCommandGroups(applicationGroups);
                return;
            }

            const tab = toolTabs.find(function (item) {
                return item.id === activeTab;
            });

            if (tab) {
                renderToolTab(tab);
            }
        }

        async function loadDevelopSliderDefinitions() {
            const response = await fetch("/api/sliders", { cache: "no-store" });
            if (!response.ok) throw new Error("Slider metadata request failed");
            const data = await response.json();
            developSliderDefinitions = (data.sliders || []).filter(function (definition) {
                return definition.feedbackSupported === true;
            });
        }

        loadDevelopSliderDefinitions().then(function () {
            render();
            startLiveFeedbackPolling();
        }).catch(function () {
            renderTabs();
            clearContent();
            setStatus("ERROR: Could not load authoritative slider metadata.");
        });

        const colorGradingController = LRBridgeColorGrading.createController({
            document: document,
            window: window,
            fetch: window.fetch.bind(window),
            setStatus: setStatus,
            elements: {
                cgStatus: document.getElementById("colorGradingStatus"),
                cgContent: document.getElementById("colorGradingContent"),
                viewButtons: []
            }
        });
        colorGradingController.initialize();
        window.addEventListener("hashchange", function () {
            const hash = window.location.hash.replace(/^#/, "");
            selectControllerTab(hash === "develop" ? "sliders" : hash, false);
        });
    </script>
</body>
</html>
