<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>LRBridge Web Controller</title>
    <style>
        body {
            margin: 0;
            background: #101418;
            color: #d7e1ea;
            font-family: Segoe UI, Arial, sans-serif;
        }

        .controller-header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            padding: 12px 22px;
            background: #161d24;
            border-bottom: 1px solid #28323d;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .header-help-button {
            display: inline-block;
            background: #273442;
            color: #ffffff;
            border: 1px solid #3b4b5c;
            border-radius: 7px;
            padding: 8px 12px;
            font-size: 14px;
            text-decoration: none;
        }

        .header-help-button:hover {
            background: #314151;
        }

        .tabs {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            padding: 0 22px;
            background: #0b1117;
            border-bottom: 1px solid #25313d;
        }

        .tab-button {
            position: relative;
            background: transparent;
            color: #8fa2b3;
            border: 0;
            border-radius: 0;
            padding: 15px 18px 13px 18px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .tab-button:hover {
            background: #121b25;
            color: #d7e1ea;
        }

        .tab-button.active {
            background: #151f2a;
            color: #ffffff;
            box-shadow: inset 0 -3px 0 #ffb454;
        }

        .tab-button.active:hover {
            background: #182432;
            color: #ffffff;
        }

        .content {
            padding: 16px 22px;
        }

        .group {
            margin-bottom: 22px;
        }

        .group-title {
            color: #8fa2b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .command-group-note {
            max-width: 920px;
            margin: -2px 0 10px;
            color: #9fb0bf;
            font-size: 13px;
            line-height: 1.45;
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            max-width: 920px;
        }

        .command-grid button {
            min-height: 44px;
        }

        .row {
            display: grid;
            grid-template-columns: 240px repeat(5, 70px) minmax(180px, 1fr);
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .switch-row {
            display: grid;
            grid-template-columns: 240px 90px 90px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 240px 140px 1fr;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .slider-name {
            background: #18212a;
            border: 1px solid #2b3744;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .switch-status {
            color: #ffb454;
            font-size: 13px;
        }

        button {
            background: #273442;
            color: #ffffff;
            border: 1px solid #3b4b5c;
            border-radius: 7px;
            padding: 10px 10px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #314151;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        button:disabled:hover {
            background: #273442;
        }

        button.positive {
            background: #2a6f97;
            border-color: #3a8cc0;
        }

        button.positive:hover {
            background: #327eab;
        }

        button.command-primary {
            background: #2a6f97;
            border-color: #3a8cc0;
        }

        button.command-primary:hover {
            background: #327eab;
        }

        button.command-neutral,
        button.label-none {
            background: #46515c;
            border-color: #626f7c;
            color: #ffffff;
        }

        button.command-neutral:hover,
        button.label-none:hover {
            background: #56626e;
        }

        button.command-success,
        button.label-green {
            background: #27613d;
            border-color: #398257;
            color: #ffffff;
        }

        button.command-success:hover,
        button.label-green:hover {
            background: #32754b;
        }

        button.command-danger,
        button.label-red {
            background: #742f3a;
            border-color: #9a4452;
            color: #ffffff;
        }

        button.command-danger:hover,
        button.label-red:hover {
            background: #893946;
        }

        button.command-warning,
        button.label-yellow {
            background: #d6a52b;
            border-color: #efc24d;
            color: #17130a;
        }

        button.command-warning:hover,
        button.label-yellow:hover {
            background: #e4b63b;
        }

        button.command-purple,
        button.label-purple {
            background: #573d78;
            border-color: #76559e;
            color: #ffffff;
        }

        button.command-purple:hover,
        button.label-purple:hover {
            background: #68498e;
        }

        button.label-blue {
            background: #174a70;
            border-color: #286b99;
            color: #ffffff;
        }

        button.label-blue:hover {
            background: #205a84;
        }

        button.negative {
            background: #5c3442;
            border-color: #7a4756;
        }

        button.negative:hover {
            background: #6b3c4d;
        }

        button.reset {
            background: #7a4f24;
            border-color: #9b6530;
        }

        button.reset:hover {
            background: #8a5a2a;
        }

        .drag-strip {
            position: relative;
            min-height: 40px;
            border: 1px solid #3b4b5c;
            border-radius: 999px;
            background: #0b1117;
            color: #8fa2b3;
            cursor: ew-resize;
            user-select: none;
            touch-action: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .drag-strip::before {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            top: 50%;
            height: 2px;
            background: #33414f;
            transform: translateY(-50%);
        }

        .drag-strip::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #506173;
            transform: translateX(-50%);
        }

        .drag-strip.active {
            border-color: #ffb454;
            background: #111820;
            color: #ffffff;
        }

        .drag-strip-label {
            position: relative;
            z-index: 1;
            background: #0b1117;
            border-radius: 999px;
            padding: 2px 9px;
            pointer-events: none;
        }

        .slider-jump-control {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0 12px;
            margin: 0 0 14px;
            background: #101820;
            border-bottom: 1px solid #26313d;
        }

        .slider-jump-label {
            color: #9fb4c8;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .slider-jump-main-button {
            min-width: 190px;
            min-height: 44px;
            border: 1px solid #d18a36;
            border-radius: 12px;
            background: #111111;
            color: #f4f4f4;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .slider-jump-main-button:hover {
            background: #1a1a1a;
            border-color: #f0a64a;
        }

        .slider-jump-main-button.active {
            background: #111111;
            border-color: #f0a64a;
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(240, 166, 74, 0.22);
        }

        .slider-jump-popover {
            position: absolute;
            left: 0;
            top: calc(100% - 2px);
            width: min(620px, calc(100vw - 42px));
            max-height: min(70vh, 620px);
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 14px;
            border: 2px solid #d18a36;
            border-radius: 16px;
            background: linear-gradient(180deg, #7a4c18 0%, #5f3912 100%);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.68), 0 0 0 2px rgba(209, 138, 54, 0.22);
        }

        .slider-jump-popover[hidden] {
            display: none;
        }

        .slider-jump-option {
            min-height: 54px;
            border: 1px solid #2a2a2a;
            border-radius: 13px;
            background: #101010;
            color: #f4f4f4;
            padding: 10px 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .slider-jump-option:hover,
        .slider-jump-option:focus {
            background: #1a1a1a;
            border-color: #f0a64a;
        }

        .slider-jump-target {
            scroll-margin-top: 78px;
        }

        @media (max-width: 720px) {
            .slider-jump-control {
                align-items: stretch;
                flex-direction: column;
            }

            .slider-jump-main-button {
                width: 100%;
            }

            .slider-jump-popover {
                width: calc(100vw - 42px);
                grid-template-columns: 1fr;
            }
        }

        .status {
            margin: 0 22px 16px 22px;
            background: #050708;
            border: 1px solid #2b3744;
            border-radius: 8px;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 13px;
            min-height: 20px;
            white-space: pre-wrap;
        }

        a {
            color: #6dc8ff;
        }

        @media (max-width: 760px) {
            .row,
            .switch-row,
            .action-row {
                grid-template-columns: 1fr;
                background: #18212a;
                border: 1px solid #2b3744;
                border-radius: 8px;
                padding: 10px;
            }

            .slider-name {
                border: 0;
                padding: 0 0 6px 0;
            }
        }        .slider-feedback {
            display: block;
            margin-top: 4px;
            color: #9fb0bf;
            font-size: 12px;
            font-weight: 400;
        }

        .slider-feedback.active {
            color: #7cc7ff;
        }

        .slider-feedback.error {
            color: #ff9b9b;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-backdrop[hidden] {
            display: none;
        }

        .crop-modal {
            width: min(360px, 100%);
            border: 1px solid #344453;
            border-radius: 10px;
            padding: 18px;
            background: #131b22;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.5);
        }

        .crop-modal h2 {
            margin: 0 0 14px;
            font-size: 20px;
        }

        .crop-modal-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .crop-modal label {
            display: grid;
            gap: 6px;
            color: #c7d2dc;
            font-size: 13px;
        }

        .crop-modal input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #405263;
            border-radius: 6px;
            padding: 9px;
            background: #080c10;
            color: #f4f7fa;
        }

        .crop-modal-error {
            min-height: 18px;
            margin: 10px 0 4px;
            color: #ff9b9b;
            font-size: 13px;
        }

        .crop-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .angle-control {
            display: grid;
            grid-template-columns: minmax(180px, 1fr) 100px auto auto;
            align-items: center;
            gap: 10px;
        }

        .angle-control input[type="range"] {
            width: 100%;
        }

        .angle-control input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #405263;
            border-radius: 6px;
            padding: 8px;
            background: #080c10;
            color: #f4f7fa;
        }

        .angle-value {
            min-width: 58px;
            color: #7cc7ff;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 680px) {
            .angle-control {
                grid-template-columns: 1fr 90px;
            }
        }

    </style>
</head>
<body>
    <header class="controller-header">
        <h1>LRBridge Web Controller</h1>
        <a class="header-help-button" href="/help" target="_blank" rel="noopener">Open Help</a>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main class="content" id="content"></main>

    <div class="status" id="status">Ready.</div>

    <div class="modal-backdrop" id="customCropModal" hidden>
        <form class="crop-modal" id="customCropForm" role="dialog" aria-modal="true" aria-labelledby="customCropTitle">
            <h2 id="customCropTitle">Custom Crop Ratio</h2>
            <div class="crop-modal-fields">
                <label>Width
                    <input id="customCropWidth" type="number" min="1" max="10000" step="1" value="16" required>
                </label>
                <label>Height
                    <input id="customCropHeight" type="number" min="1" max="10000" step="1" value="10" required>
                </label>
            </div>
            <div class="crop-modal-error" id="customCropError" aria-live="polite"></div>
            <div class="crop-modal-actions">
                <button type="button" id="customCropCancel">Cancel</button>
                <button type="submit" id="customCropApply" class="command-primary">Apply</button>
            </div>
        </form>
    </div>

        function setStatus(message) {

        function formatResponseText(text) {
            if (!text) {
                return "";
            }

            try {
                const data = JSON.parse(text);

                if (data.error) {
                    return data.error;
                }

                if (data.queued && data.queued.command) {
                    const slider = data.queued.slider ? " " + data.queued.slider : "";
                    const amount = data.queued.amount !== undefined ? " " + data.queued.amount : "";
                    const action = data.queued.action ? " " + data.queued.action : "";

                    return data.queued.command + slider + amount + action;
                }

                if (data.ok === true) {
                    return "Command accepted";
                }

                return JSON.stringify(data);
            } catch (err) {
                return text;
            }
        }

        async function sendCommand(path) {
            setStatus("Sending: " + path);

            try {
                const response = await fetch(path, {
                    cache: "no-store"
                });

                const text = await response.text();
                const detail = formatResponseText(text);

                if (!response.ok) {
                    setStatus("ERROR " + response.status + ": " + detail);
                    return false;
                }

                setStatus("OK: " + detail);
                return true;
            } catch (err) {
                setStatus("ERROR: " + err.message);
                return false;
            }
        }

        const customCropModal = document.getElementById("customCropModal");
        const customCropForm = document.getElementById("customCropForm");
        const customCropWidth = document.getElementById("customCropWidth");
        const customCropHeight = document.getElementById("customCropHeight");
        const customCropError = document.getElementById("customCropError");
        const customCropApply = document.getElementById("customCropApply");
        let customCropSubmitting = false;

        function parseCustomCropDimension(value) {
            if (typeof value !== "string" || !/^\d+$/.test(value)) return null;
            const number = Number(value);
            return Number.isSafeInteger(number) && number >= 1 && number <= 10000 ? number : null;
        }

        function customCropCommandPath(width, height) {
            return "/api/command?command=photo.crop_aspect&mode=custom&w=" +
                encodeURIComponent(String(width)) + "&h=" + encodeURIComponent(String(height));
        }

        function validateCustomCropModal() {
            const width = parseCustomCropDimension(customCropWidth.value);
            const height = parseCustomCropDimension(customCropHeight.value);
            const valid = width !== null && height !== null;
            customCropError.textContent = valid ? "" : "Width and Height must be whole numbers from 1 to 10000.";
            customCropApply.disabled = !valid || customCropSubmitting;
            return valid ? { width: width, height: height } : null;
        }

        function openCustomCropModal() {
            customCropModal.hidden = false;
            customCropError.textContent = "";
            validateCustomCropModal();
            customCropWidth.focus();
            customCropWidth.select();
        }

        function closeCustomCropModal() {
            if (customCropSubmitting) return;
            customCropModal.hidden = true;
            customCropError.textContent = "";
        }

        async function applyCustomCrop() {
            const dimensions = validateCustomCropModal();
            if (!dimensions || customCropSubmitting) return false;

            customCropSubmitting = true;
            customCropApply.disabled = true;
            const accepted = await sendCommand(customCropCommandPath(dimensions.width, dimensions.height));
            customCropSubmitting = false;

            if (accepted) {
                customCropModal.hidden = true;
                customCropError.textContent = "";
            } else {
                validateCustomCropModal();
            }
            return accepted;
        }

        customCropWidth.addEventListener("input", validateCustomCropModal);
        customCropHeight.addEventListener("input", validateCustomCropModal);
        customCropForm.addEventListener("submit", function (event) {
            event.preventDefault();
            applyCustomCrop();
        });
        document.getElementById("customCropCancel").addEventListener("click", closeCustomCropModal);
        customCropModal.addEventListener("click", function (event) {

        function makeButton(text, className, onClick) {

        const autoActionCooldownMs = 2200;
        const autoActionCooldownActions = new Set(["setAutoTone", "setAutoWhiteBalance"]);

        const autoActionButtons = {};
        let autoActionCooldownUntil = 0;
        let autoActionCooldownTimer = null;

        function isAutoActionCooldownActive() {
            return Date.now() < autoActionCooldownUntil;
        }

        function isAutoActionCooldownActiveFor(action) {
            return autoActionCooldownActions.has(action) && isAutoActionCooldownActive();
        }

        function updateAutoActionButtons() {
            const remainingMs = Math.max(0, autoActionCooldownUntil - Date.now());

            Object.keys(autoActionButtons).forEach(function (action) {
                const button = autoActionButtons[action];

                if (!button) {
                    return;
                }

                if (remainingMs > 0) {
                    const remainingSeconds = Math.ceil(remainingMs / 1000);
                    button.disabled = true;
                    button.textContent = "Wait " + remainingSeconds + "s";
                    return;
                }

                button.disabled = false;
                button.textContent = button.dataset.originalText || "Set";
            });
        }

        function startAutoActionCooldown() {
            autoActionCooldownUntil = Date.now() + autoActionCooldownMs;

            if (autoActionCooldownTimer !== null) {
                clearInterval(autoActionCooldownTimer);
            }

            updateAutoActionButtons();

            autoActionCooldownTimer = setInterval(function () {
                updateAutoActionButtons();

                if (!isAutoActionCooldownActive()) {
                    clearInterval(autoActionCooldownTimer);
                    autoActionCooldownTimer = null;
                }
            }, 250);
        }

        function markSliderCommandSent() {
            startAutoActionCooldown();
        }

        function registerAutoActionButton(action, button) {
            if (!autoActionCooldownActions.has(action)) {
                return;
            }

            autoActionButtons[action] = button;
            button.dataset.originalText = button.dataset.originalText || button.textContent || "Set";
            updateAutoActionButtons();
        }

        function getSliderJumpSections() {
            const names = [];

            function add(name) {
                if (!name || names.includes(name)) {
                    return;
                }

                names.push(name);
            }

            if (typeof sliderGroups !== "undefined") {
                sliderGroups.forEach(function (group) {
                    add(group.name);
                });
            }

            if (typeof switchGroups !== "undefined") {
                switchGroups.forEach(function (group) {
                    add(group.name);
                });
            }

            return names;
        }

        function findSliderJumpHeading(content, name) {
            const candidates = Array.from(content.querySelectorAll(
                "h1, h2, h3, h4, .group-title, .section-title, .slider-group-title, .action-group-title, [class*='title'], [class*='Title']"
            ));

            return candidates.find(function (element) {
                return !element.closest(".slider-jump-control") &&
                    element.textContent.trim() === name;
            });
        }

        function installSliderJumpMenu() {
            const contentHost = document.getElementById("content");

            if (!contentHost) {
                return;
            }

            const existing = contentHost.querySelector(".slider-jump-control");

            if (!contentHost.querySelector(".drag-strip")) {
                if (existing) {
                    existing.remove();
                }

                return;
            }

            if (existing) {
                return;
            }

            const sections = getSliderJumpSections()
                .map(function (name, index) {
                    const heading = findSliderJumpHeading(contentHost, name);

                    if (!heading) {
                        return null;
                    }

                    const id = "slider-jump-section-" + index + "-" + name
                        .toLowerCase()
                        .replace(/[^a-z0-9]+/g, "-")
                        .replace(/^-|-$/g, "");

                    heading.id = id;
                    heading.classList.add("slider-jump-target");

                    return {
                        id: id,
                        name: name
                    };
                })
                .filter(Boolean);

            if (sections.length === 0) {
                return;
            }

            const control = document.createElement("div");
            control.className = "slider-jump-control";

            const label = document.createElement("span");
            label.className = "slider-jump-label";
            label.textContent = "Jump to:";

            const mainButton = document.createElement("button");
            mainButton.type = "button";
            mainButton.className = "slider-jump-main-button";
            mainButton.textContent = "Slider Group ▾";
            mainButton.setAttribute("aria-expanded", "false");

            const popover = document.createElement("div");
            popover.className = "slider-jump-popover";
            popover.hidden = true;

            function closeMenu() {
                popover.hidden = true;
                mainButton.classList.remove("active");
                mainButton.setAttribute("aria-expanded", "false");
            }

            function openMenu() {
                popover.hidden = false;
                mainButton.classList.add("active");
                mainButton.setAttribute("aria-expanded", "true");
            }

            mainButton.addEventListener("click", function () {
                if (popover.hidden) {
                    openMenu();
                } else {
                    closeMenu();
                }
            });

            sections.forEach(function (section) {
                const option = document.createElement("button");
                option.type = "button";
                option.className = "slider-jump-option";
                option.textContent = section.name;

                option.addEventListener("click", function () {
                    const target = document.getElementById(section.id);

                    mainButton.textContent = section.name + " ▾";
                    closeMenu();

                    if (target) {
                        target.scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                    }
                });

                popover.appendChild(option);
            });

            document.addEventListener("pointerdown", function (event) {
                if (!control.contains(event.target)) {
                    closeMenu();
                }
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") {
                    closeMenu();
                }
            });

            control.appendChild(label);
            control.appendChild(mainButton);
            control.appendChild(popover);

            contentHost.insertBefore(control, contentHost.firstChild);
        }

        function startSliderJumpMenuObserver() {
            const contentHost = document.getElementById("content");

            if (!contentHost || typeof MutationObserver === "undefined") {
                installSliderJumpMenu();
                return;
            }

            const observer = new MutationObserver(function () {
                window.requestAnimationFrame(installSliderJumpMenu);
            });

            observer.observe(contentHost, {
                childList: true
            });

            installSliderJumpMenu();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", startSliderJumpMenuObserver);
        } else {
            window.requestAnimationFrame(startSliderJumpMenuObserver);
        }

        const sliderFeedbackElements = {};


        const sliderFeedbackUiRequestIds = {};



        function sleep(ms) {


            return new Promise(function (resolve) {


                setTimeout(resolve, ms);


            });


        }



        function formatSliderFeedbackValue(value) {


            const numericValue = Number(value);



            if (Number.isFinite(numericValue)) {


                return String(Math.round(numericValue * 100) / 100);


            }



            if (value === null || value === undefined || value === "nil") {


                return "not available";


            }



            return String(value);


        }



        function formatAngleValue(value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) return "--°";
            return String(Math.round(numericValue * 100) / 100) + "°";
        }

        function setSliderFeedback(slider, text, className) {


            const element = sliderFeedbackElements[slider];



            if (!element) {


                return;


            }



            element.className = "slider-feedback" + (className ? " " + className : "");


            element.textContent = text;


        }



        async function pollFeedbackValue(slider, requestId, timeoutMs) {


            const startedAt = Date.now();



            while (Date.now() - startedAt < timeoutMs) {


                const response = await fetch("/api/feedback/value?slider=" + encodeURIComponent(slider), {


                    cache: "no-store"


                });



                const data = await response.json();


                const result = data && data.result ? data.result : null;



                if (result && result.id === requestId) {


                    return result;


                }



                await sleep(120);


            }



            return null;


        }



        async function requestSliderFeedback(slider) {


            if (!feedbackSupportedSliders.has(slider)) {


                return;


            }



            sliderFeedbackUiRequestIds[slider] = (sliderFeedbackUiRequestIds[slider] || 0) + 1;


            const uiRequestId = sliderFeedbackUiRequestIds[slider];



            setSliderFeedback(slider, "Lightroom: waiting...", "active");



            try {


                await sleep(300);



                if (sliderFeedbackUiRequestIds[slider] !== uiRequestId) {


                    return;


                }



                const requestResponse = await fetch("/api/feedback/request?slider=" + encodeURIComponent(slider), {


                    cache: "no-store"


                });



                const requestData = await requestResponse.json();


                const request = requestData && requestData.request ? requestData.request : null;



                if (!request || !request.id) {


                    setSliderFeedback(slider, "Lightroom: feedback request failed", "error");


                    return;


                }



                const result = await pollFeedbackValue(slider, request.id, 3000);



                if (sliderFeedbackUiRequestIds[slider] !== uiRequestId) {


                    return;


                }



                if (!result) {


                    setSliderFeedback(slider, "Lightroom: timeout", "error");


                    return;


                }



                setSliderFeedback(slider, "Lightroom: " + formatSliderFeedbackValue(result.value), "active");


            } catch (err) {


                setSliderFeedback(slider, "Lightroom: feedback error", "error");


            }


        }



        let liveFeedbackPollingStarted = false;
        let liveFeedbackSnapshotInFlight = false;

        async function updateSliderFeedbackFromCache() {
            try {
                const response = await fetch("/api/feedback/all", {
                    cache: "no-store"
                });

                const data = await response.json();
                const values = data && data.values ? data.values : {};

                Object.keys(sliderFeedbackElements).forEach(function (slider) {
                    const result = values[slider];

                    if (!result || result.value === null || result.value === undefined || result.value === "nil") {
                        return;
                    }

                    if (slider === "CropAngle") {
                        applyAuthoritativeAngleFeedback(result.value);
                    } else {
                        setSliderFeedback(slider, "Lightroom: " + formatSliderFeedbackValue(result.value), "active");
                    }
                });
            } catch (err) {
                /* Ignore temporary feedback polling errors. */
            }
        }

        function getVisibleFeedbackSliders() {
            const visibleSliders = [];
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
            const buffer = 160;

            Object.keys(sliderFeedbackElements).forEach(function (slider) {
                const element = sliderFeedbackElements[slider];

                if (!element || !element.getBoundingClientRect) {
                    return;
                }

                const rect = element.getBoundingClientRect();

                if (
                    rect.bottom >= -buffer &&
                    rect.top <= viewportHeight + buffer &&
                    rect.right >= -buffer &&
                    rect.left <= viewportWidth + buffer
                ) {
                    visibleSliders.push(slider);
                }
            });

            return visibleSliders;
        }

        async function requestLiveFeedbackSnapshot() {
            if (liveFeedbackSnapshotInFlight) {
                return;
            }

            const visibleSliders = getVisibleFeedbackSliders();

            if (visibleSliders.length === 0) {
                await updateSliderFeedbackFromCache();
                return;
            }

            liveFeedbackSnapshotInFlight = true;

            try {
                await fetch("/api/feedback/request-many?sliders=" + encodeURIComponent(visibleSliders.join(",")), {
                    cache: "no-store"
                });

                await sleep(80);

                await updateSliderFeedbackFromCache();
            } catch (err) {
                /* Ignore temporary feedback request errors. */
            } finally {
                liveFeedbackSnapshotInFlight = false;
            }
        }

        function startLiveFeedbackPolling() {
            if (liveFeedbackPollingStarted) {
                return;
            }

            liveFeedbackPollingStarted = true;

            requestLiveFeedbackSnapshot();

            setInterval(function () {
                requestLiveFeedbackSnapshot();
            }, 250);
        }

        function sendAdjust(slider, amount) {
            markSliderCommandSent();
            sendCommand("/api/adjust?slider=" + encodeURIComponent(slider) + "&amount=" + encodeURIComponent(amount));
            requestSliderFeedback(slider);
        }

        function makeDragStrip(slider) {
            const strip = document.createElement("div");
            strip.className = "drag-strip";
            strip.title = "Drag left or right to adjust " + (labels[slider] || slider);

            const label = document.createElement("div");
            label.className = "drag-strip-label";
            label.textContent = "Drag";

            strip.appendChild(label);

            const pixelsPerStep = 18;
            const flushDelayMs = 50;

            let active = false;
            let pointerId = null;
            let lastX = 0;
            let remainder = 0;
            let pendingAmount = 0;
            let flushTimer = null;

            function flushPending() {
                if (flushTimer !== null) {
                    clearTimeout(flushTimer);
                    flushTimer = null;
                }

                const amount = pendingAmount;
                pendingAmount = 0;

                if (amount !== 0) {
                    sendAdjust(slider, amount);
                }
            }

            function scheduleFlush() {
                if (flushTimer !== null) {
                    return;
                }

                flushTimer = setTimeout(function () {
                    flushTimer = null;

                    const amount = pendingAmount;
                    pendingAmount = 0;

                    if (amount !== 0) {
                        sendAdjust(slider, amount);
                    }
                }, flushDelayMs);
            }

            function queueSteps(steps) {
                if (steps === 0) {
                    return;
                }

                pendingAmount += steps;
                label.textContent = steps > 0 ? "+" + steps : String(steps);
                strip.classList.add("active");
                scheduleFlush();
            }

            function stopDragging(event) {
                if (!active) {
                    return;
                }

                if (event && pointerId !== null && event.pointerId !== pointerId) {
                    return;
                }

                flushPending();

                active = false;

                if (pointerId !== null && strip.releasePointerCapture) {
                    try {
                        strip.releasePointerCapture(pointerId);
                    } catch (err) {
                        /* Pointer may already be released. */
                    }
                }

                pointerId = null;
                remainder = 0;
                label.textContent = "Drag";
                strip.classList.remove("active");
            }

            strip.addEventListener("pointerdown", function (event) {
                active = true;
                pointerId = event.pointerId;
                lastX = event.clientX;
                remainder = 0;
                pendingAmount = 0;
                label.textContent = "Drag";
                strip.classList.add("active");

                if (strip.setPointerCapture) {
                    strip.setPointerCapture(pointerId);
                }

                event.preventDefault();
            });

            strip.addEventListener("pointermove", function (event) {
                if (!active || event.pointerId !== pointerId) {
                    return;
                }

                const dx = event.clientX - lastX;
                lastX = event.clientX;
                remainder += dx;

                const steps = Math.trunc(remainder / pixelsPerStep);

                if (steps !== 0) {
                    remainder -= steps * pixelsPerStep;
                    queueSteps(steps);
                }

                event.preventDefault();
            });

            strip.addEventListener("pointerup", stopDragging);
            strip.addEventListener("pointercancel", stopDragging);
            strip.addEventListener("lostpointercapture", stopDragging);

            return strip;
        }

        function clearContent() {
            content.innerHTML = "";
        }

        function renderTabs() {
            tabsElement.innerHTML = "";

            const allTabs = [
                {
                    id: "sliders",
                    label: "Sliders"
                },
                {
                    id: "selection",
                    label: "Selection"
                },
                {
                    id: "crop",
                    label: "Crop"
                },
                {
                    id: "application",
                    label: "Application"
                }
            ].concat(toolTabs.map(function (tab) {
                return {
                    id: tab.id,
                    label: tab.label
                };
            }));

            for (const tab of allTabs) {
                const button = document.createElement("button");
                button.textContent = tab.label;
                button.className = "tab-button" + (tab.id === activeTab ? " active" : "");

                button.addEventListener("click", function () {
                    activeTab = tab.id;
                    render();
});

                tabsElement.appendChild(button);
            }
        }

        function commandPath(item) {
            const parameters = [
                ["command", item.command],
                [item.field, item.value]
            ];

            for (const entry of Object.entries(item.params || {})) {
                parameters.push(entry);
            }

            return "/api/command?" + parameters.map(function (entry) {
                return encodeURIComponent(entry[0]) + "=" + encodeURIComponent(String(entry[1]));
            }).join("&");
        }

        let angleRange = null;
        let angleNumber = null;
        let angleValueLabel = null;
        let angleDragging = false;
        let angleRequestInFlight = false;
        let pendingAngleValue = null;
        let lastSubmittedAngleValue = null;
        let angleThrottleTimer = null;
        let numericAngleCommittedValue = null;

        function parseAngleValue(value) {
            if (typeof value !== "string" || !/^-?\d+(?:\.\d{1,2})?$/.test(value)) return null;
            const number = Number(value);
            return Number.isFinite(number) && number >= -45 && number <= 45 ? number : null;
        }

        function angleCommandPath(value) {
            return "/api/command?command=photo.crop_angle.set&value=" + encodeURIComponent(String(value));
        }

        function showLocalAngle(value) {
            if (angleRange) angleRange.value = String(value);
            if (angleNumber) angleNumber.value = String(value);
            if (angleValueLabel) angleValueLabel.textContent = formatAngleValue(value);
        }

        function applyAuthoritativeAngleFeedback(value) {
            const numericValue = Number(value);
            if (angleDragging || !Number.isFinite(numericValue) || numericValue < -45 || numericValue > 45) return;
            showLocalAngle(Math.round(numericValue * 100) / 100);
            numericAngleCommittedValue = Number(angleNumber.value);
        }

        async function submitAngleValue(value) {
            if (value === lastSubmittedAngleValue && !angleRequestInFlight) return;

            if (angleRequestInFlight) {
                pendingAngleValue = value;
                return;
            }

            angleRequestInFlight = true;
            lastSubmittedAngleValue = value;
            await sendCommand(angleCommandPath(value));
            angleRequestInFlight = false;

            if (pendingAngleValue !== null) {
                const nextValue = pendingAngleValue;
                pendingAngleValue = null;
                if (nextValue !== lastSubmittedAngleValue) submitAngleValue(nextValue);
            }
        }

        function scheduleAngleValue(value) {
            pendingAngleValue = value;
            if (angleThrottleTimer !== null) return;

            angleThrottleTimer = setTimeout(function () {
                angleThrottleTimer = null;
                const nextValue = pendingAngleValue;
                pendingAngleValue = null;
                if (nextValue !== null) submitAngleValue(nextValue);
            }, 100);
        }

        function flushAngleValue(value) {
            if (angleThrottleTimer !== null) {
                clearTimeout(angleThrottleTimer);
                angleThrottleTimer = null;
            }
            pendingAngleValue = null;
            submitAngleValue(value);
        }

        function renderAngleControls(groupElement) {
            const row = document.createElement("div");
            row.className = "angle-control";

            angleRange = document.createElement("input");
            angleRange.type = "range";
            angleRange.min = "-45";
            angleRange.max = "45";
            angleRange.step = "0.1";
            angleRange.value = "0";
            angleRange.setAttribute("aria-label", "Crop Angle");

            angleNumber = document.createElement("input");
            angleNumber.type = "number";
            angleNumber.min = "-45";
            angleNumber.max = "45";
            angleNumber.step = "0.01";
            angleNumber.value = "0";
            angleNumber.setAttribute("aria-label", "Crop Angle numeric value");

            angleValueLabel = document.createElement("span");
            angleValueLabel.className = "angle-value";
            angleValueLabel.textContent = "0°";

            const resetButton = makeButton("Reset Angle", "command-neutral", function () {
                sendCommand("/api/command?command=photo.crop_angle.reset");
            });

            angleRange.addEventListener("pointerdown", function () {
                angleDragging = true;
            });
            angleRange.addEventListener("input", function () {
                const value = Number(angleRange.value);
                showLocalAngle(value);
                scheduleAngleValue(value);
            });
            angleRange.addEventListener("pointerup", function () {
                angleDragging = false;
                flushAngleValue(Number(angleRange.value));
            });
            angleRange.addEventListener("change", function () {
                angleDragging = false;
                flushAngleValue(Number(angleRange.value));
            });

            function commitNumericAngle() {
                const value = parseAngleValue(angleNumber.value);
                if (value === null) {
                    setStatus("ERROR: Crop Angle must be between -45 and 45 with at most two decimal places.");
                    return;
                }
                if (value !== numericAngleCommittedValue) {
                    showLocalAngle(value);
                    numericAngleCommittedValue = value;
                    flushAngleValue(value);
                }
            }

            angleNumber.addEventListener("keydown", function (event) {
                if (event.key === "Enter") commitNumericAngle();
            });
            angleNumber.addEventListener("blur", commitNumericAngle);

            row.appendChild(angleRange);
            row.appendChild(angleNumber);
            row.appendChild(angleValueLabel);
            row.appendChild(resetButton);
            groupElement.appendChild(row);
            sliderFeedbackElements.CropAngle = angleValueLabel;
            numericAngleCommittedValue = 0;
        }

        function renderCommandGroups(groups) {
            for (const group of groups) {
                const groupElement = document.createElement("section");
                groupElement.className = "group";

                const title = document.createElement("div");
                title.className = "group-title";
                title.textContent = group.name;
                groupElement.appendChild(title);

                if (group.note) {
                    const note = document.createElement("div");
                    note.className = "command-group-note";
                    note.textContent = group.note;
                    groupElement.appendChild(note);
                }

                const grid = document.createElement("div");
                grid.className = "command-grid";

                if (group.angleControl) {
                    renderAngleControls(groupElement);
                    content.appendChild(groupElement);
                    continue;
                }

                for (const item of group.commands) {
                    grid.appendChild(makeButton(item.label, item.className || "command-primary", function () {
                        if (item.customCrop) {
                            openCustomCropModal();
                        } else {
                            sendCommand(commandPath(item));
                        }
                    }));
                }

                groupElement.appendChild(grid);
                content.appendChild(groupElement);
            }
        }

        function addActionRow(groupElement, item) {
            const row = document.createElement("div");
            row.className = "action-row";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = item.label;

            const status = document.createElement("div");
            status.className = "switch-status";

            row.appendChild(name);

            const actionButton = makeButton(item.button || "Send", item.className || "positive", function () {
                if (isAutoActionCooldownActiveFor(item.action)) {
                    setStatus("Auto Tone / Auto White Balance is waiting for Lightroom to finish the last slider command.");
                    return;
                }

                sendCommand("/api/action?action=" + encodeURIComponent(item.action));
                status.textContent = "Sent to Lightroom";
            });
            registerAutoActionButton(item.action, actionButton);

            row.appendChild(actionButton);
            row.appendChild(status);

            groupElement.appendChild(row);
        }

        function addSwitchRow(groupElement, item) {
            const row = document.createElement("div");
            row.className = "switch-row";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = item.label;

            const status = document.createElement("div");
            status.className = "switch-status";

            row.appendChild(name);

            row.appendChild(makeButton("Off", "negative", function () {
                markSliderCommandSent();
                sendCommand("/api/adjust?slider=" + encodeURIComponent(item.slider) + "&amount=-5");
                status.textContent = "Sent OFF";
            }));

            row.appendChild(makeButton("On", "positive", function () {
                markSliderCommandSent();
                sendCommand("/api/adjust?slider=" + encodeURIComponent(item.slider) + "&amount=5");
                status.textContent = "Sent ON";
            }));

            row.appendChild(status);

            groupElement.appendChild(row);
        }

        function addSliderRow(groupElement, slider) {
            const row = document.createElement("div");
            row.className = "row";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = labels[slider] || slider;

            
            if (feedbackSupportedSliders.has(slider)) {
                const feedback = document.createElement("span");
                feedback.className = "slider-feedback";
                feedback.textContent = "Lightroom: --";
                name.appendChild(feedback);
                sliderFeedbackElements[slider] = feedback;
            }
row.appendChild(name);

            row.appendChild(makeButton("-5", "negative", function () {
                sendAdjust(slider, -5);
            }));

            row.appendChild(makeButton("-1", "negative", function () {
                sendAdjust(slider, -1);
            }));

            row.appendChild(makeButton("Reset", "reset", function () {
                markSliderCommandSent();
                sendCommand("/api/reset?slider=" + encodeURIComponent(slider));
                            requestSliderFeedback(slider);
            }));

            row.appendChild(makeButton("+1", "positive", function () {
                sendAdjust(slider, 1);
            }));

            row.appendChild(makeButton("+5", "positive", function () {
                sendAdjust(slider, 5);
            }));

            row.appendChild(makeDragStrip(slider));

            groupElement.appendChild(row);
        }

        function renderActionGroup(group) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = group.name;

            groupElement.appendChild(title);

            for (const item of group.actions) {
                addActionRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function renderSwitchGroup(group) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = "Switches - " + group.name;

            groupElement.appendChild(title);

            for (const item of group.switches) {
                addSwitchRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function renderActionsForPlacement(placement) {
            for (const group of sliderActionGroups) {
                if ((group.placement || "top") === placement) {
                    renderActionGroup(group);
                }
            }
        }

        function renderSwitchesForPlacement(placement) {
            for (const group of switchGroups) {
                if ((group.placement || "top") === placement) {
                    renderSwitchGroup(group);
                }
            }
        }

        function renderSlidersTab() {
            renderActionsForPlacement("top");

            for (const group of sliderGroups) {
                renderActionsForPlacement("before:" + group.name);
                renderSwitchesForPlacement("before:" + group.name);

                const groupElement = document.createElement("section");
                groupElement.className = "group";

                const title = document.createElement("div");
                title.className = "group-title";
                title.textContent = group.name;

                groupElement.appendChild(title);

                for (const slider of group.sliders) {
                    addSliderRow(groupElement, slider);
                }

                content.appendChild(groupElement);
            }
        }

        function renderToolTab(tab) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = tab.title;

            groupElement.appendChild(title);

            for (const item of tab.actions) {
                addActionRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function render() {
            renderTabs();
            clearContent();

            if (activeTab === "sliders") {
                renderSlidersTab();
                return;
            }

            if (activeTab === "selection") {
                renderCommandGroups(selectionGroups);
                return;
            }

            if (activeTab === "crop") {
                renderCommandGroups(cropGroups);
                return;
            }

            if (activeTab === "application") {
                renderCommandGroups(applicationGroups);
                return;
            }

            const tab = toolTabs.find(function (item) {
                return item.id === activeTab;
            });

            if (tab) {
                renderToolTab(tab);
            }
        }

        render();
        startLiveFeedbackPolling();
    </script>
