        async function submitDevelopCategorical(control, value, path) {
            if (!developCategoricalModel || developCategoricalSubmitting.has(control) || developCategoricalModel.getPending(control)) return false;
            delete developCategoricalErrors[control];
            developCategoricalSubmitting.add(control);
            updateDevelopCategoricalControls();
            setStatus("Sending: " + path);
            try {
                const response = await fetch(path, { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data || data.ok !== true || !Number.isSafeInteger(data.confirmationAfterRevision)) {
                    throw new Error(data && data.error ? data.error : "Lightroom rejected the categorical change");
                }
                const confirmationAfterRevision = Math.max(data.confirmationAfterRevision, developCategoricalModel.getRevision());
                if (!developCategoricalModel.begin(control, value, confirmationAfterRevision)) {
                    throw new Error("Could not start authoritative confirmation");
                }
                markSliderCommandSent();
                clearDevelopCategoricalPendingTimer(control);
                developCategoricalPendingTimers[control] = setTimeout(function () {
                    if (!developCategoricalModel.getPending(control)) return;
                    developCategoricalModel.cancel(control);
                    delete developCategoricalPendingTimers[control];
                    developCategoricalErrors[control] = "Lightroom did not confirm the requested change.";
                    updateDevelopCategoricalControls();
                    requestDevelopCategoricalState();
                }, 10000);
                setStatus("OK: categorical change queued; awaiting authoritative confirmation");
                requestDevelopCategoricalState();
                return true;
            } catch (error) {
                developCategoricalErrors[control] = error.message || "Categorical control unavailable";
                setStatus("ERROR: " + developCategoricalErrors[control]);
                return false;
            } finally {
                developCategoricalSubmitting.delete(control);
                updateDevelopCategoricalControls();
            }
        }

        async function requestDevelopCategoricalState() {
            if (!developCategoricalModel || activeTab !== "sliders" || developCategoricalRequestInFlight) return;
            developCategoricalRequestInFlight = true;
            try {
                const response = await fetch("/api/develop-categorical/state", { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data || !data.state || !Number.isSafeInteger(data.revision)) {
                    throw new Error("Develop categorical state unavailable");
                }
                if (activeTab !== "sliders") return;
                if (data.capabilities && data.capabilities.transformUpdate) {
                    developCategoricalCapabilities = data.capabilities;
                }
                const applied = developCategoricalModel.apply(data.state, data.revision);
                applied.confirmed.forEach(function (control) {
                    clearDevelopCategoricalPendingTimer(control);
                    delete developCategoricalErrors[control];
                });
            } catch (error) {
                /* Keep the last authoritative presentation; context polling will retry. */
            } finally {
                developCategoricalRequestInFlight = false;
                updateDevelopCategoricalControls();
            }
        }

        async function setLensBlurApply(enabled) {
            if (!lensBlurHelper || typeof enabled !== "boolean") return false;
            const accepted = await sendCommand("/api/lens-blur/apply?enabled=" + String(enabled));
            if (accepted) {
                const current = lensBlurModel.get();
                lensBlurModel.applyAuthoritative(Object.assign({}, current, { activeAvailable: false, active: null }));
                updateLensBlurPresentation();
                requestLensBlurState();
            }
            return accepted;
        }

        async function requestLensBlurState() {
            if (!lensBlurHelper || activeTab !== "sliders" || lensBlurStateRequestInFlight) return;
            lensBlurStateRequestInFlight = true;
            try {
                const response = await fetch("/api/lens-blur/state", { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data || !data.state) throw new Error("Lens Blur state unavailable");
                if (activeTab !== "sliders") return;
                if (Number.isSafeInteger(data.revision)) lensBlurStateRevision = data.revision;
                lensBlurFocalRangeCommitId = typeof data.focalRangeCommitId === "string" ? data.focalRangeCommitId : null;
                lensBlurModel.applyAuthoritative(data.state);
            } catch (err) {
                lensBlurModel.applyAuthoritative(null);
            } finally {
                lensBlurStateRequestInFlight = false;
                updateLensBlurPresentation();
            }
        }

        async function setLensBlurBokeh(value) {
            if (!lensBlurHelper) return false;
            const current = lensBlurModel.get();
            if (!current.bokehAvailable) return false;
            const accepted = await sendCommand("/api/lens-blur/bokeh?value=" + encodeURIComponent(value));
            if (accepted) {
                lensBlurModel.applyAuthoritative(Object.assign({}, current, { bokehAvailable: false, bokeh: null }));
                updateLensBlurPresentation();
                requestLensBlurState();
            }
            return accepted;
        }

        function appendLensBlurSubheading(parent, text) {
            const heading = document.createElement("div");
            heading.className = "section-title lens-blur-subsection";
            heading.textContent = text;
            parent.appendChild(heading);
            return heading;
        }

        async function sendLensBlurNativeRequest(path) {
            setStatus("Sending: " + path);
            try {
                const response = await fetch(path, { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data || data.ok !== true || !data.windowsNative) {
                    setStatus("ERROR " + response.status + ": " + (data && data.error ? data.error : "Native control unavailable"));
                    requestLensBlurState();
                    return false;
                }
                lensBlurModel.applyWindowsNative(data.windowsNative);
                updateLensBlurPresentation();
                setStatus("OK: Lightroom native state verified");
                return true;
            } catch (err) {
                setStatus("ERROR: " + err.message);
                requestLensBlurState();
                return false;
            }
        }

        async function setLensBlurRefinementMode(mode) {
            if ((mode !== "focus" && mode !== "blur") || lensBlurModeRequestInFlight) return false;
            const current = lensBlurModel.get();
            const native = current && current.windowsNative;
            if (!native || native.refinementModeTargetsAvailable !== true) return false;
            if (native.refinementMode === mode) return true;
            lensBlurModeRequestInFlight = true;
            updateLensBlurPresentation();
            try {
                return await sendLensBlurNativeRequest(
                    "/api/lens-blur/refinement-mode?value=" + encodeURIComponent(mode)
                );
            } finally {
                lensBlurModeRequestInFlight = false;
                updateLensBlurPresentation();
            }
        }

        async function setLensBlurRefinementDisclosure(open) {
            if (typeof open !== "boolean" || lensBlurDisclosureRequestInFlight) return false;
            const current = lensBlurModel.get();
            const native = current && current.windowsNative;
            const disclosure = native && native.refinementDisclosure;
            if (!disclosure || disclosure.available !== true || typeof disclosure.value !== "boolean") return false;
            if (disclosure.value === open) return true;
            lensBlurDisclosurePendingOpen = open;
            lensBlurDisclosureRequestInFlight = true;
            updateLensBlurPresentation();
            try {
                return await sendLensBlurNativeRequest(
                    "/api/lens-blur/refinement-disclosure?open=" + String(open)
                );
            } finally {
                lensBlurDisclosureRequestInFlight = false;
                lensBlurDisclosurePendingOpen = null;
                updateLensBlurPresentation();
            }
        }

        async function resetLensBlurRefinement() {
            if (lensBlurRefinementResetRequestInFlight) return false;
            const current = lensBlurModel.get();
            const reset = current && current.windowsNative && current.windowsNative.refinementReset;
            if (!reset || reset.available !== true || reset.enabled !== true) return false;
            if (!window.confirm("Remove all painted Lens Blur refinements from this photo?")) return false;
            lensBlurRefinementResetRequestInFlight = true;
            updateLensBlurPresentation();
            try {
                return await sendLensBlurNativeRequest("/api/lens-blur/refinement-reset?confirmed=true");
            } finally {
                lensBlurRefinementResetRequestInFlight = false;
                updateLensBlurPresentation();
            }
        }

        function nativeBrushPath(control, operation, field, value, interaction, final) {
            let path = "/api/lens-blur/brush/" + encodeURIComponent(control) + "/" + operation + "?" + field + "=" +
                encodeURIComponent(String(value));
            if (typeof interaction === "string" && interaction !== "") {
                path += "&interaction=" + encodeURIComponent(interaction) + "&final=" + String(final === true);
            }
            return path;
        }

        function resolveLensBlurNativeWaiters(waiters, accepted) {
            (waiters || []).forEach(function (resolve) { resolve(accepted); });
        }

        async function executeLensBlurNativeValue(control, target, forceWrite, waiters) {
            control.requestInFlight = true;
            const interaction = control.interactionId;
            const final = interaction !== null && forceWrite === true;
            const accepted = await sendLensBlurNativeRequest(nativeBrushPath(
                control.name, "set", "value", target, interaction, final
            ));
            control.requestInFlight = false;
            resolveLensBlurNativeWaiters(waiters, accepted);

            if (!accepted) {
                if (control.stepTimer !== null) {
                    clearTimeout(control.stepTimer);
                    control.stepTimer = null;
                }
                resolveLensBlurNativeWaiters(control.queuedWaiters, false);
                control.queuedValue = null;
                control.queuedForce = false;
                control.queuedWaiters = [];
                control.desiredValue = null;
                control.interactionId = null;
                control.interactionKind = null;
                if (control.authoritativeValue !== null) showLensBlurNativeLocal(control, control.authoritativeValue);
                setLensBlurNativeSliderError(control, "Lightroom rejected the value");
                updateLensBlurPresentation();
                pumpLensBlurNativeStep(control);
                return;
            }

            const queuedValue = control.queuedValue;
            const queuedForce = control.queuedForce;
            const queuedWaiters = control.queuedWaiters;
            control.queuedValue = null;
            control.queuedForce = false;
            control.queuedWaiters = [];
            if (queuedValue !== null && (queuedForce || !lensBlurNativeValuesMatch(control, queuedValue, control.authoritativeValue))) {
                executeLensBlurNativeValue(control, queuedValue, queuedForce, queuedWaiters);
                return;
            }
            resolveLensBlurNativeWaiters(queuedWaiters, true);
            if (final && control.interactionId === interaction) {
                control.interactionId = null;
                control.interactionKind = null;
            }
            if (!control.dragging && control.interactionKind !== "step" && control.desiredValue !== null &&
                lensBlurNativeValuesMatch(control, control.desiredValue, control.authoritativeValue)) {
                control.desiredValue = null;
            }
            updateLensBlurPresentation();
            pumpLensBlurNativeStep(control);
        }

        function submitLensBlurNativeValue(control, value, forceWrite) {
            const target = normalizeLensBlurNativeValue(control, value);
            if (target === null) return Promise.resolve(false);
            setLensBlurNativeSliderError(control, null);
            control.desiredValue = target;
            showLensBlurNativeLocal(control, target);
            return new Promise(function (resolve) {
                if (control.requestInFlight) {
                    control.queuedValue = target;
                    control.queuedForce = control.queuedForce || forceWrite === true;
                    control.queuedWaiters.push(resolve);
                    return;
                }
                if (forceWrite !== true && lensBlurNativeValuesMatch(control, target, control.authoritativeValue)) {
                    if (control.interactionKind !== "step") control.desiredValue = null;
                    resolve(true);
                    updateLensBlurPresentation();
                    return;
                }
                executeLensBlurNativeValue(control, target, forceWrite === true, [resolve]);
            });
        }

        function scheduleLensBlurNativeValue(control) {
            if (control.throttleTimer !== null) return;
            control.throttleTimer = setTimeout(function () {
                control.throttleTimer = null;
                if (control.desiredValue !== null) submitLensBlurNativeValue(control, control.desiredValue, false);
            }, 100);
        }

        function finishLensBlurNativeRange(control, event, submitFinal) {
            if (!control.dragging) return;
            control.dragging = false;
            control.pointerActive = false;
            if (event && control.range.hasPointerCapture && control.range.hasPointerCapture(event.pointerId)) {
                control.range.releasePointerCapture(event.pointerId);
            }
            if (control.throttleTimer !== null) {
                clearTimeout(control.throttleTimer);
                control.throttleTimer = null;
            }
            if (submitFinal && control.desiredValue !== null) {
                submitLensBlurNativeValue(control, control.desiredValue, true);
            } else if (!control.requestInFlight) {
                control.desiredValue = null;
                control.interactionId = null;
                control.interactionKind = null;
                updateLensBlurPresentation();
            }
        }

        async function pumpLensBlurNativeStep(control) {
            if (!control || control.requestInFlight) return;
            const request = control.stepInteraction.takeNextRequest();
            if (!request) {
                const settled = control.stepInteraction.get();
                if (!settled.active && control.interactionKind === "step") {
                    control.desiredValue = null;
                    control.interactionId = null;
                    control.interactionKind = null;
                    if (Number.isFinite(settled.authoritative)) showLensBlurNativeLocal(control, settled.authoritative);
                    updateLensBlurPresentation();
                }
                return;
            }
            control.requestInFlight = true;
            const accepted = await sendLensBlurNativeRequest(nativeBrushPath(
                control.name, "set", "value", request.target, control.interactionId, request.final
            ));
            control.requestInFlight = false;
            const outcome = control.stepInteraction.completeRequest(request, accepted, control.authoritativeValue);
            if (!outcome.accepted) {
                if (control.stepTimer !== null) {
                    clearTimeout(control.stepTimer);
                    control.stepTimer = null;
                }
                control.desiredValue = null;
                control.interactionId = null;
                control.interactionKind = null;
                if (Number.isFinite(outcome.rollback)) showLensBlurNativeLocal(control, outcome.rollback);
                setLensBlurNativeSliderError(control, "Lightroom rejected the value");
                updateLensBlurPresentation();
                return;
            }
            if (outcome.state.active) {
                control.desiredValue = outcome.state.pendingTarget;
                showLensBlurNativeLocal(control, outcome.state.pendingTarget);
            } else {
                control.desiredValue = null;
                control.interactionId = null;
                control.interactionKind = null;
                if (Number.isFinite(outcome.state.authoritative)) showLensBlurNativeLocal(control, outcome.state.authoritative);
            }
            updateLensBlurPresentation();
            pumpLensBlurNativeStep(control);
        }

        function stepLensBlurNativeValue(control, direction) {
            if (!control.available) return;
            const currentState = control.stepInteraction.get();
            const displayed = currentState.active
                ? currentState.pendingTarget
                : (Number.isFinite(control.localValue) ? control.localValue : control.authoritativeValue);
            const result = control.stepInteraction.click(direction, displayed, control.minimum, control.maximum);
            if (!result.accepted) return;
            if (control.interactionKind !== "step" || control.interactionId === null) {
                control.interactionId = "step-" + Date.now().toString(36) + "-" + (++lensBlurNativeInteractionCounter).toString(36);
                control.interactionKind = "step";
            }
            control.desiredValue = result.target;
            setLensBlurNativeSliderError(control, null);
            showLensBlurNativeLocal(control, result.target);
            if (control.stepTimer !== null) clearTimeout(control.stepTimer);
            control.stepTimer = setTimeout(function () {
                control.stepTimer = null;
                control.stepInteraction.markIdle();
                pumpLensBlurNativeStep(control);
            }, 120);
            pumpLensBlurNativeStep(control);
        }

        async function resetLensBlurNativeValue(control) {
            if (!control.available || control.resetInFlight || control.requestInFlight || control.dragging ||
                control.stepInteraction.get().active ||
                control.desiredValue !== null || control.queuedValue !== null) return false;
            control.resetInFlight = true;
            setLensBlurNativeSliderError(control, null);
            updateLensBlurPresentation();
            const accepted = await sendLensBlurNativeRequest(
                "/api/lens-blur/brush/" + encodeURIComponent(control.name) + "/reset"
            );
            control.resetInFlight = false;
            if (!accepted) setLensBlurNativeSliderError(control, "Lightroom rejected the reset");
            updateLensBlurPresentation();
            return accepted;
        }

        async function commitLensBlurNativeEditor(control) {
            const prepared = control.editor.prepareCommit(control.number.value);
            if (!prepared.ok) {
                control.editor.rejectSubmission(prepared.error);
                updateLensBlurPresentation();
                return false;
            }
            if (!prepared.submit) {
                updateLensBlurPresentation();
                return true;
            }
            syncLensBlurNumberEditor(control.number, prepared.state);
            showLensBlurNativeLocal(control, prepared.value);
            const accepted = await submitLensBlurNativeValue(control, prepared.value, false);
            if (accepted) control.editor.acceptSubmission();
            else control.editor.rejectSubmission("Lightroom rejected the value");
            updateLensBlurPresentation();
            return accepted;
        }

        function createLensBlurNativeSlider(name, label, step, precision) {
            const row = document.createElement("div");
            row.className = "develop-slider-row lens-blur-native-row unavailable touch-group-gap";
            const title = document.createElement("div");
            title.className = "slider-name";
            title.textContent = label;
            const range = document.createElement("input");
            range.type = "range";
            range.step = String(step);
            range.setAttribute("aria-label", "Brush Refinement " + label);
            const number = document.createElement("input");
            number.type = "text";
            number.inputMode = "decimal";
            number.autocomplete = "off";
            number.spellcheck = false;
            number.className = "lens-blur-number-editor";
            number.setAttribute("aria-label", "Brush Refinement " + label + " value");
            const control = {
                row: row,
                name: name,
                range: range,
                number: number,
                decrement: null,
                increment: null,
                reset: null,
                status: null,
                step: step,
                precision: precision,
                editor: lensBlurHelper.createNumericEditor({ precision: precision }),
                available: false,
                minimum: null,
                maximum: null,
                authoritativeValue: null,
                localValue: null,
                desiredValue: null,
                dragging: false,
                pointerActive: false,
                ignoreNextChange: false,
                requestInFlight: false,
                queuedValue: null,
                queuedForce: false,
                queuedWaiters: [],
                interactionId: null,
                interactionKind: null,
                throttleTimer: null,
                stepTimer: null,
                stepInteraction: lensBlurHelper.createStepInteraction({ step: step, precision: precision }),
                resetInFlight: false,
                error: null
            };
            const decrement = makeButton("−", "develop-slider-step", function () { stepLensBlurNativeValue(control, -1); });
            const increment = makeButton("+", "develop-slider-step", function () { stepLensBlurNativeValue(control, 1); });
            const reset = makeButton("Reset", "reset", function () { resetLensBlurNativeValue(control); });
            decrement.setAttribute("aria-label", "Decrease Brush Refinement " + label);
            increment.setAttribute("aria-label", "Increase Brush Refinement " + label);
            reset.setAttribute("aria-label", "Reset Brush Refinement " + label + " in Lightroom");
            const status = document.createElement("div");
            status.className = "develop-slider-state lens-blur-native-status";
            status.textContent = "Unavailable";
            control.decrement = decrement;
            control.increment = increment;
            control.reset = reset;
            control.status = status;
            range.addEventListener("pointerdown", function (event) {
                control.dragging = true;
                control.pointerActive = true;
                control.interactionId = "drag-" + Date.now().toString(36) + "-" + (++lensBlurNativeInteractionCounter).toString(36);
                control.interactionKind = "drag";
                setLensBlurNativeSliderError(control, null);
                if (range.setPointerCapture) range.setPointerCapture(event.pointerId);
            });
            range.addEventListener("input", function () {
                if (!control.dragging) control.dragging = true;
                control.desiredValue = normalizeLensBlurNativeValue(control, range.value);
                showLensBlurNativeLocal(control, control.desiredValue);
                scheduleLensBlurNativeValue(control);
            });
            range.addEventListener("pointerup", function (event) {
                control.ignoreNextChange = true;
                finishLensBlurNativeRange(control, event, true);
            });
            range.addEventListener("pointercancel", function (event) {
                control.ignoreNextChange = true;
                finishLensBlurNativeRange(control, event, false);
            });
            range.addEventListener("lostpointercapture", function (event) {
                finishLensBlurNativeRange(control, event, false);
            });
            range.addEventListener("change", function () {
                if (control.ignoreNextChange) {
                    control.ignoreNextChange = false;
                    return;
                }
                if (!control.pointerActive) finishLensBlurNativeRange(control, null, true);
            });
            number.addEventListener("focus", function () { control.editor.begin(number.value); });
            number.addEventListener("input", function () {
                const editorState = control.editor.change(number.value);
                syncLensBlurNumberEditor(number, editorState);
            });
            number.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    commitLensBlurNativeEditor(control);
                    number.blur();
                } else if (event.key === "Escape") {
                    event.preventDefault();
                    syncLensBlurNumberEditor(number, control.editor.cancel());
                    number.blur();
                    updateLensBlurPresentation();
                }
            });
            number.addEventListener("blur", function () {
                if (control.editor.get().editing) commitLensBlurNativeEditor(control);
            });
            [range, number, decrement, increment, reset].forEach(function (element) { element.disabled = true; });
            row.appendChild(title);
            row.appendChild(range);
            row.appendChild(number);
            row.appendChild(decrement);
            row.appendChild(increment);
            row.appendChild(reset);
            row.appendChild(status);
            return control;
        }

        function createLensBlurExplicitSwitch(label, setter) {
            const row = document.createElement("div");
            row.className = "switch-row lens-blur-apply-row";
            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = label;
            const off = makeButton("Off", "negative", function () { setter(false); });
            const on = makeButton("On", "positive", function () { setter(true); });
            const status = document.createElement("div");
            status.className = "switch-status";
            status.setAttribute("role", "status");
            off.disabled = true;
            on.disabled = true;
            row.appendChild(name);
            row.appendChild(off);
            row.appendChild(on);
            row.appendChild(status);
            return { row: row, off: off, on: on, status: status };
        }

        function clearLensBlurFocalCommitTimer(view) {
            if (!view) return;
            if (view.pendingTimer !== null) clearTimeout(view.pendingTimer);
            view.pendingTimer = null;
            view.pendingCommitId = null;
        }

        function clearLensBlurFocusActionPending(view) {
            if (!view || !view.actionPending) return;
            if (view.actionPending.timer !== null) clearTimeout(view.actionPending.timer);
            view.actionPending = null;
        }

        function clearLensBlurFocusActionFeedback(view) {
            if (!view) return;
            if (view.actionFeedbackTimer !== null) clearTimeout(view.actionFeedbackTimer);
            view.actionFeedbackTimer = null;
            view.actionFeedback = null;
        }

        function showLensBlurFocusActionFeedback(view, message, error) {
            clearLensBlurFocusActionFeedback(view);
            view.actionFeedback = { message: message, error: error === true };
            view.actionFeedbackTimer = setTimeout(function () {
                view.actionFeedbackTimer = null;
                view.actionFeedback = null;
                updateLensBlurPresentation();
            }, 2500);
        }

        async function submitLensBlurFocalRange(range, expected) {
            const view = lensBlurFocusRangeView;
            const normalized = lensBlurHelper.normalizeFocalRange(range);
            const expectedValue = lensBlurHelper.formatFocalRange(expected);
            if (!view || normalized === null || expectedValue === null) return false;
            const query = lensBlurHelper.focalComponents.map(function (component) {
                return component + "=" + encodeURIComponent(String(normalized[component]));
            });
            query.push("expected=" + encodeURIComponent(expectedValue));
            try {
                const response = await fetch("/api/lens-blur/focal-range/set?" + query.join("&"), { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data || data.ok !== true || typeof data.focalRangeCommitId !== "string") {
                    throw new Error(data && data.error ? data.error : "Lightroom rejected the Focus Range");
                }
                view.pendingCommitId = data.focalRangeCommitId;
                view.pendingTimer = setTimeout(function () {
                    if (!view.transaction.get().pending) return;
                    view.transaction.reject("Focus Range confirmation timed out", view.transaction.get().authoritative);
                    lensBlurSubjectPresentation.rollbackManualEdit();
                    clearLensBlurFocalCommitTimer(view);
                    updateLensBlurPresentation();
                    requestLensBlurState();
                }, 10000);
                requestLensBlurState();
                return true;
            } catch (error) {
                view.transaction.reject(error.message || "Lightroom rejected the Focus Range", view.transaction.get().authoritative);
                lensBlurSubjectPresentation.rollbackManualEdit();
                clearLensBlurFocalCommitTimer(view);
                updateLensBlurPresentation();
                requestLensBlurState();
                return false;
            }
        }

        async function activateLensBlurFocusAction(action) {
            const view = lensBlurFocusRangeView;
            if (!view || view.actionPending || view.drag || view.transaction.get().pending ||
                (action !== "subject" && action !== "point-area")) return false;
            clearLensBlurFocusActionFeedback(view);
            let expectedActive = null;
            if (action === "point-area") {
                expectedActive = lensBlurHelper.pointAreaToggleIntent(lensBlurHelper.presentationFor(lensBlurModel.get()));
                if (expectedActive === null) {
                    showLensBlurFocusActionFeedback(view, "Point / Area Focus state unavailable", true);
                    updateLensBlurPresentation();
                    return false;
                }
            }
            view.actionPending = {
                action: action,
                expectedActive: expectedActive,
                subjectCandidateRange: null,
                subjectCandidateCount: 0,
                subjectCandidateRevision: null,
                confirmationAfterRevision: Number.MAX_SAFE_INTEGER,
                timer: null
            };
            updateLensBlurPresentation();
            try {
                const actionPath = "/api/lens-blur/focus-action?value=" + encodeURIComponent(action);
                const response = await fetch(actionPath, { cache: "no-store" });
                const data = await response.json();
                if (!response.ok || !data || data.ok !== true || !data.windowsNative ||
                    !Number.isSafeInteger(data.confirmationAfterRevision)) {
                    throw new Error(data && data.error ? data.error : "Focus action unavailable");
                }
                lensBlurModel.applyWindowsNative(data.windowsNative);
                view.actionPending.confirmationAfterRevision = data.confirmationAfterRevision;
                view.actionPending.timer = setTimeout(function () {
                    if (!view.actionPending || view.actionPending.action !== action) return;
                    const timedOutExpectedActive = view.actionPending.expectedActive;
                    clearLensBlurFocusActionPending(view);
                    const timeoutMessage = action === "subject"
                        ? "Lightroom did not confirm Subject Focus"
                        : (timedOutExpectedActive
                            ? "Lightroom did not arm Point / Area Focus"
                            : "Lightroom did not exit Point / Area Focus");
                    showLensBlurFocusActionFeedback(view, timeoutMessage, true);
                    updateLensBlurPresentation();
                }, 10000);
                updateLensBlurPresentation();
                requestLensBlurState();
                return true;
            } catch (error) {
                clearLensBlurFocusActionPending(view);
                showLensBlurFocusActionFeedback(view, error.message || "Focus action unavailable", true);
                updateLensBlurPresentation();
                requestLensBlurState();
                return false;
            }
        }

        function beginLensBlurFocalDrag(part, event) {
            const view = lensBlurFocusRangeView;
            const transactionState = view && view.transaction.get();
            if (!view || view.drag || view.actionPending || !transactionState.displayed || transactionState.pending || event.button !== 0) return;
            const rectangle = view.track.getBoundingClientRect();
            if (!rectangle.width || !view.transaction.begin(part, transactionState.displayed)) return;
            const target = event.currentTarget;
            const bounds = lensBlurHelper.focalRangeDeltaBounds(transactionState.displayed, part);
            if (!bounds) return;
            const drag = {
                part: part,
                pointerId: event.pointerId,
                target: target,
                startX: event.clientX,
                rectangle: rectangle,
                bounds: bounds,
                pointerFinished: false
            };
            view.drag = drag;
            updateLensBlurPresentation();

            function updateDesired(pointerEvent) {
                if (!Number.isFinite(pointerEvent.clientX)) return;
                const rawDelta = Math.round((pointerEvent.clientX - drag.startX) *
                    (lensBlurHelper.focalDepthMaximum - lensBlurHelper.focalDepthMinimum) / drag.rectangle.width);
                const delta = Math.max(drag.bounds.min, Math.min(drag.bounds.max, rawDelta));
                const next = view.transaction.move(delta);
                if (next.displayed) paintLensBlurFocusRange(next.displayed, view);
            }

            function cleanupPointerListeners() {
                target.removeEventListener("pointermove", move);
                target.removeEventListener("pointerup", finish);
                target.removeEventListener("pointercancel", finish);
                target.removeEventListener("lostpointercapture", finish);
                window.removeEventListener("keydown", keydown);
            }

            function cancelDrag(pointerEvent) {
                if (!view.drag || view.drag !== drag || drag.pointerFinished) return;
                drag.pointerFinished = true;
                cleanupPointerListeners();
                view.transaction.cancel();
                view.drag = null;
                if (target.hasPointerCapture && target.hasPointerCapture(drag.pointerId)) target.releasePointerCapture(drag.pointerId);
                updateLensBlurPresentation();
                if (pointerEvent && pointerEvent.preventDefault) pointerEvent.preventDefault();
            }

            function keydown(keyEvent) {
                if (keyEvent.key === "Escape") cancelDrag(keyEvent);
            }

            function move(moveEvent) {
                if (!view.drag || moveEvent.pointerId !== drag.pointerId) return;
                updateDesired(moveEvent);

        function compoundDevelopRangeValue(control) {
            if (control.localValue !== null) return Number(control.localValue);
            if (control.authoritativeValue !== null) return Number(control.authoritativeValue);
            return NaN;
        }

        function compoundDevelopRangeVisualProgress(value, visualMinimum, visualMaximum) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue) || visualMaximum <= visualMinimum) return 0;
            const clamped = Math.min(visualMaximum, Math.max(visualMinimum, numericValue));
            return 100 * (clamped - visualMinimum) / (visualMaximum - visualMinimum);
        }

        function roundCompoundDevelopRangeVisualValue(definition, value, visualMinimum, visualMaximum) {
            const clamped = Math.min(visualMaximum, Math.max(visualMinimum, Number(value)));
            const snapped = visualMinimum +
                Math.round((clamped - visualMinimum) / definition.rangeStep) * definition.rangeStep;
            const rounded = Number(snapped.toFixed(definition.displayPrecision));
            return Math.min(visualMaximum, Math.max(visualMinimum, rounded));
        }

        function compoundDevelopRangePointerValue(
            definition,
            clientX,
            trackRect,
            visualMinimum,
            visualMaximum
        ) {
            if (!trackRect || !Number.isFinite(trackRect.width) || trackRect.width <= 0) return NaN;
            const progress = Math.min(1, Math.max(0, (Number(clientX) - trackRect.left) / trackRect.width));
            return roundCompoundDevelopRangeVisualValue(
                definition,
                visualMinimum + progress * (visualMaximum - visualMinimum),
                visualMinimum,
                visualMaximum
            );
        }

        function compoundDevelopRangeControl(compound, role) {
            return role === "low" ? compound.lowControl : compound.highControl;
        }

        function compoundDevelopRangeOtherControl(compound, role) {
            return role === "low" ? compound.highControl : compound.lowControl;
        }

        function compoundDevelopRangeHandle(compound, role) {
            return role === "low" ? compound.lowHandle : compound.highHandle;
        }

        function compoundDevelopRangeEffectiveBounds(compound, role) {
            const visualMinimum = Number(compound.visualMinimum);
            const visualMaximum = Number(compound.visualMaximum);
            const otherValue = compoundDevelopRangeValue(compoundDevelopRangeOtherControl(compound, role));
            const minimumGap = Number(compound.minimumGap);
            if (!Number.isFinite(otherValue) || !Number.isFinite(minimumGap)) {
                return { minimum: visualMinimum, maximum: visualMaximum };
            }
            if (role === "low") {
                return {
                    minimum: visualMinimum,
                    maximum: Math.max(visualMinimum, Math.min(visualMaximum, otherValue - minimumGap))
                };
            }
            return {
                minimum: Math.min(visualMaximum, Math.max(visualMinimum, otherValue + minimumGap)),
                maximum: visualMaximum
            };
        }

        function clampCompoundDevelopRangeValue(compound, role, requestedValue) {
            const requested = Number(requestedValue);
            if (!Number.isFinite(requested)) return requested;
            const bounds = compoundDevelopRangeEffectiveBounds(compound, role);
            return Math.min(bounds.maximum, Math.max(bounds.minimum, requested));
        }

        function updateCompoundDevelopRange(compound) {
            if (!compound) return;
            const lowValue = compoundDevelopRangeValue(compound.lowControl);
            const highValue = compoundDevelopRangeValue(compound.highControl);
            const lowAvailable = Number.isFinite(lowValue) && compound.lowControl.authoritativeValue !== null &&
                compound.lowControl.feedbackState === "available";
            const highAvailable = Number.isFinite(highValue) && compound.highControl.authoritativeValue !== null &&
                compound.highControl.feedbackState === "available";
            const available = lowAvailable && highAvailable;

            if (Number.isFinite(lowValue)) {
                compound.lowControl.range.value = String(actualToDevelopSliderPosition(compound.lowControl.definition, lowValue));
            }
            if (Number.isFinite(highValue)) {
                compound.highControl.range.value = String(actualToDevelopSliderPosition(compound.highControl.definition, highValue));
            }

            const lowProgress = compoundDevelopRangeVisualProgress(
                lowValue,
                compound.visualMinimum,
                compound.visualMaximum
            );
            const highProgress = compoundDevelopRangeVisualProgress(
                highValue,
                compound.visualMinimum,
                compound.visualMaximum
            );
            compound.lowHandle.style.left = lowProgress + "%";
            compound.highHandle.style.left = highProgress + "%";
            compound.track.style.setProperty("--compound-fill-start", Math.min(lowProgress, highProgress) + "%");
            compound.track.style.setProperty("--compound-fill-end", Math.max(lowProgress, highProgress) + "%");
            compound.value.textContent = available
                ? formatDevelopSliderValue(compound.lowControl.definition, lowValue) + " / " +
                    formatDevelopSliderValue(compound.highControl.definition, highValue)
                : "-- / --";
            compound.lowControl.range.disabled = !available;
            compound.highControl.range.disabled = !available;
            compound.lowHandle.disabled = !available;
            compound.highHandle.disabled = !available;
            compound.reset.disabled = !available;
            const lowBounds = compoundDevelopRangeEffectiveBounds(compound, "low");
            const highBounds = compoundDevelopRangeEffectiveBounds(compound, "high");
            compound.lowHandle.setAttribute("aria-valuemin", String(lowBounds.minimum));
            compound.lowHandle.setAttribute("aria-valuemax", String(lowBounds.maximum));
            compound.highHandle.setAttribute("aria-valuemin", String(highBounds.minimum));
            compound.highHandle.setAttribute("aria-valuemax", String(highBounds.maximum));
            compound.lowHandle.setAttribute("aria-valuenow", Number.isFinite(lowValue) ? String(lowValue) : "");
            compound.highHandle.setAttribute("aria-valuenow", Number.isFinite(highValue) ? String(highValue) : "");
            compound.lowHandle.setAttribute("aria-valuetext", available
                ? "Lo " + formatDevelopSliderValue(compound.lowControl.definition, lowValue) +
                    ", Hi " + formatDevelopSliderValue(compound.highControl.definition, highValue)
                : "Unavailable");
            compound.highHandle.setAttribute("aria-valuetext", available
                ? "Hi " + formatDevelopSliderValue(compound.highControl.definition, highValue) +
                    ", Lo " + formatDevelopSliderValue(compound.lowControl.definition, lowValue)
                : "Unavailable");

            compound.row.classList.remove("loading", "unavailable", "error");
            if (available) {
                compound.state.textContent = "";
            } else if (
                compound.lowControl.feedbackState === "error" ||
                compound.highControl.feedbackState === "error"
            ) {
                compound.row.classList.add("error");
                compound.state.textContent = "Feedback error";
            } else if (
                compound.lowControl.feedbackState === "unavailable" ||
                compound.highControl.feedbackState === "unavailable"
            ) {
                compound.row.classList.add("unavailable");
                compound.state.textContent = "Unavailable";
            } else {
                compound.row.classList.add("loading");
                compound.state.textContent = "Loading…";
            }
        }

        function moveCompoundDevelopRangeEndpoint(compound, role, clientX) {
            if (compound.activeEndpoint !== role) return null;
            const control = compoundDevelopRangeControl(compound, role);
            const requested = compoundDevelopRangePointerValue(
                control.definition,
                clientX,
                compound.track.getBoundingClientRect(),
                compound.visualMinimum,
                compound.visualMaximum
            );
            const nextValue = clampCompoundDevelopRangeValue(compound, role, requested);
            if (!Number.isFinite(nextValue)) return null;
            const currentValue = compoundDevelopRangeValue(control);
            compound.dragValue = nextValue;
            if (Number.isFinite(currentValue) && valuesMatchDevelopSlider(control.definition, currentValue, nextValue)) {
                return nextValue;
            }
            compound.dragChanged = true;
            showDevelopSliderLocal(control, nextValue);
            scheduleDevelopSliderValue(control, nextValue);
            return nextValue;
        }

        function finishCompoundDevelopRangeDrag(compound, role, event, submitFinal) {
            if (compound.activeEndpoint !== role) return;
            if (event && event.pointerId !== undefined && event.pointerId !== compound.activePointerId) return;
            const control = compoundDevelopRangeControl(compound, role);
            const handle = compoundDevelopRangeHandle(compound, role);
            const pointerId = compound.activePointerId;
            const finalValue = compound.dragValue;
            const changed = compound.dragChanged;
            const invalidated = control.contextInvalidated;
            compound.activeEndpoint = null;
            compound.activePointerId = null;
            compound.dragChanged = false;
            compound.dragValue = null;
            control.pointerActive = false;
            control.dragging = false;
            if (handle.hasPointerCapture && handle.hasPointerCapture(pointerId)) {
                handle.releasePointerCapture(pointerId);
            }
            if (submitFinal && changed && !invalidated && Number.isFinite(finalValue)) {
                flushDevelopSliderValue(control, finalValue, "range");
            } else {
                cancelDevelopSliderThrottle(control);
            }
            endDevelopSliderInteraction(control);
        }

        function stepCompoundDevelopRangeEndpoint(compound, role, direction) {
            const control = compoundDevelopRangeControl(compound, role);
            const currentValue = compoundDevelopRangeValue(control);
            if (!Number.isFinite(currentValue)) return;
            const requested = roundCompoundDevelopRangeVisualValue(
                control.definition,
                currentValue + direction * control.definition.rangeStep,
                compound.visualMinimum,
                compound.visualMaximum
            );
            const nextValue = clampCompoundDevelopRangeValue(compound, role, requested);
            if (valuesMatchDevelopSlider(control.definition, currentValue, nextValue)) return;
            cancelDevelopSliderStep(control);
            control.desiredValue = nextValue;
            control.stepConfirmationExpired = false;
            showDevelopSliderLocal(control, nextValue);
            control.numberCommittedValue = nextValue;
            scheduleDevelopSliderStepSubmission(control);
        }

        function bindCompoundDevelopRangeHandle(compound, role) {
            const control = compoundDevelopRangeControl(compound, role);
            const handle = compoundDevelopRangeHandle(compound, role);
            handle.addEventListener("pointerdown", function (event) {
                if (compound.activeEndpoint !== null || (event.button !== undefined && event.button !== 0)) return;
                cancelDevelopSliderStep(control);
                beginDevelopSliderInteraction(control, "range");
                control.pointerActive = true;
                control.dragging = true;
                compound.activeEndpoint = role;
                compound.activePointerId = event.pointerId;
                compound.dragChanged = false;
                compound.dragValue = compoundDevelopRangeValue(control);
                if (handle.setPointerCapture) handle.setPointerCapture(event.pointerId);
                event.preventDefault();
            });
            handle.addEventListener("pointermove", function (event) {
                if (compound.activeEndpoint !== role || event.pointerId !== compound.activePointerId) return;
                moveCompoundDevelopRangeEndpoint(compound, role, event.clientX);
            });
            handle.addEventListener("pointerup", function (event) {
                finishCompoundDevelopRangeDrag(compound, role, event, true);
            });
            handle.addEventListener("pointercancel", function (event) {
                finishCompoundDevelopRangeDrag(compound, role, event, false);
            });
            handle.addEventListener("lostpointercapture", function (event) {
                finishCompoundDevelopRangeDrag(compound, role, event, false);
            });
            handle.addEventListener("keydown", function (event) {
                let direction = 0;
                if (event.key === "ArrowLeft" || event.key === "ArrowDown") direction = -1;
                if (event.key === "ArrowRight" || event.key === "ArrowUp") direction = 1;
                if (!direction) return;
                event.preventDefault();
                stepCompoundDevelopRangeEndpoint(compound, role, direction);
            });
            control.cancelInteraction = function () {
                finishCompoundDevelopRangeDrag(compound, role, null, false);
            };
        }

        function createCompoundDevelopRangeControl(label, lowDefinition, highDefinition) {

            highControl.range.dataset.sliderId = highDefinition.id;

            highHandle.dataset.sliderId = highDefinition.id;

            state.className = "develop-slider-state";

            const reset = makeButton("Reset", "reset", function () {
                cancelDevelopSliderStep(lowControl);
                cancelDevelopSliderStep(highControl);
                markSliderCommandSent();

        async function requestTreatmentState() {
            if (activeTab !== "sliders" || treatmentRequestInFlight) return;
            treatmentRequestInFlight = true;
            const generation = treatmentGeneration;
            const abortController = new AbortController();
            treatmentAbortController = abortController;
            try {
                const response = await fetch("/api/treatment/request", { cache: "no-store", signal: abortController.signal });
                const data = await response.json();
                if (!response.ok || !data.request) throw new Error("Treatment request failed");
                let snapshot = null;
                const deadline = Date.now() + 4000;
                while (!abortController.signal.aborted && Date.now() < deadline) {
                    const snapshotResponse = await fetch("/api/treatment/snapshot?id=" + encodeURIComponent(data.request.id), {
                        cache: "no-store", signal: abortController.signal
                    });
                    snapshot = await snapshotResponse.json();
                    if (!snapshotResponse.ok) throw new Error("Treatment snapshot failed");
                    if (snapshot.status !== "pending") break;
                    await sleep(120);
                }
                if (generation !== treatmentGeneration || abortController.signal.aborted || activeTab !== "sliders") return;
                if (!snapshot || snapshot.status !== "available" || typeof snapshot.grayscale !== "boolean") {
                    throw new Error("Treatment unavailable");
                }
                const changed = !treatmentHasAuthoritativeState || treatmentAuthoritativeState !== snapshot.grayscale;
                treatmentAuthoritativeState = snapshot.grayscale;
                treatmentHasAuthoritativeState = true;
                treatmentStateFresh = true;
                if (treatmentPending && treatmentDesiredState !== snapshot.grayscale) {
                    updateTreatmentButton();
                    return;
                }
                treatmentPending = false;
                treatmentDesiredState = null;
                updateTreatmentButton();
                if (changed) rerenderColorMixerSection();
            } catch (err) {
                if (abortController.signal.aborted || generation !== treatmentGeneration) return;
                treatmentPending = false;
                treatmentDesiredState = null;
                treatmentStateFresh = false;
                updateTreatmentButton();
                setStatus("WARNING: Could not read Lightroom treatment; slider feedback remains active.");
            } finally {
                if (generation === treatmentGeneration) {
                    treatmentRequestInFlight = false;
                    treatmentAbortController = null;
                }
            }
        }
