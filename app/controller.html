                    ? "/api/set?slider=" + encodeURIComponent(item.slider) + "&value=1"
                    : "/api/adjust?slider=" + encodeURIComponent(item.slider) + "&amount=5").then(function (accepted) {
                        if (accepted && usesAuthoritativeZeroOne) setTimeout(function () { requestLiveFeedbackSnapshot(true); }, 300);
                    });
                status.textContent = "Sent ON";
            });
            row.appendChild(onButton);

            if (usesAuthoritativeZeroOne) {
                offButton.disabled = true;
                onButton.disabled = true;
                developSliderControls[item.slider] = {
                    row: row,
                    definition: { id: item.slider },
                    applySwitchFeedback: function (value) {
                        const available = value === 0 || value === 1;
                        offButton.disabled = !available;
                        onButton.disabled = !available;
                        offButton.classList.toggle("active", available && value === 0);
                        onButton.classList.toggle("active", available && value === 1);
                        status.textContent = available ? (value === 0 ? "Off" : "On") : "Unavailable";
                    }
                };
                sliderFeedbackElements[item.slider] = row;
            }

            row.appendChild(status);

            groupElement.appendChild(row);
        }

        function formatDevelopSliderValue(definition, value) {
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) return "Unavailable";
            return String(Number(numericValue.toFixed(definition.displayPrecision)));
        }

        function parseDevelopSliderValue(definition, rawValue) {
            if (typeof rawValue !== "string") return null;
            const normalizedValue = rawValue.replace(",", ".");
            if (
                normalizedValue.trim() !== normalizedValue ||
                normalizedValue === "" ||
                !/^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(normalizedValue)
            ) return null;
            const numericValue = Number(normalizedValue);
            if (!Number.isFinite(numericValue) || numericValue < definition.min || numericValue > definition.max) {
                return null;
            }
            const scaled = (numericValue - definition.min) / definition.numericStep;
            return Math.abs(scaled - Math.round(scaled)) < 1e-9 ? numericValue : null;
        }

        function clampDevelopSliderValue(definition, value) {
            return Math.min(definition.max, Math.max(definition.min, value));
        }

        function roundDevelopSliderValue(definition, value, step) {
            const clamped = clampDevelopSliderValue(definition, value);
            const snapped = definition.min + Math.round((clamped - definition.min) / step) * step;
            const rounded = Number(snapped.toFixed(definition.displayPrecision));
            if (Math.abs(clamped - definition.min) < 1e-9) return definition.min;
            if (Math.abs(clamped - definition.max) < 1e-9) return definition.max;
            return clampDevelopSliderValue(definition, rounded);
        }

        function usesTemperatureVisualScale(definition) {
            return definition.visualScale === "temperature" && definition.min > 0 && definition.max > 0;
        }

        function actualToDevelopSliderPosition(definition, value) {
            const actual = clampDevelopSliderValue(definition, Number(value));
            if (!usesTemperatureVisualScale(definition)) return actual;
            if (actual === definition.min) return 0;
            if (actual === definition.max) return 1000;
            return 1000 * (
                (Math.log(actual) - Math.log(definition.min)) /
                (Math.log(definition.max) - Math.log(definition.min))
            );
        }

        function developSliderPositionToActual(definition, position) {
            if (!usesTemperatureVisualScale(definition)) {
                return roundDevelopSliderValue(definition, Number(position), definition.rangeStep);
            }
            const normalized = Math.min(1, Math.max(0, Number(position) / 1000));
            if (normalized === 0) return definition.min;
            if (normalized === 1) return definition.max;
            const actual = Math.exp(
                Math.log(definition.min) +
                normalized * (Math.log(definition.max) - Math.log(definition.min))
            );
            return roundDevelopSliderValue(definition, actual, definition.rangeStep);
        }

        function nextDevelopSliderStepValue(control, direction) {
            const baseValue = control.desiredValue !== null
                ? control.desiredValue
                : (control.localValue !== null ? control.localValue : control.authoritativeValue);
            if (baseValue === null) return null;
            return roundDevelopSliderValue(
                control.definition,
                baseValue + direction * control.definition.rangeStep,
                control.definition.rangeStep
            );
        }

        function configureDevelopSliderRange(control) {
            if (usesTemperatureVisualScale(control.definition)) {
                control.range.min = "0";
                control.range.max = "1000";
                control.range.step = "1";
            } else {
                control.range.min = String(control.definition.min);
                control.range.max = String(control.definition.max);
                control.range.step = String(control.definition.rangeStep);
            }
        }

        function setDevelopSliderState(control, state, message) {
            const normalizedState = state || "available";
            const normalizedMessage = message || "";
            if (
                control.feedbackState === normalizedState &&
                control.stateMessage === normalizedMessage
            ) return false;
            control.row.classList.remove("loading", "unavailable", "error");
            if (state) control.row.classList.add(state);
            control.state.textContent = normalizedMessage;
            control.feedbackState = normalizedState;
            control.stateMessage = normalizedMessage;
            return true;
        }

        function notifyDevelopSliderPresentation(control) {
            if (control.compoundRange) updateCompoundDevelopRange(control.compoundRange);
            if (control.onPresentationChange) control.onPresentationChange(control);
        }

        function showDevelopSliderLocal(control, value) {
            const numericValue = Number(value);
            const visualPosition = actualToDevelopSliderPosition(control.definition, value);
            const visualText = String(visualPosition);
            const visualMin = Number(control.range.min);
            const visualMax = Number(control.range.max);
            const progress = 100 * (visualPosition - visualMin) / (visualMax - visualMin);
            const progressText = progress + "%";
            const numberText = formatDevelopSliderValue(control.definition, value);
            const unchanged = control.localValue !== null &&
                valuesMatchDevelopSlider(control.definition, control.localValue, numericValue) &&
                control.range.value === visualText &&
                control.number.value === numberText &&
                control.visualProgress === progressText &&
                control.feedbackState === "available";
            control.localValue = numericValue;
            if (unchanged) {
                notifyDevelopSliderPresentation(control);
                return false;
            }
            if (control.range.value !== visualText) control.range.value = visualText;
            if (control.visualProgress !== progressText) {
                control.range.style.setProperty("--slider-progress", progressText);
                control.visualProgress = progressText;
            }
            if (control.number.value !== numberText) control.number.value = numberText;
            setDevelopSliderState(control, "", "");
            notifyDevelopSliderPresentation(control);
            return true;
        }

        function applyDevelopSliderFeedback(control, value, rangeChanged) {
            const numericValue = Number(value);
            if (
                !Number.isFinite(numericValue) ||
                numericValue < control.definition.min ||
                numericValue > control.definition.max
            ) {
                return;
            }

            control.authoritativeValue = numericValue;
            control.hasAuthoritativeValueEver = true;
            hasReceivedAnyAuthoritativeDevelopValue = true;
            if (control.hideWhenUnavailable) control.row.hidden = false;

            if (control.desiredValue !== null) {
                if (valuesMatchDevelopSlider(control.definition, numericValue, control.desiredValue)) {
                    const confirmedValue = control.desiredValue;
                    cancelDevelopSliderStep(control);
                    if (rangeChanged || !valuesMatchDevelopSlider(
                        control.definition,
                        control.localValue,
                        confirmedValue
                    )) {
                        showDevelopSliderLocal(control, confirmedValue);
                    }
                    control.numberCommittedValue = numericValue;
                } else if (control.stepConfirmationExpired) {
                    cancelDevelopSliderStep(control);
                    showDevelopSliderLocal(control, numericValue);
                    control.numberCommittedValue = numericValue;
                }
                return;
            }

            if (control.dragging || control.editing) return;

            if (
                rangeChanged ||
                control.localValue === null ||
                !valuesMatchDevelopSlider(control.definition, control.localValue, numericValue) ||
                control.feedbackState !== "available"
            ) {
                showDevelopSliderLocal(control, numericValue);
            }
            control.numberCommittedValue = numericValue;
            if (control.range.disabled) control.range.disabled = false;
            if (control.number.disabled) control.number.disabled = false;
            if (control.decrement.disabled) control.decrement.disabled = false;
            if (control.increment.disabled) control.increment.disabled = false;
            if (control.definition.resetSupported !== false && control.reset.disabled) control.reset.disabled = false;
            notifyDevelopSliderPresentation(control);
        }

        function applyDevelopSliderFeedbackIfChanged(control, result) {
            if (result.available === false && control.definition.authoritativeUnavailableImmediate === true) {
                markDevelopSliderUnavailable(control, true);
                return;
            }
            if (isDevelopSliderInteracting(control)) {
                control.deferredFeedbackResult = result;
                if (result.available !== false && Number.isFinite(Number(result.value))) {
                    control.authoritativeValue = Number(result.value);
                    control.hasAuthoritativeValueEver = true;
                    hasReceivedAnyAuthoritativeDevelopValue = true;
                }
                return;
            }
            if (control.confirmationPending && !control.stepConfirmationExpired) {
                control.deferredFeedbackResult = result;
                if (result.available !== false && Number.isFinite(Number(result.value))) {
                    control.authoritativeValue = Number(result.value);
                    control.hasAuthoritativeValueEver = true;
                    hasReceivedAnyAuthoritativeDevelopValue = true;
                    if (valuesMatchDevelopSlider(control.definition, result.value, control.desiredValue)) {
                        control.numberCommittedValue = Number(result.value);
                        cancelDevelopSliderStep(control);
                    }
                }
                return;
            }
            if (result.available === false) {
                if (control.feedbackState !== "unavailable") markDevelopSliderUnavailable(control);
                return;
            }

            let rangeChanged = false;
            if (result.range && Number.isFinite(result.range.min) && Number.isFinite(result.range.max)) {
                rangeChanged =
                    control.definition.min !== result.range.min ||
                    control.definition.max !== result.range.max;
                if (rangeChanged) {
                    control.definition.min = result.range.min;
                    control.definition.max = result.range.max;
                    configureDevelopSliderRange(control);
                }
            }

            applyDevelopSliderFeedback(control, result.value, rangeChanged);
        }

        function markDevelopSliderUnavailable(control, force) {
            if (!force && (isDevelopSliderInteracting(control) || control.confirmationPending)) return;
            if (force) {
                cancelDevelopSliderThrottle(control);
                activeSliderInteractions.delete(control.definition.id);
                control.interactionKind = null;
                control.dragging = false;
                control.editing = false;
            }
            if (control.feedbackState === "unavailable" && control.desiredValue === null) return;
            cancelDevelopSliderStep(control);
            control.authoritativeValue = null;
            control.numberCommittedValue = null;
            control.localValue = null;
            control.number.value = "";
            setDevelopSliderState(control, "unavailable", "Unavailable");
            control.range.disabled = true;
            control.number.disabled = true;
            control.decrement.disabled = true;
            control.increment.disabled = true;
            control.reset.disabled = true;
            if (control.hideWhenUnavailable) control.row.hidden = true;
            notifyDevelopSliderPresentation(control);
        }

        function markDevelopSliderLoading(control, reason) {
            if (isDevelopSliderInteracting(control) || control.confirmationPending) return;
            if (control.hasAuthoritativeValueEver) return;
            if (control.feedbackState === "loading" && control.desiredValue === null) return;
            console.debug("LRBridge slider visible Loading", {
                sliderId: control.definition.id,
                reason: reason || "unspecified",
                hadAuthoritativeValue: control.hasAuthoritativeValueEver,
                activeTab: activeTab,
                classification: currentDevelopRefreshClassification
            });
            cancelDevelopSliderStep(control);
            control.authoritativeValue = null;
            control.numberCommittedValue = null;
            control.localValue = null;
            control.range.disabled = true;
            control.number.disabled = true;
            control.decrement.disabled = true;
            control.increment.disabled = true;
            control.reset.disabled = true;
            control.number.value = "";
            setDevelopSliderState(control, "loading", "Loading…");
            notifyDevelopSliderPresentation(control);
        }

        function markDevelopSliderError(control) {
            if (isDevelopSliderInteracting(control) || control.confirmationPending || control.authoritativeValue !== null) return;
            cancelDevelopSliderStep(control);
            if (control.feedbackState === "error") return;
            control.number.value = "";
            setDevelopSliderState(control, "error", "Feedback error");
            notifyDevelopSliderPresentation(control);
        }

        function markUninitializedDevelopSlidersLoading(reason) {
            Object.keys(developSliderControls).forEach(function (slider) {
                const control = developSliderControls[slider];
                if (!control.applySwitchFeedback) markDevelopSliderLoading(control, reason);
            });
        }

        async function submitDevelopSliderValue(control, value, kind, completion) {
            if (
                value === control.lastSubmittedValue &&
                !control.requestInFlight &&
                control.authoritativeValue !== null &&
                valuesMatchDevelopSlider(control.definition, control.authoritativeValue, value)
            ) {
                if (completion) completion(true);
                return;
            }
            if (control.requestInFlight) {
                control.pendingValue = value;
                control.pendingKind = kind || null;
                control.pendingCompletion = completion || null;
                return;
            }

            control.requestInFlight = true;
            control.lastSubmittedValue = value;
            markSliderCommandSent();
            const accepted = await sendCommand(
                "/api/set?slider=" + encodeURIComponent(control.definition.id) +
                "&value=" + encodeURIComponent(String(value))
            );
            control.requestInFlight = false;
            if (completion) completion(accepted);

            if (control.pendingValue !== null) {
                const nextValue = control.pendingValue;
                const nextKind = control.pendingKind;
                const nextCompletion = control.pendingCompletion;
                control.pendingValue = null;
                control.pendingKind = null;
                control.pendingCompletion = null;
                if (nextValue !== control.lastSubmittedValue) {
                    submitDevelopSliderValue(control, nextValue, nextKind, nextCompletion);
                } else if (nextCompletion) {
                    nextCompletion(true);
                }
            }
        }

        function scheduleDevelopSliderValue(control, value) {
            control.pendingValue = value;
            control.pendingKind = "range";
            if (control.throttleTimer !== null) return;

            control.throttleTimer = setTimeout(function () {
                control.throttleTimer = null;
                const nextValue = control.pendingValue;
                control.pendingValue = null;
                if (nextValue !== null) submitDevelopSliderValue(control, nextValue, "range");
            }, 100);
        }

        function flushDevelopSliderValue(control, value, kind) {
            if (control.throttleTimer !== null) {
                clearTimeout(control.throttleTimer);
                control.throttleTimer = null;
            }
            control.pendingValue = null;
            control.pendingKind = null;
            control.pendingCompletion = null;
            control.desiredValue = value;
            control.confirmationPending = true;
            control.stepConfirmationExpired = false;
            submitDevelopSliderValue(control, value, kind || null, function (accepted) {
                handleDevelopSliderStepSubmission(control, value, accepted);
            });
        }

        function clearDevelopSliderStepTimers(control) {
            if (control.stepDebounceTimer !== null) {
                clearTimeout(control.stepDebounceTimer);
                control.stepDebounceTimer = null;
            }
            if (control.stepConfirmationTimer !== null) {
                clearTimeout(control.stepConfirmationTimer);
                control.stepConfirmationTimer = null;
            }
        }

        function cancelDevelopSliderStep(control) {
            clearDevelopSliderStepTimers(control);
            control.desiredValue = null;
            control.confirmationPending = false;
            control.stepConfirmationExpired = false;
            if (control.pendingKind === "step") {
                control.pendingValue = null;
                control.pendingKind = null;
                control.pendingCompletion = null;
            }
        }

        function developSliderConfirmationTolerance(definition) {
            return Math.max(
                definition.numericStep / 2,
                Math.pow(10, -definition.displayPrecision) / 2,
                1e-9
            );
        }

        function valuesMatchDevelopSlider(definition, left, right) {
            return Math.abs(Number(left) - Number(right)) <=
                developSliderConfirmationTolerance(definition);
        }

        async function requestDevelopSliderStepFeedback(control, adoptResult) {
            const slider = control.definition.id;
            try {
                const response = await fetch(
                    "/api/feedback/request?slider=" + encodeURIComponent(slider),
                    { cache: "no-store" }
                );
                const data = await response.json();
                const request = data && data.request;
                if (!response.ok || !request || request.id === undefined) {
                    throw new Error("Targeted feedback request failed");
                }
                const outcome = await pollFeedbackSnapshot(request.id, 1900);
                const result = outcome.snapshot &&
                    outcome.snapshot.results &&
                    outcome.snapshot.results[slider];
                if (!result) {
                    if (adoptResult) {
                        cancelDevelopSliderStep(control);
                        if (control.authoritativeValue !== null) {
                            showDevelopSliderLocal(control, control.authoritativeValue);
                        }
                        setStatus("ERROR: " + slider + " confirmation timed out.");
                    }
                    return;
                }
                if (adoptResult) control.stepConfirmationExpired = true;
                applyDevelopSliderFeedbackIfChanged(control, result);
            } catch (err) {
                if (adoptResult) {
                    cancelDevelopSliderStep(control);
                    if (control.authoritativeValue !== null) {
                        showDevelopSliderLocal(control, control.authoritativeValue);
                    }
                    setStatus("ERROR: " + slider + " confirmation failed.");
                }
                console.error("LRBridge targeted slider feedback failed", {
                    slider: slider,
                    reason: err.message
                });
            }
        }

        function handleDevelopSliderStepSubmission(control, desiredAtSubmission, accepted) {
            if (control.desiredValue === null || !valuesMatchDevelopSlider(
                control.definition,
                control.desiredValue,
                desiredAtSubmission
            )) return;

            if (!accepted) {
                cancelDevelopSliderStep(control);
                if (control.authoritativeValue !== null) {
                    showDevelopSliderLocal(control, control.authoritativeValue);
                }
                setStatus("ERROR: " + control.definition.label + " Set request was rejected.");
                return;
            }

            requestDevelopSliderStepFeedback(control, false);
            control.stepConfirmationTimer = setTimeout(function () {
                control.stepConfirmationTimer = null;
                if (control.desiredValue === null) return;
                requestDevelopSliderStepFeedback(control, true);
            }, 2000);
        }

        function scheduleDevelopSliderStepSubmission(control) {
            if (control.stepDebounceTimer !== null) clearTimeout(control.stepDebounceTimer);
            control.stepDebounceTimer = setTimeout(function () {
                control.stepDebounceTimer = null;
                if (control.desiredValue === null) return;
                const desiredAtSubmission = control.desiredValue;
                submitDevelopSliderValue(control, desiredAtSubmission, "step", function (accepted) {
                    handleDevelopSliderStepSubmission(control, desiredAtSubmission, accepted);
                });
            }, 350);
        }

        function stepDevelopSliderValue(control, direction) {
            if (!control) return;
            const nextValue = nextDevelopSliderStepValue(control, direction);
            if (nextValue === null) return;
            const baseValue = control.desiredValue !== null
                ? control.desiredValue
                : (control.localValue !== null ? control.localValue : control.authoritativeValue);
            if (nextValue === baseValue) return;
            clearDevelopSliderStepTimers(control);
            control.desiredValue = nextValue;
            control.stepConfirmationExpired = false;
            showDevelopSliderLocal(control, nextValue);
            control.numberCommittedValue = nextValue;
            scheduleDevelopSliderStepSubmission(control);
        }

        function createDevelopSliderControl(definition) {
            const previousControl = developSliderControls[definition.id];
            const row = document.createElement("div");
            row.className = "develop-slider-row";

            const name = document.createElement("div");
            name.className = "slider-name";
            name.textContent = definition.label;

            const range = document.createElement("input");
            range.type = "range";
            range.disabled = true;
            range.setAttribute("aria-label", definition.label);

            const number = document.createElement("input");
            number.type = "text";
            number.inputMode = "decimal";
            number.autocomplete = "off";
            number.spellcheck = false;
            number.disabled = true;
            number.setAttribute("aria-label", definition.label + " numeric value");

            const state = document.createElement("span");
            state.className = "develop-slider-state";
            state.textContent = "";

            let control = null;

            const decrement = makeButton("−", "develop-slider-step", function () {
                stepDevelopSliderValue(control, -1);
            });
            decrement.setAttribute("aria-label", "Decrease " + definition.label);

            const increment = makeButton("+", "develop-slider-step", function () {
                stepDevelopSliderValue(control, 1);
            });
            increment.setAttribute("aria-label", "Increase " + definition.label);

            const reset = makeButton("Reset", "reset", function () {
                cancelDevelopSliderStep(control);
                markSliderCommandSent();
                sendCommand("/api/reset?slider=" + encodeURIComponent(definition.id)).then(function (accepted) {
                    if (accepted) {
                        setTimeout(function () {
                            requestLiveFeedbackSnapshot(true);
                        }, 300);
                    }
                });
            });

            control = {
                definition: definition,
                row: row,
                range: range,
                number: number,
                state: state,
                decrement: decrement,
                increment: increment,
                reset: reset,
                dragging: false,
                editing: false,
                pointerActive: false,
                interactionKind: null,
                contextInvalidated: false,
                confirmationPending: false,
                deferredFeedbackResult: null,
                ignoreNextRangeChange: false,
                requestInFlight: false,
                pendingValue: null,
                pendingKind: null,
                pendingCompletion: null,
                lastSubmittedValue: null,
                authoritativeValue: null,
                hasAuthoritativeValueEver: previousControl && definition.retainAuthoritativeAcrossRender !== false
                    ? previousControl.hasAuthoritativeValueEver === true
                    : false,
                localValue: null,
                desiredValue: null,
                numberCommittedValue: null,
                throttleTimer: null,
                cancelNextBlur: false,
                stepDebounceTimer: null,
                stepConfirmationTimer: null,
                stepConfirmationExpired: false,
                feedbackState: null,
                stateMessage: null,
                visualProgress: null
            };
            configureDevelopSliderRange(control);
            decrement.disabled = true;
            increment.disabled = true;
            reset.disabled = true;

            if (definition.retainAuthoritativeAcrossRender !== false && previousControl &&
                previousControl.hasAuthoritativeValueEver && previousControl.localValue !== null) {
                control.authoritativeValue = previousControl.authoritativeValue;
                control.numberCommittedValue = previousControl.numberCommittedValue;
                showDevelopSliderLocal(control, previousControl.localValue);
                range.disabled = false;
                number.disabled = false;
                decrement.disabled = false;
                increment.disabled = false;
                reset.disabled = definition.resetSupported === false;
            }

            row.dataset.sliderId = definition.id;

            range.addEventListener("pointerdown", function (event) {
                cancelDevelopSliderStep(control);
                beginDevelopSliderInteraction(control, "range");
                control.pointerActive = true;
                control.dragging = true;
                if (range.setPointerCapture) range.setPointerCapture(event.pointerId);
            });
            range.addEventListener("input", function () {
                cancelDevelopSliderStep(control);
                if (!isDevelopSliderInteracting(control)) beginDevelopSliderInteraction(control, "range");
                const nextValue = developSliderPositionToActual(definition, Number(range.value));
                showDevelopSliderLocal(control, nextValue);
                scheduleDevelopSliderValue(control, nextValue);
            });
            function finishRangeInteraction(event, submitFinal) {
                if (!isDevelopSliderInteracting(control)) return;
                const invalidated = control.contextInvalidated;
                control.pointerActive = false;
                control.dragging = false;
                if (event && range.hasPointerCapture && range.hasPointerCapture(event.pointerId)) range.releasePointerCapture(event.pointerId);
                if (submitFinal && !invalidated) {
                    flushDevelopSliderValue(control, developSliderPositionToActual(definition, Number(range.value)), "range");
                } else {
                    cancelDevelopSliderThrottle(control);
                }
                endDevelopSliderInteraction(control);
            }
            range.addEventListener("pointerup", function (event) {
                control.ignoreNextRangeChange = true;
                finishRangeInteraction(event, true);
            });
            range.addEventListener("pointercancel", function (event) {
                control.ignoreNextRangeChange = true;
                finishRangeInteraction(event, false);
            });
            range.addEventListener("lostpointercapture", function (event) {
                finishRangeInteraction(event, false);
            });
            range.addEventListener("change", function () {
                if (control.ignoreNextRangeChange) {
                    control.ignoreNextRangeChange = false;
                    return;
                }
                if (!control.pointerActive) finishRangeInteraction(null, true);
            });

            function commitNumericValue() {
                cancelDevelopSliderStep(control);
                if (control.contextInvalidated) {
                    cancelDevelopSliderThrottle(control);
                    endDevelopSliderInteraction(control);
                    return;
                }
                const nextValue = parseDevelopSliderValue(definition, number.value);
                if (nextValue === null) {
                    setStatus("ERROR: Invalid " + definition.label + " value.");
                    if (control.authoritativeValue !== null) {
                        showDevelopSliderLocal(control, control.authoritativeValue);
                    } else {
                        number.value = "";
                        markDevelopSliderLoading(control, "invalid-uninitialized-numeric-input");
                    }
                    endDevelopSliderInteraction(control);
                    return;
                }
                if (nextValue !== control.numberCommittedValue) {
                    showDevelopSliderLocal(control, nextValue);
                    control.numberCommittedValue = nextValue;
                    flushDevelopSliderValue(control, nextValue, "numeric");
                }
                endDevelopSliderInteraction(control);
            }

            number.addEventListener("focus", function () {
                beginDevelopSliderInteraction(control, "numeric");
                control.editing = true;
                control.cancelNextBlur = false;
                setTimeout(function () {
                    if (document.activeElement === number) number.select();
                }, 0);
            });
            number.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    commitNumericValue();
                    number.blur();
                } else if (event.key === "Escape") {
                    event.preventDefault();
                    control.cancelNextBlur = true;
                    if (control.authoritativeValue !== null) {
                        showDevelopSliderLocal(control, control.authoritativeValue);
                    }
                    endDevelopSliderInteraction(control);
                    number.blur();
                }
            });
            number.addEventListener("change", function () {
                if (control.editing) commitNumericValue();
            });
            number.addEventListener("blur", function () {
                if (control.cancelNextBlur) {
                    control.cancelNextBlur = false;
                    return;
                }
                if (control.editing) commitNumericValue();
            });

            control.cancelInteraction = function () {
                if (!isDevelopSliderInteracting(control)) return;
                control.contextInvalidated = true;
                cancelDevelopSliderThrottle(control);
                endDevelopSliderInteraction(control);
            };

            row.appendChild(name);
            row.appendChild(range);
            row.appendChild(number);
            row.appendChild(decrement);
            row.appendChild(increment);
            if (definition.resetSupported !== false) row.appendChild(reset);
            row.appendChild(state);

            developSliderControls[definition.id] = control;
            sliderFeedbackElements[definition.id] = row;
            return row;
        }

        function updateLensBlurExplicitSwitch(control, state) {
            if (!control) return;
            const available = state && state.available === true && typeof state.value === "boolean";
            control.off.disabled = !available;
            control.on.disabled = !available;
            control.off.classList.toggle("active", available && state.value === false);
            control.on.classList.toggle("active", available && state.value === true);
            control.off.setAttribute("aria-pressed", String(available && state.value === false));
            control.on.setAttribute("aria-pressed", String(available && state.value === true));
            control.status.textContent = available ? (state.value ? "On" : "Off") : "Unavailable";
        }

        function syncLensBlurNumberEditor(input, editorState) {
            input.classList.toggle("dirty", editorState.dirty && !editorState.pending);
            input.classList.toggle("pending", editorState.pending);
            input.setAttribute("aria-invalid", String(!!editorState.error));
            if (!editorState.editing && !editorState.pending && input.value !== editorState.text) {
                input.value = editorState.text;
            }
        }

        function lensBlurNativeValuesMatch(control, left, right) {
            return Number.isFinite(left) && Number.isFinite(right) &&
                Math.abs(left - right) <= Math.max(1e-9, Math.pow(10, -control.precision) / 4);
        }

        function normalizeLensBlurNativeValue(control, value) {
            if (typeof value !== "number" && typeof value !== "string") return null;
            if (typeof value === "string" && value.trim() === "") return null;
            const numeric = typeof value === "number" ? value : Number(value);
            if (!Number.isFinite(numeric) || !Number.isFinite(control.minimum) || !Number.isFinite(control.maximum)) return null;
            const clamped = Math.min(control.maximum, Math.max(control.minimum, numeric));
            return Number(clamped.toFixed(control.precision));
        }

        function showLensBlurNativeLocal(control, value) {
            const numeric = normalizeLensBlurNativeValue(control, value);
            if (numeric === null) return false;
            const progress = control.maximum > control.minimum
                ? 100 * (numeric - control.minimum) / (control.maximum - control.minimum)
                : 0;
            control.localValue = numeric;
            control.range.value = String(numeric);
            control.range.style.setProperty("--slider-progress", progress + "%");
            const editorState = control.editor.get();
            if (!editorState.editing && !editorState.pending) control.number.value = numeric.toFixed(control.precision);
            control.row.classList.remove("unavailable");
            return true;
        }

        function setLensBlurNativeSliderError(control, message) {
            control.error = message || null;
            control.row.classList.toggle("error", !!control.error);
            control.status.textContent = control.error || "";
        }

        function updateLensBlurNativeSlider(control, state) {
            if (!control) return;
            const available = state && state.available === true && Number.isFinite(state.value) &&
                Number.isFinite(state.min) && Number.isFinite(state.max);
            const stepBefore = control.stepInteraction.get();
            const stepState = control.stepInteraction.applyAuthoritative(available ? state.value : null);
            if (stepBefore.active && !stepState.active) {
                control.desiredValue = null;
                control.interactionId = null;
                control.interactionKind = null;
            }
            const editorState = control.editor.applyAuthoritative(
                available ? state.value : null,
                available,
                available ? state.min : null,
                available ? state.max : null
            );
            syncLensBlurNumberEditor(control.number, editorState);
            const protectedPresentation = control.dragging || control.requestInFlight || control.queuedValue !== null ||
                control.desiredValue !== null || editorState.editing || editorState.pending;
            if (available) {
                control.available = true;
                control.authoritativeValue = state.value;
                control.minimum = state.min;
                control.maximum = state.max;
                control.range.min = String(state.min);
                control.range.max = String(state.max);
                [control.range, control.number, control.decrement, control.increment].forEach(function (element) { element.disabled = false; });
                control.reset.disabled = control.resetInFlight === true;
                control.reset.textContent = control.resetInFlight ? "Resetting…" : "Reset";
                control.row.classList.remove("unavailable");
                if (control.desiredValue !== null && control.interactionKind !== "step" && !control.dragging &&
                    !control.requestInFlight && control.queuedValue === null &&
                    lensBlurNativeValuesMatch(control, state.value, control.desiredValue)) {
                    control.desiredValue = null;
                }
                if (control.desiredValue !== null) showLensBlurNativeLocal(control, control.desiredValue);
                else if (!control.dragging) showLensBlurNativeLocal(control, state.value);
            } else if (!protectedPresentation) {
                control.available = false;
                control.authoritativeValue = null;
                control.localValue = null;
                control.row.classList.add("unavailable");
                [control.range, control.number, control.decrement, control.increment, control.reset].forEach(function (element) { element.disabled = true; });
                control.reset.textContent = "Reset";
                control.status.textContent = "Unavailable";
            }
            if (editorState.error) setLensBlurNativeSliderError(control, editorState.error);
            else if (available && !control.error) control.status.textContent = "";
        }

        function focalRangePercent(value, minimum, maximum) {
            if (!Number.isFinite(value) || maximum <= minimum) return 0;
            return 100 * (Math.min(maximum, Math.max(minimum, value)) - minimum) / (maximum - minimum);
        }

        function paintLensBlurFocusRange(range, view) {
            if (!range || !view) return;
            const minimum = lensBlurHelper.focalDepthMinimum;
            const maximum = lensBlurHelper.focalDepthMaximum;
            const nearOuter = focalRangePercent(range.nearOuter, minimum, maximum);
            const nearInner = focalRangePercent(range.nearInner, minimum, maximum);
            const farInner = focalRangePercent(range.farInner, minimum, maximum);
            const farOuter = focalRangePercent(range.farOuter, minimum, maximum);
            view.selection.style.left = nearInner + "%";
            view.selection.style.width = Math.max(0, farInner - nearInner) + "%";
            view.nearTransition.style.left = nearOuter + "%";
            view.nearTransition.style.width = Math.max(0, nearInner - nearOuter) + "%";
            view.inner.style.left = nearInner + "%";
            view.inner.style.width = Math.max(0, farInner - nearInner) + "%";
            view.farTransition.style.left = farInner + "%";
            view.farTransition.style.width = Math.max(0, farOuter - farInner) + "%";
            view.nearHandle.style.left = nearInner + "%";
            view.farHandle.style.left = farInner + "%";
        }

        function updateLensBlurFocusRange(state) {
            if (!lensBlurFocusRangeView) return;
            const view = lensBlurFocusRangeView;
            const available = state && state.focalRangeAvailable === true && state.focalRange;
            lensBlurSubjectPresentation.applyAuthoritative(state, {
                revision: lensBlurStateRevision,
                focalRangeCommitId: lensBlurFocalRangeCommitId,
                subjectActionPending: !!(view.actionPending && view.actionPending.action === "subject"),
                manualTransactionBlocked: !!view.drag || view.transaction.get().pending !== null ||
                    view.pendingCommitId !== null
            });
            if (available) view.transaction.applyAuthoritative(state.focalRange);
            else if (!view.drag && !view.transaction.get().pending && !view.actionPending) view.transaction.clearAuthoritative();

            const transactionState = view.transaction.get();
            if (transactionState.pending && view.pendingCommitId && lensBlurFocalRangeCommitId === view.pendingCommitId) {
                if (available && lensBlurHelper.focalRangesEqual(state.focalRange, transactionState.pending)) {
                    view.transaction.confirm(state.focalRange);
                    lensBlurSubjectPresentation.confirmManualEdit();
                    clearLensBlurFocalCommitTimer(view);
                } else {
                    view.transaction.reject("Lightroom returned a different Focus Range", available ? state.focalRange : null);
                    lensBlurSubjectPresentation.rollbackManualEdit();
                    clearLensBlurFocalCommitTimer(view);
                }
            }

            if (view.actionPending && lensBlurStateRevision > view.actionPending.confirmationAfterRevision) {
                const confirmed = view.actionPending.action === "subject"
                    ? lensBlurSubjectPresentation.canConfirmSubjectAction(state, view.actionPending, {
                        revision: lensBlurStateRevision,
                        focalRangeCommitId: lensBlurFocalRangeCommitId
                    })
                    : lensBlurHelper.pointAreaToggleConfirmed(state, view.actionPending.expectedActive);
                if (confirmed) {
                    const confirmedAction = view.actionPending.action;
                    if (confirmedAction === "subject") {
                        lensBlurSubjectPresentation.confirmSubjectAction(state, {
                            revision: lensBlurStateRevision,
                            focalRangeCommitId: lensBlurFocalRangeCommitId
                        });
                    }
                    clearLensBlurFocusActionPending(view);
                    if (confirmedAction === "subject") {
                        showLensBlurFocusActionFeedback(view, "Subject Focus applied", false);
                    }
                }
            }

            const currentTransaction = view.transaction.get();
            const displayRange = currentTransaction.displayed;
            const usable = !!displayRange;
            view.root.classList.toggle("unavailable", !usable);
            view.root.classList.toggle("pending", !!currentTransaction.pending);
            view.handles.forEach(function (handle) { handle.disabled = !usable || !!currentTransaction.pending || !!view.actionPending; });
            view.selection.setAttribute("aria-disabled", String(!usable || !!currentTransaction.pending || !!view.actionPending));
            if (displayRange) paintLensBlurFocusRange(displayRange, view);

            const focusActions = state && state.focusActions ? state.focusActions : {};
            const subjectAvailable = focusActions.subject && focusActions.subject.available === true && focusActions.subject.enabled === true;
            const pointAvailable = focusActions.pointArea && focusActions.pointArea.available === true && focusActions.pointArea.enabled === true;
            const actionBusy = !!view.actionPending || !!currentTransaction.pending || !!view.drag;
            view.subjectButton.disabled = !subjectAvailable || actionBusy;
            view.pointAreaButton.disabled = !pointAvailable || actionBusy || !state || state.selectedToolAvailable !== true;
            const subjectPresentation = lensBlurSubjectPresentation.get();
            const focusActiveStates = lensBlurHelper.focusActionActiveStates(state, subjectPresentation);
            const pointActive = focusActiveStates.pointArea;
            const subjectActive = focusActiveStates.subject;
            const subjectBusy = !!(view.actionPending && view.actionPending.action === "subject");
            view.subjectButton.classList.toggle("active", subjectActive);
            view.subjectButton.setAttribute("aria-pressed", String(subjectActive));
            view.subjectButton.classList.toggle("busy", subjectBusy);
            view.subjectButton.setAttribute("aria-busy", String(subjectBusy));
            view.pointAreaButton.classList.toggle("active", pointActive);
            view.pointAreaButton.setAttribute("aria-pressed", String(pointActive));
            view.source.textContent = lensBlurHelper.focusSourceText(subjectPresentation);

            const localError = currentTransaction.error ||
                (view.actionFeedback && view.actionFeedback.error ? view.actionFeedback.message : null);
            view.status.classList.toggle("error", !!localError);
            if (localError) view.status.textContent = localError;
            else if (view.actionPending && view.actionPending.action === "subject") view.status.textContent = "Finding subject focus…";
            else if (view.actionPending && view.actionPending.action === "point-area") {
                view.status.textContent = view.actionPending.expectedActive
                    ? "Arming Point / Area Focus…"
                    : "Leaving Point / Area Focus…";
            } else if (view.actionFeedback) view.status.textContent = view.actionFeedback.message;
            else if (pointActive) view.status.textContent = "Click or drag on the image in Lightroom to choose the focus area.";
            else if (currentTransaction.pending) view.status.textContent = "Updating Focus Range…";
            else view.status.textContent = usable ? "" : "Unavailable";
        }

        function updateLensBlurPresentation() {
            const presentation = lensBlurHelper
                ? lensBlurHelper.presentationFor(lensBlurModel.get())
                : { applyAvailable: false, applyOffSelected: false, applyOnSelected: false, bokehAvailable: false,
                    selectedBokeh: null, refinementActive: false, selectedToolAvailable: false, selectedTool: null,
                    focalRangeSourceAvailable: false, focalRangeSource: null, brush: {}, visualizeDepth: null, autoMask: null,
                    refinementMode: "unknown", refinementModeTargetsAvailable: false, refinementDisclosure: null,
                    refinementReset: null, focusActions: {},
                    focalRangeAvailable: false, focalRange: null };
            if (lensBlurApplyOffButton && lensBlurApplyOnButton) {
                lensBlurApplyOffButton.disabled = false;
                lensBlurApplyOnButton.disabled = false;
                lensBlurApplyOffButton.classList.toggle("active", presentation.applyOffSelected);
                lensBlurApplyOnButton.classList.toggle("active", presentation.applyOnSelected);
                lensBlurApplyOffButton.setAttribute("aria-pressed", String(presentation.applyOffSelected));
                lensBlurApplyOnButton.setAttribute("aria-pressed", String(presentation.applyOnSelected));
            }
            if (lensBlurApplyStatus) {
                lensBlurApplyStatus.textContent = presentation.applyAvailable
                    ? (presentation.applyOnSelected ? "On" : "Off")
                    : "Unknown";
            }
            (lensBlurHelper ? lensBlurHelper.bokehOptions : []).forEach(function (option) {
                const button = lensBlurBokehButtons[option.value];
                if (!button) return;
                const selected = presentation.selectedBokeh === option.value;
                button.disabled = !presentation.bokehAvailable;
                button.classList.toggle("active", selected);
                button.setAttribute("aria-pressed", String(selected));
            });
            if (lensBlurBokehStatus) lensBlurBokehStatus.textContent = presentation.bokehAvailable ? "" : "Unavailable";
            if (lensBlurRefinementButton) {
                const disclosureAvailable = presentation.refinementDisclosure &&
                    presentation.refinementDisclosure.available === true &&
                    typeof presentation.refinementDisclosure.value === "boolean";
                const disclosureOpen = disclosureAvailable && presentation.refinementDisclosure.value;
                lensBlurRefinementButton.setAttribute("aria-pressed", String(disclosureOpen));
                const closing = lensBlurDisclosureRequestInFlight && lensBlurDisclosurePendingOpen === false;
                const danger = disclosureOpen || closing;
                lensBlurRefinementButton.classList.toggle("command-primary", !danger);
                lensBlurRefinementButton.classList.toggle("command-danger", danger);
                lensBlurRefinementButton.textContent = lensBlurDisclosureRequestInFlight
                    ? (closing ? "Closing…" : "Opening…")
                    : (disclosureOpen ? "Close Brush Refinement" : "Open Brush Refinement");
                lensBlurRefinementButton.disabled = !disclosureAvailable || lensBlurDisclosureRequestInFlight;
                lensBlurRefinementButton.title = disclosureAvailable ? "" : "Brush Refinement disclosure unavailable";
            }
            Object.keys(lensBlurNativeControls).forEach(function (name) {
                updateLensBlurNativeSlider(lensBlurNativeControls[name], presentation.brush[name]);
            });
            updateLensBlurExplicitSwitch(lensBlurVisualizeButtons, presentation.visualizeDepth);
            updateLensBlurExplicitSwitch(lensBlurAutoMaskButtons, presentation.autoMask);
            if (lensBlurModeButtons) {
                const focusSelected = presentation.refinementMode === "focus";
                const blurSelected = presentation.refinementMode === "blur";
                const modeAvailable = presentation.refinementModeTargetsAvailable === true;
                lensBlurModeButtons.focus.classList.toggle("active", focusSelected);
                lensBlurModeButtons.blur.classList.toggle("active", blurSelected);
                lensBlurModeButtons.focus.setAttribute("aria-pressed", String(focusSelected));
                lensBlurModeButtons.blur.setAttribute("aria-pressed", String(blurSelected));
                lensBlurModeButtons.focus.disabled = !modeAvailable || lensBlurModeRequestInFlight;
                lensBlurModeButtons.blur.disabled = !modeAvailable || lensBlurModeRequestInFlight;
                lensBlurModeButtons.status.textContent = lensBlurModeRequestInFlight
                    ? "Changing…"
                    : (modeAvailable ? (focusSelected || blurSelected ? "" : "Choose Focus or Blur") : "Unavailable");
            }
            if (lensBlurRefinementResetButton) {
                const resetAvailable = presentation.refinementReset &&
                    presentation.refinementReset.available === true &&
                    typeof presentation.refinementReset.enabled === "boolean";
                const resetEnabled = resetAvailable && presentation.refinementReset.enabled === true;
                lensBlurRefinementResetButton.disabled = !resetEnabled || lensBlurRefinementResetRequestInFlight;
                lensBlurRefinementResetButton.title = resetEnabled
                    ? ""
                    : "Available after Focus or Blur refinements have been painted.";
            }
            updateLensBlurFocusRange(presentation);
        }

        function clearDevelopCategoricalPendingTimer(control) {
            if (developCategoricalPendingTimers[control] !== undefined) {
                clearTimeout(developCategoricalPendingTimers[control]);
                delete developCategoricalPendingTimers[control];
            }
        }

        function resetDevelopCategoricalState() {
            Object.keys(developCategoricalPendingTimers).forEach(clearDevelopCategoricalPendingTimer);
            Object.keys(developCategoricalErrors).forEach(function (control) { delete developCategoricalErrors[control]; });
            developCategoricalSubmitting.clear();
            if (developCategoricalModel) developCategoricalModel.reset();
            updateDevelopCategoricalControls();
        }

        function developCategoricalOptionLabel(control, value) {
            if (!developCategoricalHelper) return "Unavailable";
            const options = control === "process" ? developCategoricalHelper.processOptions :
                control === "vignetteStyle" ? developCategoricalHelper.vignetteStyleOptions :
                control === "uprightMode" ? developCategoricalHelper.uprightModeOptions : [];
            const match = options.find(function (option) { return option.value === value; });
            return match ? match.label : "Unavailable";
        }

        function updateDevelopCategoricalControls() {
            if (!developCategoricalModel) return;
            ["process", "vignetteStyle"].forEach(function (controlName) {
                const control = developCategoricalControls[controlName];
                if (!control) return;
                const presentation = developCategoricalModel.presentation(controlName);
                const busy = presentation.pending || developCategoricalSubmitting.has(controlName);
                const shownValue = presentation.pending ? presentation.desiredValue : presentation.authoritativeValue;
                control.select.disabled = !presentation.available || busy;
                control.select.value = shownValue === null ? "" : String(shownValue);
                control.select.classList.toggle("pending", presentation.pending);
                control.status.className = "develop-categorical-status";
                if (developCategoricalErrors[controlName]) {
                    control.status.classList.add("error");
                    control.status.textContent = developCategoricalErrors[controlName];
                } else if (developCategoricalSubmitting.has(controlName)) {
                    control.status.classList.add("pending");
                    control.status.textContent = "Sending to Lightroom…";
                } else if (presentation.pending) {
                    control.status.classList.add("pending");
                    control.status.textContent = "Awaiting authoritative confirmation…";
                } else {
                    control.status.textContent = presentation.available
                        ? developCategoricalOptionLabel(controlName, presentation.authoritativeValue)
                        : "Unavailable";
                }
            });

            const uprightControl = developCategoricalControls.uprightMode;
            if (uprightControl) {
                const presentation = developCategoricalModel.presentation("uprightMode");
                const busy = presentation.pending || developCategoricalSubmitting.has("uprightMode");
                developCategoricalHelper.syncUprightButtons(uprightControl.buttons, presentation, busy);
                uprightControl.status.className = "develop-categorical-status";
                if (developCategoricalErrors.uprightMode) {
                    uprightControl.status.classList.add("error");
                    uprightControl.status.textContent = developCategoricalErrors.uprightMode;
                } else if (developCategoricalSubmitting.has("uprightMode")) {
                    uprightControl.status.classList.add("pending");
                    uprightControl.status.textContent = "Sending to Lightroom…";
                } else if (presentation.pending) {
                    uprightControl.status.classList.add("pending");
                    uprightControl.status.textContent = "Awaiting authoritative confirmation…";
                } else {
                    if (presentation.available) {
                        uprightControl.status.classList.add("visually-hidden");
                        uprightControl.status.textContent = "Current Upright mode: " +
                            developCategoricalOptionLabel("uprightMode", presentation.authoritativeValue);
                    } else {
                        uprightControl.status.textContent = "Unavailable";
                    }
                }
            }

            const constrainControl = developCategoricalControls.constrainCrop;
            if (constrainControl) {
                const presentation = developCategoricalModel.presentation("constrainCrop");
                const busy = presentation.pending || developCategoricalSubmitting.has("constrainCrop");
                developCategoricalHelper.syncBinaryButtons(constrainControl.buttons, presentation, busy);
                constrainControl.status.className = "switch-status develop-categorical-status";
                if (developCategoricalErrors.constrainCrop) {
                    constrainControl.status.classList.add("error");
                    constrainControl.status.textContent = developCategoricalErrors.constrainCrop;
                } else if (developCategoricalSubmitting.has("constrainCrop")) {
                    constrainControl.status.classList.add("pending");
                    constrainControl.status.textContent = "Sending to Lightroom…";
                } else if (presentation.pending) {
                    constrainControl.status.classList.add("pending");
                    constrainControl.status.textContent = "Awaiting authoritative confirmation…";
                } else {
                    constrainControl.status.textContent = presentation.available
                        ? (presentation.authoritativeValue === 1 ? "On" : "Off")
                        : "Unavailable";
                }
            }

            const toolControl = developCategoricalControls.uprightTool;
            if (toolControl) {
                const presentation = developCategoricalModel.presentation("uprightTool");
                const uprightPresentation = developCategoricalModel.presentation("uprightMode");
                const active = presentation.available && presentation.authoritativeValue === "upright";
                const busy = presentation.pending || developCategoricalSubmitting.has("uprightTool");
                toolControl.button.disabled = !presentation.available || !uprightPresentation.available || busy;
                toolControl.button.classList.toggle("active", active);
                toolControl.button.classList.toggle("pending", presentation.pending);
                toolControl.button.setAttribute("aria-pressed", String(active));
                toolControl.status.className = "develop-categorical-status";
                if (developCategoricalErrors.uprightTool) {
                    toolControl.status.classList.add("error");
                    toolControl.status.textContent = developCategoricalErrors.uprightTool;
                } else if (developCategoricalSubmitting.has("uprightTool")) {
                    toolControl.status.classList.add("pending");
                    toolControl.status.textContent = "Sending to Lightroom…";
                } else if (presentation.pending) {
                    toolControl.status.classList.add("pending");
                    toolControl.status.textContent = "Awaiting authoritative tool feedback…";
                } else {
                    toolControl.status.textContent = presentation.available ? (active ? "Active" : "Inactive") : "Unavailable";
                }
            }

            const updateControl = developCategoricalControls.transformUpdate;
            if (updateControl) {
                const capability = developCategoricalCapabilities.transformUpdate || {};
                updateControl.button.disabled = capability.available !== true || capability.enabled !== true;
                updateControl.status.textContent = capability.available === true
                    ? (capability.reason || "Available")
                    : "Unavailable through Lightroom SDK 15.3";
