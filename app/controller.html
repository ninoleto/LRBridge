                    sliderControl.classList.add("touch-group-gap");
                }
                groupElement.appendChild(sliderControl);
            });
            if (section.id === "transform") appendTransformConstrainCropControl(groupElement);
            const trailingControls = createSectionControls(section, "trailing");
            if (trailingControls) groupElement.appendChild(trailingControls);
            return groupElement;
        }

        function rerenderColorMixerSection() {
            if (activeTab !== "sliders" || !developRenderedSections["color-mixer"]) return;
            const specification = developSectionDisplayOrder.find(function (section) {
                return section.id === "color-mixer";
            });
            const section = {
                id: specification.id,
                label: getDevelopSectionDisplayLabel(specification),
                selectors: specification.selectors,
                items: selectDevelopSectionDefinitions(specification)
            };
            const replacement = createDevelopSectionElement(section);
            developRenderedSections["color-mixer"].replaceWith(replacement);
            developRenderedSections["color-mixer"] = replacement;
            const jumpMenu = content.querySelector(".slider-jump-control");
            if (jumpMenu) {
                disconnectSliderJumpDockObserver();
                jumpMenu.remove();
            }
            installSliderJumpMenu();
            requestLiveFeedbackSnapshot(true);
        }

        function enhanceOperationPending() {
            return enhanceState && (enhanceState.operation === "starting" || enhanceState.operation === "processing");
        }

        function enhanceAmountOperationPending() {
            return enhanceState && (enhanceState.amountOperation === "starting" || enhanceState.amountOperation === "processing");
        }

        function validDenoiseAmount(value) {
            return enhanceAmountModel.valid(value);
        }

        function parseDenoiseAmountText(value) {
            return enhanceAmountModel.parse(value);
        }

        function displayDenoiseAmount(value, updateText) {
            if (!validDenoiseAmount(value)) return;
            enhanceAmountRange.value = String(value);
            enhanceAmountRange.style.setProperty("--slider-progress", ((value - 1) / 99 * 100) + "%");
            if (updateText !== false && !enhanceAmountModel.editing) enhanceAmountInput.value = String(value);
        }

        async function sendDenoiseAmount(amount) {
            if (validDenoiseAmount(amount)) enhanceAmountModel.setDesired(amount);
            amount = enhanceAmountModel.desired;
            if (!validDenoiseAmount(amount) || enhanceAmountModel.inFlight || amount === enhanceAmountModel.authoritative) return false;
            if (!enhanceAmountModel.markSent(amount)) return false;
            enhanceState = Object.assign({}, enhanceState || {}, { amountOperation: "starting", requestedAmount: amount });
            updateEnhanceControls();
            const accepted = await sendCommand("/api/enhance/denoise/amount?amount=" + encodeURIComponent(String(amount)));
            if (!accepted) { enhanceAmountModel.sendFailed(); await requestEnhanceState(); }
            else requestEnhanceState();
            return accepted;
        }

        function scheduleDenoiseAmount(amount) {
            if (validDenoiseAmount(amount)) enhanceAmountModel.setDesired(amount);
            if (enhanceAmountDebounceTimer !== null) clearTimeout(enhanceAmountDebounceTimer);
            enhanceAmountModel.setDebouncePending(true);
            enhanceAmountDebounceTimer = setTimeout(function () {
                enhanceAmountDebounceTimer = null;
                enhanceAmountModel.setDebouncePending(false);
                sendDenoiseAmount(enhanceAmountModel.desired);
            }, 200);
        }

        function updateEnhanceControls() {
            if (!enhanceOffButton || !enhanceOnButton || !enhanceMinusButton || !enhancePlusButton || !enhanceStatus ||
                !rawDetailsOffButton || !rawDetailsOnButton || !rawDetailsStatus ||
                !superResolutionOffButton || !superResolutionOnButton || !superResolutionStatus) return;
            const hasPhoto = lastControllerSelectedPhotoKey !== null && lastControllerSelectedPhotoKey !== "";
            const inDevelop = lastControllerActiveModule === "develop";
            const state = enhanceState;
            const unavailable = !state || state.available !== true;
            const pending = enhanceOperationPending();
            const amountPending = enhanceAmountOperationPending();
            const isOn = !!state && state.denoiseState === true;
            if (state) {
                const feedback = enhanceAmountModel.feedback(state.denoiseAmount, isOn, state.amountOperation);
                if (feedback.shouldSend && !enhanceAmountModel.debouncePending) scheduleDenoiseAmount(enhanceAmountModel.desired);
            }
            enhanceOffButton.classList.toggle("active", !!state && !isOn);
            enhanceOnButton.classList.toggle("active", isOn);
            const localAmountPending = amountPending || enhanceAmountModel.inFlight;
            enhanceOffButton.disabled = pending || localAmountPending || unavailable || !hasPhoto || !inDevelop || !isOn;
            enhanceOnButton.disabled = pending || localAmountPending || unavailable || !hasPhoto || !inDevelop || isOn || state.denoiseEnabled !== true;
            enhanceAmountRange.disabled = pending || unavailable || !hasPhoto || !inDevelop;
            enhanceAmountInput.disabled = enhanceAmountRange.disabled;
            const displayedAmount = enhanceAmountModel.displayedAmount;
            displayDenoiseAmount(displayedAmount, !enhanceAmountModel.editing);
            enhanceMinusButton.disabled = enhanceAmountRange.disabled || !validDenoiseAmount(displayedAmount) || displayedAmount <= 1;
            enhancePlusButton.disabled = enhanceAmountRange.disabled || !validDenoiseAmount(displayedAmount) || displayedAmount >= 100;
            const rawOn = !!state && state.rawDetailsState === true;
            const denoiseOwnsRaw = !!state && state.denoiseState === true && rawOn && state.rawDetailsEnabled === false;
            const superResolutionOwnsRaw = !!state && state.superResState === true && rawOn && state.rawDetailsEnabled === false;
            const rawUnavailable = unavailable || !hasPhoto || !inDevelop || (!!state && state.rawDetailsEnabled !== true);
            rawDetailsOffButton.classList.toggle("active", !!state && !rawOn);
            rawDetailsOnButton.classList.toggle("active", rawOn);
            rawDetailsOffButton.disabled = pending || localAmountPending || rawUnavailable || denoiseOwnsRaw || !rawOn;
            rawDetailsOnButton.disabled = pending || localAmountPending || rawUnavailable || denoiseOwnsRaw || rawOn || (!!state && state.denoiseState === true);
            if (!state) rawDetailsStatus.textContent = "Loading Enhance state…";
            else if (pending && state.operationTarget === "rawDetails") rawDetailsStatus.textContent = state.requestedEnabled === false ? "Removing Raw Details…" : "Applying Raw Details…";
            else if (denoiseOwnsRaw) rawDetailsStatus.textContent = "Raw Details enabled by Denoise";
            else if (superResolutionOwnsRaw) rawDetailsStatus.textContent = "Raw Details enabled by Super Resolution";
            else if (state.operation === "uncertain" && state.operationTarget === "rawDetails") rawDetailsStatus.textContent = "Raw Details result uncertain — check Lightroom";
            else if (state.operation === "failed" && state.operationTarget === "rawDetails") rawDetailsStatus.textContent = "Raw Details failed";
            else if (rawUnavailable) rawDetailsStatus.textContent = "Raw Details unavailable for this photo";
            else rawDetailsStatus.textContent = rawOn ? "Raw Details On" : "Raw Details Off";
            const superResolutionOn = !!state && state.superResState === true;
            const superResolutionUnavailable = unavailable || !hasPhoto || !inDevelop || (!!state && state.superResEnabled !== true);
            superResolutionOffButton.classList.toggle("active", !!state && !superResolutionOn);
            superResolutionOnButton.classList.toggle("active", superResolutionOn);
            superResolutionOffButton.disabled = pending || localAmountPending || superResolutionUnavailable || !superResolutionOn;
            superResolutionOnButton.disabled = pending || localAmountPending || superResolutionUnavailable || superResolutionOn || (!!state && state.denoiseState === true);
            if (!state) superResolutionStatus.textContent = "Loading Enhance state…";
            else if (pending && state.operationTarget === "superResolution") superResolutionStatus.textContent = state.requestedEnabled === false ? "Removing Super Resolution…" : "Applying Super Resolution…";
            else if (state.operation === "uncertain" && state.operationTarget === "superResolution") superResolutionStatus.textContent = "Super Resolution result uncertain — check Lightroom";
            else if (state.operation === "failed" && state.operationTarget === "superResolution") superResolutionStatus.textContent = "Super Resolution failed";
            else if (superResolutionUnavailable) superResolutionStatus.textContent = "Super Resolution unavailable for this photo";
            else superResolutionStatus.textContent = superResolutionOn ? "Super Resolution On" : "Super Resolution Off";
            if (!state) enhanceStatus.textContent = "Loading Enhance state…";
            else if (pending && state.operationTarget === "denoise") enhanceStatus.textContent = state.requestedEnabled === false ? "Removing Denoise…" : "Applying Denoise…";
            else if (localAmountPending) enhanceStatus.textContent = "Updating Denoise Amount…";
            else if (state.amountOperation === "uncertain") enhanceStatus.textContent = "Denoise amount uncertain — check Lightroom";
            else if (state.operation === "uncertain") enhanceStatus.textContent = "Denoise result uncertain — check Lightroom";
            else if (state.operation === "failed") enhanceStatus.textContent = "Denoise failed";
            else if (state.denoiseState === true && state.denoiseAmount !== null) enhanceStatus.textContent = "Denoise On — Amount: " + state.denoiseAmount;
            else if (state.denoiseState === true) enhanceStatus.textContent = "Denoise On";
            else if (!hasPhoto || !inDevelop || unavailable || state.denoiseEnabled !== true) enhanceStatus.textContent = "Denoise unavailable for this photo";
            else enhanceStatus.textContent = "Denoise Off";
        }

        async function requestEnhanceState() {
            if (enhanceRequestInFlight || activeTab !== "sliders") return;
            enhanceRequestInFlight = true;
            try {
                const response = await fetch("/api/enhance/state", { cache: "no-store" });
                if (!response.ok) throw new Error("Enhance state request failed");
                enhanceState = await response.json();
                updateEnhanceControls();
            } catch (err) {
                enhanceState = null;
                updateEnhanceControls();
            } finally {
                enhanceRequestInFlight = false;
            }
        }

        async function setDenoise(enabled) {
            const amount = enabled ? enhanceAmountModel.displayedAmount : (enhanceState && enhanceState.denoiseAmount);
            if (!validDenoiseAmount(amount)) {
                setStatus("ERROR: Denoise amount must be an integer from 1 through 100.");
                return;
            }
            enhanceState = Object.assign({}, enhanceState || {}, { operation: "starting", requestedEnabled: enabled });
            updateEnhanceControls();
            const accepted = await sendCommand("/api/enhance/denoise/set?enabled=" + String(enabled) + "&amount=" + encodeURIComponent(String(amount)));
            if (!accepted) {
                await requestEnhanceState();
                return;
            }
            requestEnhanceState();
        }

        async function setRawDetails(enabled) {
            enhanceState = Object.assign({}, enhanceState || {}, { operation: "starting", operationTarget: "rawDetails", requestedEnabled: enabled });
            updateEnhanceControls();
            const accepted = await sendCommand("/api/enhance/raw-details/set?enabled=" + String(enabled));
            if (!accepted) await requestEnhanceState();
            else requestEnhanceState();
        }

        function renderRawDetailsControl() {
            const controls = document.createElement("div");
            controls.className = "develop-slider-row denoise-slider-row raw-details-row";
            controls.dataset.detailControl = "raw-details";
            const label = document.createElement("div");
            label.className = "slider-name"; label.textContent = "Raw Details";
            rawDetailsOffButton = makeButton("Off", "command-neutral", function () { setRawDetails(false); });
            rawDetailsOnButton = makeButton("On", "command-primary", function () { setRawDetails(true); });
            rawDetailsStatus = document.createElement("div");
            rawDetailsStatus.className = "enhance-status"; rawDetailsStatus.setAttribute("role", "status");
            controls.appendChild(label); controls.appendChild(rawDetailsOffButton); controls.appendChild(rawDetailsOnButton); controls.appendChild(rawDetailsStatus);
            updateEnhanceControls();
            return controls;
        }

        async function setSuperResolution(enabled) {
            enhanceState = Object.assign({}, enhanceState || {}, { operation: "starting", operationTarget: "superResolution", requestedEnabled: enabled });
            updateEnhanceControls();
            const accepted = await sendCommand("/api/enhance/super-resolution/set?enabled=" + String(enabled));
            if (!accepted) await requestEnhanceState(); else requestEnhanceState();
        }

        function renderSuperResolutionControl() {
            const controls = document.createElement("div");
            controls.className = "develop-slider-row denoise-slider-row super-resolution-row";
            controls.dataset.detailControl = "super-resolution";
            const label = document.createElement("div");
            label.className = "slider-name"; label.textContent = "Super Resolution";
            superResolutionOffButton = makeButton("Off", "command-neutral", function () { setSuperResolution(false); });
            superResolutionOnButton = makeButton("On", "command-primary", function () { setSuperResolution(true); });
            superResolutionStatus = document.createElement("div");
            superResolutionStatus.className = "enhance-status"; superResolutionStatus.setAttribute("role", "status");
            controls.appendChild(label); controls.appendChild(superResolutionOffButton); controls.appendChild(superResolutionOnButton); controls.appendChild(superResolutionStatus);
            updateEnhanceControls();
            return controls;
        }

        function renderEnhanceSection() {
            const controls = document.createElement("div");
            controls.className = "develop-slider-row denoise-slider-row";
            controls.dataset.detailControl = "denoise";
            const label = document.createElement("div");
            label.className = "slider-name";
            label.textContent = "Denoise";
            enhanceAmountRange = document.createElement("input");
            enhanceAmountRange.type = "range"; enhanceAmountRange.min = "1"; enhanceAmountRange.max = "100";
            enhanceAmountRange.step = "1"; enhanceAmountRange.value = "50";
            enhanceAmountRange.setAttribute("aria-label", "Denoise amount");
            enhanceAmountInput = document.createElement("input");
            enhanceAmountInput.type = "text"; enhanceAmountInput.inputMode = "numeric"; enhanceAmountInput.value = "50";
            enhanceAmountInput.setAttribute("aria-label", "Denoise amount value");
            enhanceAmountRange.addEventListener("input", function () {
                const value = Number(enhanceAmountRange.value);
                if (!enhanceAmountModel.setDesired(value)) return;
                displayDenoiseAmount(value, true);
                if (enhanceState && enhanceState.denoiseState === true) scheduleDenoiseAmount(value);
                updateEnhanceControls();
            });
            enhanceAmountInput.addEventListener("focus", function () { enhanceAmountModel.focus(enhanceAmountInput.value); });
            enhanceAmountInput.addEventListener("input", function () {
                const value = enhanceAmountModel.input(enhanceAmountInput.value);
                if (value !== null) displayDenoiseAmount(value, false);
            });
            function commitDenoiseNumber() {
                const result = enhanceAmountModel.commit();
                enhanceAmountInput.value = String(result.amount);
                displayDenoiseAmount(result.amount, true);
                if (result.valid && enhanceState && enhanceState.denoiseState === true) scheduleDenoiseAmount(result.amount);
                updateEnhanceControls();
                return result.valid;
            }
            enhanceAmountInput.addEventListener("change", commitDenoiseNumber);
            enhanceAmountInput.addEventListener("blur", commitDenoiseNumber);
            enhanceAmountInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") { event.preventDefault(); commitDenoiseNumber(); enhanceAmountInput.blur(); }
                else if (event.key === "Escape") { event.preventDefault(); const restored = enhanceAmountModel.cancel(); displayDenoiseAmount(restored, true); enhanceAmountInput.blur(); updateEnhanceControls(); }
            });
            enhanceOffButton = makeButton("Off", "command-neutral", function () { setDenoise(false); });
            enhanceOnButton = makeButton("On", "command-primary", function () { setDenoise(true); });
            enhanceOffButton.classList.add("denoise-off");
            enhanceOnButton.classList.add("denoise-on");
            function stepDenoiseAmount(delta) {
                const isOn = !!enhanceState && enhanceState.denoiseState === true;
                const current = enhanceAmountModel.displayedAmount;
                if (!validDenoiseAmount(current)) return false;
                const next = enhanceAmountModel.step(delta);
                if (next === current) return false;
                displayDenoiseAmount(next, true);
                if (isOn) scheduleDenoiseAmount(next);
                else updateEnhanceControls();
                return true;
            }
            enhanceMinusButton = makeButton("−", "develop-slider-step denoise-minus", function () { stepDenoiseAmount(-1); });
            enhancePlusButton = makeButton("+", "develop-slider-step denoise-plus", function () { stepDenoiseAmount(1); });
            enhanceStatus = document.createElement("div");
            enhanceStatus.className = "enhance-status"; enhanceStatus.setAttribute("role", "status");
            controls.appendChild(label); controls.appendChild(enhanceOffButton); controls.appendChild(enhanceOnButton);
            controls.appendChild(enhanceAmountRange); controls.appendChild(enhanceAmountInput);
            controls.appendChild(enhanceMinusButton); controls.appendChild(enhancePlusButton); controls.appendChild(enhanceStatus);
            updateEnhanceControls();
            return controls;
        }

        function renderBasicControlsRow() {
            const basicActions = sliderActionGroups.find(function (group) { return group.name === "Basic Actions"; });
            const autoTone = basicActions && basicActions.actions.find(function (item) { return item.action === "setAutoTone"; });
            const row = document.createElement("div");
            row.className = "basic-controls-row";
            if (autoTone) {
                const autoButton = makeButton("Auto", autoTone.className || "positive", function () {
                    if (isAutoActionCooldownActiveFor(autoTone.action)) return;
                    sendCommand("/api/action?action=" + encodeURIComponent(autoTone.action));
                });
                registerAutoActionButton(autoTone.action, autoButton);
                row.appendChild(autoButton);
            }
            treatmentButton = makeButton("B&W", "command-neutral", toggleTreatment);
            treatmentStatus = document.createElement("span");
            treatmentStatus.className = "basic-controls-status";
            row.appendChild(treatmentButton);
            row.appendChild(treatmentStatus);
            updateTreatmentButton();
            content.appendChild(row);
        }

        function renderSlidersTab() {
            developRenderedSections = {};
            developCategoricalControls = {};
            developLoadingStatus = document.createElement("div");
            developLoadingStatus.className = "develop-loading-status";
            developLoadingStatus.role = "status";
            developLoadingStatus.textContent = (
                typeof hasReceivedAnyAuthoritativeDevelopValue !== "undefined" &&
                hasReceivedAnyAuthoritativeDevelopValue
            ) ? "" : "Loading Lightroom values…";
            content.appendChild(developLoadingStatus);
            renderBasicControlsRow();
            const sections = developSectionDisplayOrder.map(function (section) {
                return {
                    id: section.id,
                    label: getDevelopSectionDisplayLabel(section),
                    selectors: section.selectors,
                    embeddedActionGroups: section.embeddedActionGroups,
                    embeddedSwitchGroups: section.embeddedSwitchGroups,
                    embeddedTrailingSwitchGroups: section.embeddedTrailingSwitchGroups,
                    items: selectDevelopSectionDefinitions(section)
                };
            });
            const mappingError = validateDevelopSectionMapping(sections);
            if (mappingError) {
                const errorElement = document.createElement("section");
                errorElement.className = "group";
                errorElement.textContent = mappingError;
                content.appendChild(errorElement);
                setStatus("ERROR: " + mappingError);
                return;
            }
            renderActionsForPlacement("top");
            const renderedActionPlacements = new Set(["before:Basic"]);
            const renderedSwitchPlacements = new Set();
            const embeddedActionGroupNames = new Set(sections.flatMap(function (section) {
                return section.embeddedActionGroups || [];
            }));
            const embeddedSwitchGroupNames = new Set(sections.flatMap(function (section) {
                return (section.embeddedSwitchGroups || []).concat(section.embeddedTrailingSwitchGroups || []);
            }));

            for (const section of sections) {
                section.selectors.forEach(function (selector) {
                    const placement = "before:" + selector.group;
                    const actionGroupIsEmbedded = sliderActionGroups.some(function (group) {
                        return (group.placement || "top") === placement &&
                            embeddedActionGroupNames.has(group.name);
                    });
                    if (!actionGroupIsEmbedded && !renderedActionPlacements.has(placement)) {
                        renderActionsForPlacement(placement);
                        renderedActionPlacements.add(placement);
                    }
                    const switchGroupIsEmbedded = switchGroups.some(function (group) {
                        return (group.placement || "top") === placement &&
                            embeddedSwitchGroupNames.has(group.name);
                    });
                    if (!switchGroupIsEmbedded && !renderedSwitchPlacements.has(placement)) {
                        renderSwitchesForPlacement(placement);
                        renderedSwitchPlacements.add(placement);
                    }
                });

                const groupElement = createDevelopSectionElement(section);
                content.appendChild(groupElement);
                developRenderedSections[section.id] = groupElement;
            }

            updateDevelopCategoricalControls();
            requestDevelopCategoricalState();

            setTimeout(function () {
                requestLiveFeedbackSnapshot(true);
            }, 0);
        }

        function renderToneCurveTab() {
            developLoadingStatus = document.createElement("div");
            developLoadingStatus.className = "develop-loading-status";
            developLoadingStatus.role = "status";
            developLoadingStatus.textContent = (
                typeof hasReceivedAnyAuthoritativeDevelopValue !== "undefined" &&
                hasReceivedAnyAuthoritativeDevelopValue
            ) ? "" : "Loading Lightroom values…";
            content.appendChild(developLoadingStatus);

            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = "Parametric Curve";
            groupElement.appendChild(title);

            const toneCurveDefinitionsById = new Map();
            developSliderDefinitions.filter(function (definition) {
                return definition.group === "Tone Curve";
            }).forEach(function (definition) {
                toneCurveDefinitionsById.set(definition.id, definition);
            });
            toneCurveDisplayOrder.forEach(function (sliderId) {
                const definition = toneCurveDefinitionsById.get(sliderId);
                if (!definition) return;
                groupElement.appendChild(createDevelopSliderControl(definition));
            });
            content.appendChild(groupElement);

            setTimeout(function () {
                requestLiveFeedbackSnapshot(true);
                requestEnhanceState();
            }, 0);
        }

        function renderToolTab(tab) {
            const groupElement = document.createElement("section");
            groupElement.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = tab.title;

            groupElement.appendChild(title);

            for (const item of tab.actions) {
                addActionRow(groupElement, item);
            }

            content.appendChild(groupElement);
        }

        function renderRetouchingTab() {
            ["healing", "redEye", "masking"].forEach(function (tabId) {
                const tab = toolTabs.find(function (item) {
                    return item.id === tabId;
                });
                if (tab) renderToolTab(tab);
            });
        }

        function render() {
            renderTabs();

            const colorGradingActive = activeTab === "color-grading";
            content.hidden = colorGradingActive;
            document.getElementById("colorGradingWorkspace").hidden = !colorGradingActive;
            if (colorGradingActive) {
                deactivateDevelopFeedbackPolling();
                colorGradingController.activate();
                return;
            }

            colorGradingController.deactivate();
            if (activeTab !== "sliders") invalidateTreatmentState();
            if (activeTab !== "sliders") {
                lensBlurModel.applyAuthoritative(null);
                updateLensBlurPresentation();
            }
            if (!isGenericDevelopFeedbackTab(activeTab)) deactivateDevelopFeedbackPolling();
            clearContent();

            if (activeTab === "sliders") {
                renderSlidersTab();
                activateDevelopFeedbackPolling();
                return;
            }

            if (activeTab === "tone-curve") {
                renderToneCurveTab();
                activateDevelopFeedbackPolling();
                return;
            }

            if (activeTab === "selection") {
                renderCommandGroups(selectionGroups);
                return;
            }

            if (activeTab === "crop") {
                renderCommandGroups(cropGroups);
                return;
            }

            if (activeTab === "application") {
                renderCommandGroups(applicationGroups);
                return;
            }

            if (activeTab === "retouching") {
                renderRetouchingTab();
                return;
            }
        }

        async function loadDevelopSliderDefinitions() {
            const response = await fetch("/api/sliders", { cache: "no-store" });
            if (!response.ok) throw new Error("Slider metadata request failed");
            const data = await response.json();
            developSliderDefinitions = (data.sliders || []).filter(function (definition) {
                return definition.feedbackSupported === true;
            });
        }

        loadDevelopSliderDefinitions().then(function () {
            render();
            startLiveFeedbackPolling();
        }).catch(function () {
            renderTabs();
            clearContent();
            setStatus("ERROR: Could not load authoritative slider metadata.");
        });

        const colorGradingController = LRBridgeColorGrading.createController({
            document: document,
            window: window,
            fetch: window.fetch.bind(window),
            setStatus: setStatus,
            elements: {
                cgStatus: document.getElementById("colorGradingStatus"),
                cgContent: document.getElementById("colorGradingContent"),
                viewButtons: []
            }
        });
        colorGradingController.initialize();
        window.addEventListener("hashchange", function () {
            const hash = window.location.hash.replace(/^#/, "");
            selectControllerTab(normalizeControllerTab(hash === "develop" ? "sliders" : hash), false);
        });
    </script>
</body>
</html>
