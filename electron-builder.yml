appId: com.nino.lrbridge
productName: LRBridge
asar: true

directories:
  output: dist

files:
  - app/**/*
  - bridge.js
  - server/**/*
  - config/sliders.json
  - lightroom/LRBridge.lrplugin/color-grading.properties
  - package.json

extraResources:
  - from: server/windows-lightroom-native.ps1
    to: native/windows-lightroom-native.ps1

extraFiles:
  - from: runtime/config
    to: config
    filter:
      - sliders.json
      - settings.txt
      - develop-presets.json
  - from: runtime/lightroom
    to: lightroom
  - from: README.md
    to: README.md
  - from: docs
    to: docs
  - from: llms.txt
    to: llms.txt
  - from: resources/presets
    to: resources/presets
  - from: tools/install-runtime-presets.ps1
    to: tools/install-runtime-presets.ps1
  - from: Install Dust Presets.cmd
    to: Install Dust Presets.cmd

win:
  icon: build/icon.ico
  target:
    - target: dir
      arch:
        - x64
